<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf8ef;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui;padding-bottom:48px}
.info{text-align:center;margin-bottom:8px}
.title{font-size:32px;font-weight:900;color:#776e65}
.desc{font-size:13px;color:#a39480}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#bbada0;padding:8px;border-radius:12px;width:90vmin;height:90vmin;max-width:500px;max-height:500px}
.tile{aspect-ratio:1;background:#cdc1b4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:5vmin;font-weight:800;color:#776e65;transition:0.1s}
.tile[data-value="2"]{background:#eee4da}.tile[data-value="4"]{background:#ede0c8}.tile[data-value="8"]{background:#f2b179;color:#f9f6f2}.tile[data-value="16"]{background:#f59563;color:#f9f6f2}.tile[data-value="32"]{background:#f67c5f;color:#f9f6f2}.tile[data-value="64"]{background:#f65e3b;color:#f9f6f2}.tile[data-value="128"]{background:#edcf72;color:#f9f6f2}.tile[data-value="256"]{background:#edcc61;color:#f9f6f2}.tile[data-value="512"]{background:#edc850;color:#f9f6f2}.tile[data-value="1024"]{background:#edc53f;color:#f9f6f2}.tile[data-value="2048"]{background:#edc22e;color:#f9f6f2}
.controls{margin-top:12px;display:flex;gap:12px;align-items:center}
.controls button{background:#8f7a66;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
.social-actions{display:flex;gap:16px;margin-left:12px}
.social-btn{width:44px;height:44px;border-radius:50%;background:#8f7a66;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;position:relative;transition:0.2s}
.social-btn.liked{background:#edc22e}
.social-btn.collected{background:#f2b179}
.social-btn .count{position:absolute;bottom:-8px;font-size:10px;font-weight:700;background:#776e65;color:#fff;padding:2px 6px;border-radius:10px}
.nav-btns{display:flex;gap:4px}
.nav-btns button{width:36px;height:36px;border-radius:50%;background:#8f7a66;color:#fff;border:none;font-size:18px;cursor:pointer}
.victory-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;background:rgba(0,0,0,0.2)}
.victory-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8vmin;font-weight:900;color:#fff;text-shadow:0 0 20px #ffd700;animation:blink 0.5s infinite alternate}
@keyframes blink{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0.8;transform:translate(-50%,-50%) scale(1.05)}}
</style>
</head>
<body>
<div class="info">
  <div class="title">🔢 2048</div>
  <div class="desc">手机滑动屏幕 / 电脑按方向键合并数字</div>
</div>
<div id="board"></div>
<div class="controls">
  <button id="muteBtn">🔊 静音</button>
  <button id="restartBtn">↺ 重新开始</button>
  <div class="social-actions">
    <div class="nav-btns">
      <button class="nav-up">▲</button>
      <button class="nav-down">▼</button>
    </div>
    <div class="social-btn like-btn" id="likeBtn">❤️<span class="count" id="likeCount">0</span></div>
    <div class="social-btn collect-btn" id="collectBtn">⭐</div>
  </div>
</div>
<script>
const GAME_ID='2048';
let audioCtx=null, musicInterval=null, isMuted=false, isActive=true;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx||isMuted) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='move'){ osc.frequency.setValueAtTime(300,audioCtx.currentTime); gain.gain.setValueAtTime(0.05,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='merge'){ osc.frequency.setValueAtTime(500,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800,audioCtx.currentTime+0.15); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15); osc.start(); osc.stop(audioCtx.currentTime+0.15); }
  else if(type==='win'){ osc.type='triangle'; osc.frequency.setValueAtTime(523,audioCtx.currentTime); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.8); osc.start(); osc.stop(audioCtx.currentTime+0.8); }
}
function startMusic(){
  if(musicInterval||isMuted||!isActive) return;
  const notes=[262,330,392,523,392,330,262,196];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx||isMuted||!isActive) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.03,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
    i++;
  },500);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function playFireworkSound(){
  if(!audioCtx||isMuted) return;
  const bufferSize=audioCtx.sampleRate*0.5;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*0.1));
  const source=audioCtx.createBufferSource(); source.buffer=buffer;
  const gain=audioCtx.createGain(); gain.gain.setValueAtTime(0.5,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);
  source.connect(gain); gain.connect(audioCtx.destination); source.start(); source.stop(audioCtx.currentTime+0.5);
}
function toggleMute(){
  isMuted=!isMuted;
  document.getElementById('muteBtn').textContent=isMuted?'🔇 已静音':'🔊 静音';
  if(isMuted){ stopMusic(); } else if(isActive){ startMusic(); }
}
document.getElementById('muteBtn').addEventListener('click',toggleMute);
document.querySelector('.nav-up').addEventListener('click',()=>window.parent.postMessage({type:'nav',direction:'up'},'*'));
document.querySelector('.nav-down').addEventListener('click',()=>window.parent.postMessage({type:'nav',direction:'down'},'*'));

function updateSocial(){
  const likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  document.getElementById('likeCount').textContent=likes;
  document.getElementById('likeBtn').classList.toggle('liked',likes>0);
  const favs=JSON.parse(localStorage.getItem('favs')||'[]');
  document.getElementById('collectBtn').classList.toggle('collected',favs.includes(GAME_ID));
}
document.getElementById('likeBtn').addEventListener('click',()=>{
  let likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  if(likes>=999) return alert('点赞已达上限 999 ❤️');
  likes++; localStorage.setItem('like_'+GAME_ID,likes); updateSocial();
  if(navigator.vibrate) navigator.vibrate(10);
});
document.getElementById('collectBtn').addEventListener('click',()=>{
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  const idx=favs.indexOf(GAME_ID);
  if(idx>-1) favs.splice(idx,1); else favs.push(GAME_ID);
  localStorage.setItem('favs',JSON.stringify(favs)); updateSocial();
});
updateSocial();
function notifyPlayed(){ window.parent.postMessage({type:'played',gameId:GAME_ID},'*'); }

window.addEventListener('message',(e)=>{
  if(e.data&&e.data.type==='setActive'){
    isActive=e.data.active;
    if(isActive&&!isMuted){ startMusic(); } else{ stopMusic(); }
  }
});

let grid, winTriggered=false;
function init(){ grid=Array(4).fill().map(()=>Array(4).fill(0)); winTriggered=false; addRandom(); addRandom(); draw(); stopMusic(); startMusic(); const ov=document.querySelector('.victory-overlay'); if(ov) ov.remove(); notifyPlayed(); }
function addRandom(){ let empty=[]; grid.forEach((r,i)=>r.forEach((v,j)=>{if(v===0)empty.push([i,j])})); if(empty.length){ let[i,j]=empty[Math.floor(Math.random()*empty.length)]; grid[i][j]=Math.random()<0.9?2:4; } }
function draw(){ const b=document.getElementById('board'); b.innerHTML=''; grid.flat().forEach(v=>{ const d=document.createElement('div'); d.className='tile'; if(v){ d.textContent=v; d.setAttribute('data-value',v); } b.appendChild(d); }); }
function checkWin(){ if(grid.flat().some(v=>v===2048) && !winTriggered){ winTriggered=true; stopMusic(); playSound('win'); showVictory(); setTimeout(init,3000); } }
function showVictory(){
  const ov=document.createElement('div'); ov.className='victory-overlay';
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    ov.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.className='victory-text'; txt.textContent='🎉 恭喜成功！';
  ov.appendChild(txt); document.body.appendChild(ov); playFireworkSound();
  setTimeout(()=>ov.remove(),3000);
}
function move(dir){
  let moved=false;
  if(dir==='left'){ for(let r=0;r<4;r++){ let row=grid[r].filter(v=>v); for(let i=0;i<row.length-1;i++) if(row[i]===row[i+1]){ row[i]*=2; row[i+1]=0; playSound('merge'); } row=row.filter(v=>v); while(row.length<4) row.push(0); if(row.join(',')!==grid[r].join(',')) moved=true; grid[r]=row; } }
  else if(dir==='right'){ for(let r=0;r<4;r++){ let row=grid[r].filter(v=>v); row.reverse(); for(let i=0;i<row.length-1;i++) if(row[i]===row[i+1]){ row[i]*=2; row[i+1]=0; playSound('merge'); } row=row.filter(v=>v); while(row.length<4) row.unshift(0); if(row.join(',')!==grid[r].join(',')) moved=true; grid[r]=row; } }
  else if(dir==='up'){ for(let c=0;c<4;c++){ let col=[grid[0][c],grid[1][c],grid[2][c],grid[3][c]].filter(v=>v); for(let i=0;i<col.length-1;i++) if(col[i]===col[i+1]){ col[i]*=2; col[i+1]=0; playSound('merge'); } col=col.filter(v=>v); while(col.length<4) col.push(0); for(let r=0;r<4;r++){ if(grid[r][c]!==col[r]) moved=true; grid[r][c]=col[r]; } } }
  else if(dir==='down'){ for(let c=0;c<4;c++){ let col=[grid[0][c],grid[1][c],grid[2][c],grid[3][c]].filter(v=>v); col.reverse(); for(let i=0;i<col.length-1;i++) if(col[i]===col[i+1]){ col[i]*=2; col[i+1]=0; playSound('merge'); } col=col.filter(v=>v); while(col.length<4) col.unshift(0); for(let r=0;r<4;r++){ if(grid[r][c]!==col[r]) moved=true; grid[r][c]=col[r]; } } }
  if(moved){ playSound('move'); addRandom(); draw(); checkWin(); }
}
let startX,startY;
document.addEventListener('keydown',e=>{ initAudio(); if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){ e.preventDefault(); move(e.key.slice(5).toLowerCase()); } });
document.addEventListener('touchstart',e=>{ startX=e.touches[0].clientX; startY=e.touches[0].clientY; });
document.addEventListener('touchend',e=>{ initAudio(); const dx=e.changedTouches[0].clientX-startX, dy=e.changedTouches[0].clientY-startY; if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up'); });
document.getElementById('restartBtn').onclick=init;
init();
</script>
</body>
</html>
