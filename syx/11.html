<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎮 游戏盒子 · 25款合集</title>
    <style>
        :root {
            --bg: #faf8ef;
            --panel: #bbada0;
            --gold: #f9f6f2;
            --accent: #f59563;
            --accent2: #f65e3b;
            --tile2: #eee4da;
            --tile4: #ede0c8;
            --tile8: #f2b179;
            --tile16: #f59563;
            --tile32: #f67c5f;
            --tile64: #f65e3b;
            --tile128: #edcf72;
            --tile256: #edcc61;
            --tile512: #edc850;
            --tile1024: #edc53f;
            --tile2048: #edc22e;
            --text: #776e65;
            --light: #fff;
            --heart: #ff6b81;
            --star: #ffa502;
            --updown: #8b7d6b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #faf8ef;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: pan-y;
        }
        #main-container {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }
        #main-container::-webkit-scrollbar { display: none; }
        .game-slide {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(180deg, #fdfbf7 0%, #faf8ef 40%, #f5efe6 100%);
            padding: 10px;
            overflow: hidden;
        }
        .game-title {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: 700;
            color: #776e65;
            margin-bottom: 2px;
            letter-spacing: 1px;
            text-align: center;
            z-index: 2;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .game-area {
            position: relative;
            z-index: 2;
            border-radius: 16px;
            background: #bbada0;
            padding: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .game-tip {
            font-size: 0.7rem;
            color: #998f85;
            margin-top: 4px;
            text-align: center;
            z-index: 2;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        .bottom-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 2px 8px;
            flex-shrink: 0;
        }
        .bottom-bar button {
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 3px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            padding: 7px 13px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        .bottom-bar button:active { transform: scale(0.93); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .btn-nav { background: #e8e0d5; color: #776e65; font-size: 1.1rem; padding: 7px 14px; min-width: 42px; justify-content: center; }
        .btn-nav:hover { background: #d6cec2; }
        .btn-like { background: #fff0f3; color: #ff6b81; font-size: 0.8rem; }
        .btn-like.liked { background: #ff6b81; color: #fff; animation: pulse 0.4s ease; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }
        .btn-fav { background: #fff8e7; color: #ffa502; font-size: 0.8rem; }
        .btn-fav.favorited { background: #ffa502; color: #fff; }
        .btn-mute {
            position: fixed; top: 15px; right: 15px; z-index: 999; border: none; cursor: pointer;
            border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem;
            background: rgba(255,255,255,0.9); box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .btn-mute:active { transform: scale(0.9); }
        #firework-canvas { position: fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9999; }
        .congrats-overlay {
            position: fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9998;
            display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.3s;
        }
        .congrats-overlay.active { opacity:1; }
        .congrats-text {
            font-size: clamp(2rem,6vw,3.5rem); font-weight:900; color:#fff;
            text-shadow:0 0 30px #ff6b81,0 0 60px #ffa502,0 0 90px #ff6b81,0 4px 8px rgba(0,0,0,0.3);
            animation: congratsBlink 0.5s ease-in-out infinite alternate; letter-spacing:4px;
        }
        @keyframes congratsBlink { 0%{transform:scale(1);opacity:0.85;} 100%{transform:scale(1.12);opacity:1;} }
        .stats-footer {
            position: fixed; bottom:0; left:0; right:0; z-index:100; background:rgba(255,255,255,0.95);
            backdrop-filter:blur(10px); border-top:2px solid #e8e0d5; padding:6px 10px;
            display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
            font-size:0.7rem; color:#776e65; box-shadow:0 -2px 12px rgba(0,0,0,0.05); min-height:38px;
        }
        .stats-footer span {
            cursor:pointer; background:#f5efe6; border-radius:14px; padding:4px 10px;
            font-weight:600; transition:all 0.2s; white-space:nowrap; letter-spacing:0.5px;
        }
        .stats-footer span:active { background:#e8e0d5; transform:scale(0.95); }
        .modal-overlay {
            position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5);
            z-index:10000; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.2s;
        }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .modal-box {
            background:#fff; border-radius:20px; padding:20px; max-width:420px; width:90%;
            max-height:70vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,0.2); position:relative;
        }
        .modal-box h3 { color:#776e65; margin-bottom:12px; font-size:1.1rem; text-align:center; }
        .modal-box .item-row { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:12px; background:#faf8ef; margin:6px 0; font-size:0.85rem; color:#776e65; }
        .modal-box .item-row button { border:none; background:#ff6b81; color:#fff; border-radius:15px; padding:5px 12px; cursor:pointer; font-size:0.7rem; font-weight:600; }
        .modal-close {
            position:absolute; top:10px; right:15px; border:none; background:#e8e0d5; color:#776e65;
            border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:1rem; font-weight:700;
            display:flex; align-items:center; justify-content:center;
        }
        @media (max-width:480px) {
            .bottom-bar button { padding:6px 10px; font-size:0.7rem; gap:2px; border-radius:20px; }
            .bottom-bar { gap:3px; padding:2px 4px; }
            .game-area { padding:5px; border-radius:12px; }
            .stats-footer { font-size:0.65rem; gap:4px; padding:4px 6px; }
            .stats-footer span { padding:3px 7px; border-radius:10px; }
        }
    </style>
</head>
<body>
<button class="btn-mute" id="btnMute" title="静音/取消静音">🔊</button>
<canvas id="firework-canvas"></canvas>
<div class="congrats-overlay" id="congratsOverlay"><span class="congrats-text">🎉 恭喜成功！🎉</span></div>
<div id="main-container"></div>
<div class="stats-footer" id="statsFooter">
    <span id="statUser">👤 <span id="usernameDisplay"></span></span>
    <span id="statPlayed">🟢 已玩:<b id="playedCount">0</b></span>
    <span id="statFav">⭐ 收藏:<b id="favCount">0</b></span>
    <span id="statLike">❤️ 点赞:<b id="likeTotalCount">0</b></span>
</div>
<script>
(function(){
// ==================== 25个游戏数据 ====================
const GAME_IDS = [
    'game2048','whackmole','memorymatch','snake','catchfall','brickbreak','quicktap',
    'tictactoe','rockpaperscissors','reaction','simon','colorspot','slidepuzzle','maze',
    'typing','dodge','digitspan','bubblepop','mathquiz','colororder','jumpgame',
    'shoottarget','balanceball','guessnumber','pianotiles'
];
const GAME_NAMES = [
    '✨ 2048数字合并','🔨 打地鼠','🧠 记忆翻牌','🐍 贪吃蛇','🍎 接住掉落','🧱 弹球打砖','⚡ 快速点击',
    '⭕ 井字棋','✂️ 石头剪刀布','⚡ 反应速度','🔢 序列记忆','🎨 颜色辨别','🧩 数字拼图','🌀 迷宫',
    '⌨️ 打字速度','🏃 躲避障碍','🔢 数字记忆','🫧 气泡消除','🧮 算术挑战','🌈 颜色排序',
    '🐦 跳跃游戏','🎯 射击靶子','⚖️ 平衡球','❓ 猜数字','🎹 钢琴块'
];
const GAME_TIPS = [
    '手机滑动数字块 / 电脑按方向键合并数字',
    '手机点击地鼠 / 电脑鼠标点击地鼠',
    '手机点击翻牌 / 电脑鼠标点击卡片配对',
    '手机滑动方向 / 电脑方向键控制蛇',
    '手机左右滑动 / 电脑方向键移动接物',
    '手机滑动 / 电脑鼠标移动挡板反弹球',
    '手机点击目标 / 电脑鼠标快速点击圆圈',
    '手机点击格子 / 电脑鼠标点击下棋',
    '手机点击选择 / 电脑鼠标选择手势',
    '手机点击屏幕 / 电脑点击鼠标测试反应',
    '手机点击彩色按钮 / 电脑鼠标重复序列',
    '手机点击不同色块 / 电脑鼠标点击',
    '手机点击数字滑动 / 电脑鼠标点击拼图',
    '手机滑动方向 / 电脑方向键走迷宫',
    '手机键盘输入字母 / 电脑键盘打字',
    '手机左右滑动 / 电脑方向键躲避',
    '手机点击数字键盘 / 电脑数字键输入',
    '手机点击气泡 / 电脑鼠标点击消除',
    '手机点击数字 / 电脑鼠标选择答案',
    '手机点击色块 / 电脑鼠标按顺序点击',
    '手机点击屏幕 / 电脑空格键跳跃',
    '手机点击靶子 / 电脑鼠标射击',
    '手机倾斜设备 / 电脑方向键控制球',
    '手机输入数字 / 电脑键盘输入猜数',
    '手机点击黑块 / 电脑鼠标点击下落块'
];

// ==================== 全局状态 ====================
let currentSlideIndex = 0;
let isMuted = false;
let totalLikeCount = 0;
const gameActives = new Array(GAME_IDS.length).fill(false);

function getStore(){
    let d=localStorage.getItem('gamebox_data');
    if(d){try{return JSON.parse(d);}catch(e){}}
    return {username:'',playedGames:[],likedGames:{},favoritedGames:{}};
}
function saveStore(s){localStorage.setItem('gamebox_data',JSON.stringify(s));}
let store=getStore();
if(!store.username){
    const names=['游戏达人','快乐玩家','幸运之星','冒险家','小可爱','挑战者','开心果','闪电侠','梦想家','冠军选手'];
    store.username=names[Math.floor(Math.random()*names.length)]+Math.floor(Math.random()*900+100);
    saveStore(store);
}
document.getElementById('usernameDisplay').textContent=store.username;
function updateStatsFooter(){
    document.getElementById('playedCount').textContent=store.playedGames.length;
    document.getElementById('favCount').textContent=Object.keys(store.favoritedGames).length;
    totalLikeCount=0; for(let k in store.likedGames) totalLikeCount+=Math.min(store.likedGames[k],999);
    document.getElementById('likeTotalCount').textContent=totalLikeCount;
}
updateStatsFooter();

// 音效系统
let audioCtx=null;
function getAudioCtx(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playBeep(f,d,t='sine',v=0.08){if(isMuted)return;try{const ctx=getAudioCtx();const o=ctx.createOscillator();const g=ctx.createGain();o.type=t;o.frequency.setValueAtTime(f,ctx.currentTime);g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime);o.stop(ctx.currentTime+d);}catch(e){}}
function sfxClick(){playBeep(600,0.08,'sine',0.06);}
function sfxLike(){playBeep(880,0.12,'sine',0.07);setTimeout(()=>playBeep(1100,0.1,'sine',0.05),80);}
function sfxFav(){playBeep(520,0.15,'triangle',0.07);}
function sfxGameOver(){playBeep(200,0.3,'square',0.05);setTimeout(()=>playBeep(150,0.4,'square',0.04),200);}
function sfxWin(){playBeep(523,0.12);setTimeout(()=>playBeep(659,0.12),100);setTimeout(()=>playBeep(784,0.12),200);setTimeout(()=>playBeep(1047,0.25),300);}
function sfxFirework(){playBeep(80,0.5,'sawtooth',0.04);setTimeout(()=>playBeep(120,0.3,'sawtooth',0.03),150);}
function sfxPop(){playBeep(400,0.06,'sine',0.05);}

// 烟花
const fwCanvas=document.getElementById('firework-canvas');const fwCtx=fwCanvas.getContext('2d');
let fireworks=[],fwRunning=false,fwRAF=null;
function resizeFwCanvas(){fwCanvas.width=window.innerWidth;fwCanvas.height=window.innerHeight;}resizeFwCanvas();window.addEventListener('resize',resizeFwCanvas);
class Particle{constructor(x,y,color){this.x=x;this.y=y;const a=Math.random()*Math.PI*2;const s=Math.random()*6+2;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s-Math.random()*4;this.life=1;this.decay=Math.random()*0.015+0.008;this.color=color;this.size=Math.random()*3+1.5;}update(){this.x+=this.vx;this.vy+=0.06;this.y+=this.vy;this.life-=this.decay;this.size*=0.995;}draw(ctx){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}}
function spawnFirework(x,y){const colors=['#ff6b81','#ffa502','#ffda79','#ff4757','#2ed573','#1e90ff','#ff6348','#7bed9f','#eccc68','#ff9ff3','#54a0ff','#5f27cd'];const color=colors[Math.floor(Math.random()*colors.length)];for(let i=0;i<50+Math.random()*40;i++) fireworks.push(new Particle(x,y,color));}
function launchFireworks(count=8){for(let i=0;i<count;i++){setTimeout(()=>{const x=Math.random()*fwCanvas.width;const y=Math.random()*fwCanvas.height*0.7;spawnFirework(x,y);sfxFirework();},i*180+Math.random()*100);}}
function animateFireworks(){if(!fwRunning&&fireworks.length===0){fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);fwRAF=null;return;}fwCtx.fillStyle='rgba(0,0,0,0.12)';fwCtx.fillRect(0,0,fwCanvas.width,fwCanvas.height);for(let i=fireworks.length-1;i>=0;i--){fireworks[i].update();fireworks[i].draw(fwCtx);if(fireworks[i].life<=0)fireworks.splice(i,1);}if(fireworks.length===0&&fwRunning)fwRunning=false;fwRAF=requestAnimationFrame(animateFireworks);}
function startFireworks(d=2500){fwRunning=true;launchFireworks(6);if(!fwRAF)fwRAF=requestAnimationFrame(animateFireworks);setTimeout(()=>launchFireworks(4),1200);setTimeout(()=>{fwRunning=false;},d);}
function showCongrats(){document.getElementById('congratsOverlay').classList.add('active');sfxWin();startFireworks(3000);setTimeout(()=>document.getElementById('congratsOverlay').classList.remove('active'),2800);}

// 静音
const btnMute=document.getElementById('btnMute');btnMute.addEventListener('click',()=>{isMuted=!isMuted;btnMute.textContent=isMuted?'🔇':'🔊';if(!isMuted)sfxClick();});

// 构建25个slide
const mainContainer=document.getElementById('main-container');
const allSlideRefs=[];
for(let i=0;i<GAME_IDS.length;i++){
    const slide=document.createElement('div');slide.className='game-slide';
    slide.setAttribute('data-game-id',GAME_IDS[i]);slide.setAttribute('data-index',i);
    slide.innerHTML=`
        <div class="game-title">${GAME_NAMES[i]}</div>
        <div class="game-area" id="gameArea${i}"></div>
        <div class="game-tip">💡 ${GAME_TIPS[i]}</div>
        <div class="bottom-bar">
            <button class="btn-nav btn-up" data-target="${i}">▲</button>
            <button class="btn-like" data-game-id="${GAME_IDS[i]}">❤️ <span class="like-count">0</span></button>
            <button class="btn-fav" data-game-id="${GAME_IDS[i]}">⭐ <span class="fav-text">收藏</span></button>
            <button class="btn-nav btn-down" data-target="${i}">▼</button>
        </div>`;
    mainContainer.appendChild(slide);allSlideRefs.push(slide);
}
function refreshAllButtons(){
    allSlideRefs.forEach((slide,idx)=>{
        const gid=GAME_IDS[idx];const likeBtn=slide.querySelector('.btn-like');const favBtn=slide.querySelector('.btn-fav');
        const likeCountSpan=slide.querySelector('.like-count');const favTextSpan=slide.querySelector('.fav-text');
        const lc=store.likedGames[gid]||0;likeCountSpan.textContent=lc>0?lc:'0';
        if(lc>0)likeBtn.classList.add('liked');else likeBtn.classList.remove('liked');
        if(store.favoritedGames[gid]){favBtn.classList.add('favorited');favTextSpan.textContent='已收藏';}
        else{favBtn.classList.remove('favorited');favTextSpan.textContent='收藏';}
    });updateStatsFooter();
}
refreshAllButtons();

// 滚动处理
mainContainer.addEventListener('scroll',()=>{
    const slides=mainContainer.querySelectorAll('.game-slide');let minDist=Infinity,closest=0;
    slides.forEach((s,i)=>{const rect=s.getBoundingClientRect();const dist=Math.abs(rect.top);if(dist<minDist){minDist=dist;closest=i;}});
    if(currentSlideIndex!==closest){
        gameActives[currentSlideIndex]=false;
        currentSlideIndex=closest;
        gameActives[currentSlideIndex]=true;
    }
});
// 初始激活第一个
gameActives[0]=true;

// 上下按钮
document.addEventListener('click',(e)=>{
    const btnUp=e.target.closest('.btn-up');const btnDown=e.target.closest('.btn-down');
    if(btnUp||btnDown){
        e.preventDefault();e.stopPropagation();
        const idx=parseInt(btnUp?btnUp.getAttribute('data-target'):btnDown.getAttribute('data-target'));
        let newIdx;if(btnUp)newIdx=(idx-1+GAME_IDS.length)%GAME_IDS.length;else newIdx=(idx+1)%GAME_IDS.length;
        allSlideRefs[newIdx].scrollIntoView({behavior:'smooth',block:'start'});
        gameActives[currentSlideIndex]=false;currentSlideIndex=newIdx;gameActives[currentSlideIndex]=true;sfxClick();
    }
});
// 点赞/收藏
document.addEventListener('click',(e)=>{
    const btnLike=e.target.closest('.btn-like');if(btnLike){
        e.preventDefault();e.stopPropagation();const gid=btnLike.getAttribute('data-game-id');
        let cur=store.likedGames[gid]||0;if(cur<999){cur++;store.likedGames[gid]=cur;}saveStore(store);refreshAllButtons();sfxLike();
    }
    const btnFav=e.target.closest('.btn-fav');if(btnFav){
        e.preventDefault();e.stopPropagation();const gid=btnFav.getAttribute('data-game-id');
        if(store.favoritedGames[gid]){delete store.favoritedGames[gid];}else{store.favoritedGames[gid]=true;}saveStore(store);refreshAllButtons();sfxFav();
    }
});
// 底部统计弹窗
function showModal(title,items,onDelete){
    const overlay=document.createElement('div');overlay.className='modal-overlay';
    const box=document.createElement('div');box.className='modal-box';
    let html=`<button class="modal-close">✕</button><h3>${title}</h3>`;
    if(items.length===0)html+='<p style="text-align:center;color:#998f85;">暂无记录</p>';
    else items.forEach((item,i)=>{html+=`<div class="item-row"><span>${item.label}</span><button data-del="${i}">删除</button></div>`;});
    box.innerHTML=html;overlay.appendChild(box);document.body.appendChild(overlay);
    const close=()=>overlay.remove();box.querySelector('.modal-close').addEventListener('click',close);
    overlay.addEventListener('click',(e)=>{if(e.target===overlay)close();});
    box.querySelectorAll('button[data-del]').forEach(btn=>{btn.addEventListener('click',()=>{const idx=parseInt(btn.getAttribute('data-del'));onDelete(idx,items);close();});});
}
document.getElementById('statPlayed').addEventListener('click',()=>{
    const items=store.playedGames.map((gid,i)=>({label:GAME_NAMES[GAME_IDS.indexOf(gid)]||gid,gid}));
    showModal('🟢 已玩游戏',items,(idx)=>{store.playedGames.splice(idx,1);saveStore(store);refreshAllButtons();});
});
document.getElementById('statFav').addEventListener('click',()=>{

})();

// 21:射击靶子
(function(){const area=getArea(21);const sw=300,sh=250;area.style.width=sw+'px';area.style.height=sh+'px';area.style.background='#bbada0';area.style.borderRadius='12px';area.style.overflow='hidden';area.style.position='relative';
let targetX=100,targetY=100,targetDX=2,targetDY=1.5,shootScore=0,targetShoot=8;
function updateShoot(){if(!gameActives[21])return;targetX+=targetDX;targetY+=targetDY;if(targetX<20||targetX>sw-20)targetDX*=-1;if(targetY<20||targetY>sh-20)targetDY*=-1;renderShoot();}
function renderShoot(){area.innerHTML='';const t=document.createElement('div');t.style.cssText=`position:absolute;left:${targetX-15}px;top:${targetY-15}px;width:30px;height:30px;background:#ff6b81;border-radius:50%;cursor:crosshair;`;
t.addEventListener('click',(e)=>{e.stopPropagation();shootScore++;markPlayed(GAME_IDS[21]);sfxPop();if(shootScore>=targetShoot){showCongrats();}});area.appendChild(t);}
let shootInterval;function startShoot(){targetX=100;targetY=100;shootScore=0;clearInterval(shootInterval);shootInterval=setInterval(updateShoot,30);}
startShoot();area._reset=startShoot;area._stop=()=>clearInterval(shootInterval);
})();

// 22:平衡球
(function(){const area=getArea(22);const bw3=300,bh3=300;area.style.width=bw3+'px';area.style.height=bh3+'px';area.style.background='#bbada0';area.style.borderRadius='12px';area.style.position='relative';
const ball=document.createElement('div');ball.style.cssText='position:absolute;width:20px;height:20px;background:#f65e3b;border-radius:50%;left:140px;top:20px;';area.appendChild(ball);
const hole=document.createElement('div');hole.style.cssText='position:absolute;width:25px;height:25px;background:#2ed573;border-radius:50%;right:20px;bottom:20px;';area.appendChild(hole);
let bx=140,by=20;const tiltStep=5;
document.addEventListener('keydown',function k(e){if(currentSlideIndex!==22)return;if(e.key.startsWith('Arrow')){e.preventDefault();
let nx=bx,ny=by;if(e.key==='ArrowLeft')nx-=tiltStep;if(e.key==='ArrowRight')nx+=tiltStep;if(e.key==='ArrowUp')ny-=tiltStep;if(e.key==='ArrowDown')ny+=tiltStep;
bx=Math.max(0,Math.min(bw3-20,nx));by=Math.max(0,Math.min(bh3-20,ny));ball.style.left=bx+'px';ball.style.top=by+'px';
if(bx>bw3-50&&by>bh3-50){markPlayed(GAME_IDS[22]);showCongrats();bx=140;by=20;ball.style.left='140px';ball.style.top='20px';}}});
area._reset=()=>{bx=140;by=20;ball.style.left='140px';ball.style.top='20px';};
})();

// 23:猜数字
(function(){const area=getArea(23);area.style.width='280px';area.style.height='150px';area.style.background='#bbada0';area.style.borderRadius='12px';area.style.display='flex';area.style.alignItems='center';area.style.justifyContent='center';area.style.flexDirection='column';
let secret=Math.floor(Math.random()*100)+1,attempts=0;const hint=document.createElement('div');hint.style.color='#fff';hint.style.fontSize='1.2rem';area.appendChild(hint);
const input=document.createElement('input');input.type='number';input.style.margin='8px';input.style.borderRadius='8px';input.style.padding='5px';area.appendChild(input);
input.addEventListener('keydown',(e)=>{if(e.key==='Enter'){const guess=parseInt(input.value);if(guess===secret){markPlayed(GAME_IDS[23]);showCongrats();secret=Math.floor(Math.random()*100)+1;attempts=0;hint.textContent='猜对了！';}else{hint.textContent=guess>secret?'太大了':'太小了';attempts++;}input.value='';}});
hint.textContent='猜1-100';area._reset=()=>{secret=Math.floor(Math.random()*100)+1;hint.textContent='猜1-100';};
})();

// 24:钢琴块
(function(){const area=getArea(24);const pw=300,ph=350;area.style.width=pw+'px';area.style.height=ph+'px';area.style.background='#bbada0';area.style.borderRadius='12px';area.style.overflow='hidden';area.style.position='relative';
let tiles=[],tileSpeed=3,missed=false;function spawnTile(){tiles.push({x:Math.floor(Math.random()*4)*75,y:-40,clicked:false});}
function updateTiles(){if(!gameActives[24]||missed)return;tiles.forEach(t=>t.y+=tileSpeed);tiles=tiles.filter(t=>t.y<ph+40);for(let t of tiles){if(t.y>ph&&!t.clicked){missed=true;markPlayed(GAME_IDS[24]);sfxGameOver();}}
if(Math.random()<0.04)spawnTile();renderTiles();}
function renderTiles(){area.innerHTML='';tiles.forEach((t,i)=>{const d=document.createElement('div');d.style.cssText=`position:absolute;left:${t.x}px;top:${t.y}px;width:70px;height:40px;background:#2c3e50;border-radius:6px;`;
d.addEventListener('pointerdown',(e)=>{e.stopPropagation();if(!t.clicked){t.clicked=true;tiles.splice(i,1);sfxPop();}});area.appendChild(d);});}
let pianoInterval;function startPiano(){tiles=[];missed=false;clearInterval(pianoInterval);pianoInterval=setInterval(updateTiles,20);setTimeout(()=>{if(!missed){markPlayed(GAME_IDS[24]);showCongrats();}},15000);}
startPiano();area._reset=startPiano;area._stop=()=>clearInterval(pianoInterval);
})();

// 初始激活
gameActives[0]=true;
allSlideRefs[0].scrollIntoView({block:'start'});
})();
</script>
</body>
</html>
