                    startBtn.textContent = '🃏 开始';
                    startBtn.style.cssText =
                        'margin-top:8px;padding:8px 20px;background:#fe2c55;color:#fff;border:none;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer;';
                    startBtn.addEventListener('click', startMemory);
                    areaEl.appendChild(startBtn);
                }

                function startMemory() {
                    markPlayed(GAME_IDS[index]);
                    const deck = [...emojis, ...emojis];
                    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));
                        [deck[i], deck[j]] = [deck[j], deck[i]]; }
                    cards = deck.map((emoji, i) => ({ emoji, flipped: false, matched: false, index: i }));
                    flippedCards = [];
                    matchedPairs = 0;
                    won = false;
                    gameRunning = true;
                    updateMemoryInfo();
                    renderMemoryCards();
                }

                function renderMemoryCards() {
                    gridEl.innerHTML = '';
                    cards.forEach((card, i) => {
                        const cardEl = document.createElement('div');
                        cardEl.style.cssText =
                            'background:#2a2a45;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;transition:all 0.3s;border:2px solid rgba(255,255,255,0.1);';
                        if (card.flipped || card.matched) {
                            cardEl.textContent = card.emoji;
                            cardEl.style.background = card.matched ? '#2a5a2a' : '#4a4a6a';
                        } else {
                            cardEl.textContent = '❓';
                        }
                        cardEl.addEventListener('click', () => flipCard(i));
                        gridEl.appendChild(cardEl);
                    });
                }

                function flipCard(i) {
                    if (!gameRunning) return;
                    if (cards[i].flipped || cards[i].matched) return;
                    if (flippedCards.length >= 2) return;
                    cards[i].flipped = true;
                    flippedCards.push(i);
                    renderMemoryCards();
                    if (flippedCards.length === 2) {
                        const [a, b] = flippedCards;
                        if (cards[a].emoji === cards[b].emoji) {
                            cards[a].matched = true;
                            cards[b].matched = true;
                            matchedPairs++;
                            flippedCards = [];
                            updateMemoryInfo();
                            renderMemoryCards();
                            if (matchedPairs >= totalPairs && !won) {
                                won = true;
                                gameRunning = false;
                                updateMemoryInfo();
                                triggerFireworks();
                            }
                        } else {
                            setTimeout(() => {
                                cards[a].flipped = false;
                                cards[b].flipped = false;
                                flippedCards = [];
                                renderMemoryCards();
                            }, 700);
                        }
                    }
                }

                function updateMemoryInfo() {
                    const el = document.getElementById('memoryInfo' + index);
                    if (el) el.textContent = '🃏 配对: ' + matchedPairs + '/8' + (won ? ' 🎉通关!' : '');
                }

                function pause() { active = false;
                    gameRunning = false; }

                function resume() { active = true; if (!won && matchedPairs < totalPairs) gameRunning = true; }

                function reset() { gameRunning = false;
                    cards = [];
                    flippedCards = [];
                    matchedPairs = 0;
                    won = false;
                    renderMemoryCards(); }
                return { init, pause, resume, reset, _initialized: false };
            }

            // ==================== 游戏7: 反应速度测试 ====================
            function createReactionGame(index) {
                const areaEl = document.getElementById('gameArea' + index);
                let active = false;
                let gameRunning = false;
                let waitingForGreen = false;
                let waitStartTime = 0;
                let reactionTimes = [];
                let totalRounds = 5;
                let currentRound = 0;
                let won = false;
                let timeoutId = null;
                let mainEl;

                function init() {
                    active = true;
                    areaEl.innerHTML = '';
                    areaEl.style.cssText =
                        'width:100%;aspect-ratio:1/1;max-width:420px;max-height:55vh;background:var(--game-bg);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;cursor:pointer;';
                    areaEl.setAttribute('data-internal-touch', 'true');
                    const infoEl = document.createElement('div');
                    infoEl.style.cssText =
                        'color:#fff;font-size:14px;font-weight:600;margin-bottom:8px;text-align:center;pointer-events:none;';
                    infoEl.textContent = '⚡ 反应测试: 0/5轮';
                    infoEl.id = 'reactionInfo' + index;
                    areaEl.appendChild(infoEl);
                    mainEl = document.createElement('div');
                    mainEl.style.cssText =
                        'width:85%;aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;background:#444;transition:background 0.15s;pointer-events:none;';
                    mainEl.textContent = '点击开始';
                    areaEl.appendChild(mainEl);
                    areaEl.addEventListener('click', reactionClick);
                    const resetBtn = document.createElement('button');
                    resetBtn.textContent = '🔄 重新测试';
                    resetBtn.style.cssText =
                        'margin-top:8px;padding:8px 18px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;';
                    resetBtn.addEventListener('click', (e) => { e.stopPropagation();
                        resetReaction(); });
                    areaEl.appendChild(resetBtn);
                }

                function reactionClick(e) {
                    if (!active) return;
                    if (currentRound >= totalRounds && !gameRunning) { resetReaction(); return; }
                    if (!gameRunning) {
                        startReactionRound();
                        return;
                    }
                    if (waitingForGreen) {
                        // 太早了
                        clearTimeout(timeoutId);
                        mainEl.style.background = '#ff3333';
                        mainEl.textContent = '太早了! 等待绿色';
                        waitingForGreen = false;
                        gameRunning = false;
                        setTimeout(() => { if (currentRound < totalRounds) startReactionRound(); }, 1200);
                        return;
                    }
                    // 点击绿色
                    const rt = Date.now() - waitStartTime;
                    reactionTimes.push(rt);
                    currentRound++;
                    gameRunning = false;
                    waitingForGreen = false;
                    mainEl.style.background = '#444';
                    mainEl.textContent = rt + 'ms';
                    updateReactionInfo();
                    if (currentRound >= totalRounds) {
                        const avg = reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length;
                        if (avg < 500 && !won) {
                            won = true;
                            triggerFireworks();
                        }
                        mainEl.textContent = '平均: ' + Math.round(avg) + 'ms' + (won ? ' 🎉通关!' : ' 未达标');
                        updateReactionInfo();
                    } else {
                        setTimeout(() => startReactionRound(), 1500);
                    }
                }

                function startReactionRound() {
                    if (!active) return;
                    markPlayed(GAME_IDS[index]);
                    gameRunning = true;
                    waitingForGreen = false;
                    mainEl.style.background = '#cc3333';
                    mainEl.textContent = '等待...';
                    const delay = 1000 + Math.random() * 2500;
                    timeoutId = setTimeout(() => {
                        if (!gameRunning) return;
                        mainEl.style.background = '#33cc33';
                        mainEl.textContent = '点击!';
                        waitingForGreen = true;
                        waitStartTime = Date.now();
                    }, delay);
                }

                function updateReactionInfo() {
                    const el = document.getElementById('reactionInfo' + index);
                    if (el) {
                        let txt = '⚡ 反应测试: ' + currentRound + '/' + totalRounds + '轮';
                        if (currentRound >= totalRounds) {
                            const avg = reactionTimes.length > 0 ? Math.round(reactionTimes.reduce((a, b) => a + b,
                                0) / reactionTimes.length) : 0;
                            txt += ' | 平均: ' + avg + 'ms' + (won ? ' 🎉通关!' : ' (目标<500ms)');
                        }
                        el.textContent = txt;
                    }
                }

                function resetReaction() {
                    clearTimeout(timeoutId);
                    gameRunning = false;
                    waitingForGreen = false;
                    reactionTimes = [];
                    currentRound = 0;
                    won = false;
                    mainEl.style.background = '#444';
                    mainEl.textContent = '点击开始';
                    updateReactionInfo();
                }

                function pause() { active = false;
                    clearTimeout(timeoutId);
                    gameRunning = false;
                    waitingForGreen = false; }

                function resume() { active = true; if (currentRound < totalRounds && !gameRunning && reactionTimes
                        .length === currentRound) { mainEl.textContent = '点击继续'; } }

                function reset() { resetReaction(); }
                return { init, pause, resume, reset, _initialized: false };
            }

            // ==================== 虚拟方向键辅助 ====================
            function setupDpad(index, labels, callbacks, parentEl) {
                const dpadEl = document.getElementById('dpad' + index);
                if (!dpadEl) return;
                dpadEl.style.display = 'grid';
                dpadEl.innerHTML = '';
                // 布局: [空, 上, 空], [左, 空, 右], [空, 下, 空]
                const layout = [
                    { label: labels[0], cb: callbacks[0], pos: 1 },
                    { label: labels[1], cb: callbacks[1], pos: 3 },
                    { label: labels[2], cb: callbacks[2], pos: 5 },
                    { label: labels[3], cb: callbacks[3], pos: 7 },
                ];
                for (let i = 0; i < 9; i++) {
                    const btn = document.createElement('button');
                    const mapped = layout.find(l => l.pos === i);
                    if (mapped) {
                        btn.textContent = mapped.label;
                        btn.addEventListener('click', (e) => { e.stopPropagation();
                            mapped.cb(); });
                        btn.addEventListener('touchstart', (e) => { e.stopPropagation();
                            e.preventDefault();
                            mapped.cb(); });
                    } else {
                        btn.className = 'empty';
                    }
                    dpadEl.appendChild(btn);
                }
                // 移动端显示
                if (window.innerWidth < 768) dpadEl.style.display = 'grid';
            }

            // ==================== 初始化 ====================
            function init() {
                createSlides();
                createAllGameInstances();
                updateTopBar();
                updateAllSideButtons();
                goToSlide(0, false);
                // 初始化时标记当前游戏区域
                if (gameInstances[0] && gameInstances[0].init && !gameInstances[0]._initialized) {
                    gameInstances[0].init();
                    gameInstances[0]._initialized = true;
                }
            }

            // 窗口大小变化时更新
            window.addEventListener('resize', () => {
                swiperTransform = -currentGameIndex * window.innerHeight;
                swiperContainer.style.transition = 'none';
                swiperContainer.style.transform = `translateY(${swiperTransform}px)`;
                resizeFireworksCanvas();
                // 重新初始化当前游戏
                if (gameInstances[currentGameIndex] && gameInstances[currentGameIndex].init) {
                    gameInstances[currentGameIndex].init();
                }
            });

            // 启动
            init();
            console.log('🎮 抖音风格游戏滑动已就绪！');
            console.log('👤 用户名: ' + appData.nickname);
            console.log('📱 上下滑动切换游戏 | ❤️ 点赞 | ⭐ 收藏 | 数据保存在本地浏览器');
            console.log('🎆 通关触发炫彩烟花 + 闪烁恭喜文字');
            console.log('💾 所有数据存储在 localStorage，刷新不丢失');
        })();
    </script>
</body>
