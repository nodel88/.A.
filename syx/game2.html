<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打砖块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf8ef;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.info{position:fixed;top:16px;left:16px;z-index:2;pointer-events:none}
.title{color:#776e65;font-size:28px;font-weight:900}
.desc{color:#a39480;font-size:12px;margin-top:2px}
.score{color:#776e65;font-size:24px;font-weight:700;margin-top:6px}
.btns{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:2}
.btns button{background:rgba(238,228,218,0.9);color:#776e65;border:1px solid #ccc;border-radius:24px;padding:8px 16px;font-size:14px;cursor:pointer;font-weight:600}
.social-actions{position:fixed;bottom:80px;right:12px;display:flex;flex-direction:column;gap:12px;z-index:3;align-items:center}
.nav-btns{display:flex;flex-direction:column;gap:4px}
.nav-btns button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.8);border:1px solid #ccc;color:#776e65;font-size:18px;cursor:pointer}
.social-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#776e65;border:1px solid rgba(0,0,0,0.1);transition:0.15s;position:relative}
.social-btn.liked{color:#ff4d4f;background:rgba(255,77,79,0.1)}
.social-btn.collected{color:#e6a817;background:rgba(230,168,23,0.1)}
.social-btn .count{position:absolute;bottom:-8px;font-size:10px;font-weight:700;background:#fff;padding:2px 6px;border-radius:10px}
.victory-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;background:rgba(0,0,0,0.2)}
.victory-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8vmin;font-weight:900;color:#fff;text-shadow:0 0 20px #ffd700;animation:blink 0.5s infinite alternate}
@keyframes blink{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0.8;transform:translate(-50%,-50%) scale(1.05)}}
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<div class="info">
  <div class="title">🧱 打砖块</div>
  <div class="desc">手机滑动屏幕 / 电脑移动鼠标接球打砖</div>
  <div class="score" id="scoreDisplay">得分 0</div>
</div>
<div class="btns">
  <button id="muteBtn">🔊 静音</button>
  <button id="pauseBtn">⏯️ 暂停</button>
  <button id="restartBtn">↺ 重新开始</button>
</div>
<div class="social-actions">
  <div class="nav-btns">
    <button class="nav-up">▲</button>
    <button class="nav-down">▼</button>
  </div>
  <div class="social-btn like-btn" id="likeBtn">❤️<span class="count" id="likeCount">0</span></div>
  <div class="social-btn collect-btn" id="collectBtn">⭐</div>
</div>
<script>
const GAME_ID='breakout';
let audioCtx=null, musicInterval=null, isMuted=false;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx||isMuted) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='hit'){ osc.frequency.setValueAtTime(800,audioCtx.currentTime); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='die'){ osc.frequency.setValueAtTime(300,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80,audioCtx.currentTime+0.4); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); osc.start(); osc.stop(audioCtx.currentTime+0.4); }
  else if(type==='win'){ osc.type='square'; osc.frequency.setValueAtTime(523,audioCtx.currentTime); gain.gain.setValueAtTime(0.15,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5); osc.start(); osc.stop(audioCtx.currentTime+0.5); }
}
function startMusic(){
  if(musicInterval||isMuted) return;
  const notes=[330,392,440,494,440,392,330,294];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx||isMuted) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.03,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
    i++;
  },500);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function playFireworkSound(){
  if(!audioCtx||isMuted) return;
  const bufferSize = audioCtx.sampleRate * 0.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i/(audioCtx.sampleRate*0.1));
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  source.connect(gain); gain.connect(audioCtx.destination);
  source.start(); source.stop(audioCtx.currentTime + 0.5);
}
function toggleMute(){
  isMuted = !isMuted;
  document.getElementById('muteBtn').textContent = isMuted ? '🔇 已静音' : '🔊 静音';
  if (isMuted) { stopMusic(); } else { startMusic(); }
}
document.getElementById('muteBtn').addEventListener('click', toggleMute);
document.querySelector('.nav-up').addEventListener('click', ()=> window.parent.postMessage({type:'nav',direction:'up'},'*'));
document.querySelector('.nav-down').addEventListener('click', ()=> window.parent.postMessage({type:'nav',direction:'down'},'*'));

function updateSocial(){
  const likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  document.getElementById('likeCount').textContent=likes;
  document.getElementById('likeBtn').classList.toggle('liked',likes>0);
  const favs=JSON.parse(localStorage.getItem('favs')||'[]');
  document.getElementById('collectBtn').classList.toggle('collected',favs.includes(GAME_ID));
}
document.getElementById('likeBtn').addEventListener('click',()=>{
  let likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  if(likes>=999) return alert('点赞已达上限 999 ❤️');
  likes++; localStorage.setItem('like_'+GAME_ID,likes); updateSocial();
  if(navigator.vibrate) navigator.vibrate(10);
});
document.getElementById('collectBtn').addEventListener('click',()=>{
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  const idx=favs.indexOf(GAME_ID);
  if(idx>-1) favs.splice(idx,1); else favs.push(GAME_ID);
  localStorage.setItem('favs',JSON.stringify(favs)); updateSocial();
});
updateSocial();
function notifyPlayed(){ if(window.parent) window.parent.postMessage({type:'played',gameId:GAME_ID},'*'); }

const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=400,H=600;
let paddle={x:160,w:80}, ball={x:200,y:500,r:6,dx:2.5,dy:-2.5};
let bricks=[], score=0, paused=false, running=true, winTriggered=false;
function createBricks(){ bricks=[]; for(let i=0;i<5;i++)for(let j=0;j<8;j++)bricks.push({x:j*50+2,y:i*20+40,w:46,h:16,alive:true}); }
function reset(){
  createBricks(); ball={x:200,y:500,r:6,dx:2.5,dy:-2.5}; paddle.x=160; score=0; paused=false; running=true; winTriggered=false;
  document.getElementById('pauseBtn').textContent='⏯️ 暂停';
  stopMusic(); startMusic(); const ov=document.querySelector('.victory-overlay'); if(ov) ov.remove(); notifyPlayed();
}
function togglePause(){ paused=!paused; document.getElementById('pauseBtn').textContent=paused?'▶️ 继续':'⏯️ 暂停'; }
function checkWin(){ if(bricks.every(b=>!b.alive) && !winTriggered){ winTriggered=true; running=false; stopMusic(); playSound('win'); showVictory(); setTimeout(reset,3000); } }
function showVictory(){
  const ov=document.createElement('div'); ov.className='victory-overlay';
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    ov.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.className='victory-text'; txt.textContent='🎉 恭喜成功！';
  ov.appendChild(txt);
  document.body.appendChild(ov);
  playFireworkSound();
  setTimeout(()=>ov.remove(),3000);
}
function draw(){
  if(!running) return;
  if(!paused){
    ball.x+=ball.dx; ball.y+=ball.dy;
    if(ball.x-ball.r<0||ball.x+ball.r>W) ball.dx*=-1;
    if(ball.y-ball.r<0) ball.dy*=-1;
    if(ball.y+ball.r>H){ running=false; playSound('die'); stopMusic(); alert('游戏结束！得分:'+score); reset(); return; }
    if(ball.y+ball.r>580 && ball.y-ball.r<595 && ball.x>paddle.x && ball.x<paddle.x+paddle.w) ball.dy*=-1;
    bricks.forEach(b=>{
      if(b.alive && ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
        ball.dy*=-1; b.alive=false; score++; playSound('hit'); checkWin();
      }
    });
  }
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#faf8ef'; ctx.fillRect(0,0,W,H);
  bricks.forEach(b=>{ if(b.alive){ ctx.fillStyle='#f2b179'; ctx.fillRect(b.x,b.y,b.w,b.h); } });
  ctx.fillStyle='#776e65'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8f7a66'; ctx.fillRect(paddle.x,585,paddle.w,10);
  document.getElementById('scoreDisplay').textContent='得分 '+score;
  requestAnimationFrame(draw);
}
c.addEventListener('mousemove',e=>{ initAudio(); const rect=c.getBoundingClientRect(); paddle.x=Math.min(W-paddle.w,Math.max(0,(e.clientX-rect.left)*(W/rect.width)-paddle.w/2)); });
c.addEventListener('touchmove',e=>{ e.preventDefault(); initAudio(); const rect=c.getBoundingClientRect(); paddle.x=Math.min(W-paddle.w,Math.max(0,(e.touches[0].clientX-rect.left)*(W/rect.width)-paddle.w/2)); });
document.getElementById('restartBtn').onclick=reset;
document.getElementById('pauseBtn').onclick=togglePause;
reset(); draw();
</script>
</body>
</html>
