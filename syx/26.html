<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>滑动游戏盒子</title>
<style>
  :root { --bg: #000; --text: #fff; --accent: #fe2c55; --gold: #ffbf00; --glass: rgba(255,255,255,0.12); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; overflow:hidden; height:100vh; }
  
  /* 抖音风格全屏滑动容器 */
  #swiper { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; scroll-behavior:smooth; }
  .slide { height:100vh; width:100vw; position:relative; scroll-snap-align:start; background:#0a0a0a; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  canvas { display:block; touch-action:none; background:transparent; }
  
  /* 底部渐变遮罩与信息区 */
  .slide::after { content:''; position:absolute; bottom:0; left:0; width:100%; height:25vh; background:linear-gradient(transparent, rgba(0,0,0,0.85)); pointer-events:none; }
  .info-box { position:absolute; bottom:6vh; left:5vw; z-index:10; max-width:70%; }
  .game-title { font-size:20px; font-weight:700; margin-bottom:6px; text-shadow:0 2px 4px rgba(0,0,0,0.8); }
  .game-tip { font-size:13px; opacity:0.85; line-height:1.4; color:#ddd; }

  /* 右侧操作栏 */
  .right-actions { position:absolute; right:4vw; bottom:8vh; display:flex; flex-direction:column; align-items:center; gap:16px; z-index:10; }
  .action-btn { display:flex; flex-direction:column; align-items:center; cursor:pointer; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6)); transition:transform .2s; }
  .action-btn:active { transform:scale(0.9); }
  .action-icon { width:44px; height:44px; background:var(--glass); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px; border:1px solid rgba(255,255,255,0.2); backdrop-filter:blur(4px); }
  .action-label { font-size:12px; font-weight:500; text-shadow:0 1px 2px #000; }
  .like-active .action-icon { background:var(--accent); color:#fff; }
  .fav-active .action-icon { background:var(--gold); color:#fff; }

  /* 顶部头像与用户名 */
  .top-left { position:absolute; top:4vh; left:4vw; z-index:10; display:flex; align-items:center; gap:8px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(45deg, #ff6b6b, #845ec2); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; border:2px solid #fff; }
  .username { font-size:14px; font-weight:600; text-shadow:0 1px 3px #000; cursor:pointer; }

  /* 数据面板模态框 */
  #modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:100; display:none; opacity:0; transition:opacity .3s; padding:20px; }
  #modal.open { display:flex; flex-direction:column; align-items:center; opacity:1; }
  .modal-header { width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
  .modal-title { font-size:18px; font-weight:bold; }
  .close-btn { background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
  .tabs { display:flex; gap:10px; margin-bottom:16px; width:100%; justify-content:center; }
  .tab { padding:8px 16px; background:var(--glass); border-radius:20px; cursor:pointer; font-size:13px; transition:.2s; }
  .tab.active { background:var(--accent); }
  .list-container { flex:1; width:100%; overflow-y:auto; padding-bottom:40px; }
  .list-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .item-name { flex:1; font-size:15px; }
  .remove-btn { color:#888; font-size:13px; padding:6px 12px; background:rgba(255,255,255,0.1); border:none; border-radius:12px; cursor:pointer; }
  .empty-tip { text-align:center; color:#666; margin-top:40px; font-size:14px; }

  /* 通关特效 */
  #win-overlay { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:90; display:none; }
  #win-canvas { width:100%; height:100%; }
  .congrats-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:36px; font-weight:900; color:#fff; text-shadow:0 0 10px #ff2c55, 0 0 20px #ffbf00; animation:blink 0.6s infinite alternate; white-space:nowrap; }
  @keyframes blink { 0% { opacity:0.6; transform:translate(-50%,-50%) scale(1); } 100% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } }
  
  /* 开始提示 */
  .start-hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.7); padding:20px; border-radius:16px; text-align:center; backdrop-filter:blur(5px); z-index:5; cursor:pointer; }
  .start-hint p { margin-bottom:8px; font-weight:bold; }
  .start-hint button { background:var(--accent); color:#fff; border:none; padding:8px 20px; border-radius:20px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<div id="app">
  <div id="swiper"></div>
</div>

<div class="top-left">
  <div class="avatar" id="avatar-el">?</div>
  <span class="username" id="username-el" onclick="UI.openModal()">用户数据</span>
</div>

<div id="win-overlay">
  <canvas id="win-canvas"></canvas>
  <div class="congrats-text">🎉 恭喜通关！</div>
</div>

<div id="modal">
  <div class="modal-header">
    <span class="modal-title">📊 游戏记录</span>
    <button class="close-btn" onclick="UI.closeModal()">×</button>
  </div>
  <div class="tabs" id="tab-group">
    <div class="tab active" data-type="played">已玩</div>
    <div class="tab" data-type="liked">已赞</div>
    <div class="tab" data-type="favorited">已藏</div>
  </div>
  <div class="list-container" id="list-container"></div>
</div>

<script>
/**
 * 全局状态与存储管理
 */
const Store = {
  key: 'douyin_games_v2',
  state: { username: '', played: {}, liked: {}, favorited: {} },
  init() {
    const raw = localStorage.getItem(this.key);
    if (raw) {
      this.state = { ...this.state, ...JSON.parse(raw) };
    } else {
      this.state.username = 'User_' + Math.random().toString(36).slice(2, 8);
      this.save();
    }
  },
  save() { localStorage.setItem(this.key, JSON.stringify(this.state)); },
  toggle(type, id) {
    const map = this.state[type] || {};
    if (map[id]) delete map[id];
    else map[id] = type === 'liked' ? (map[id] || 0) + 1 : true;
    this.state[type] = map;
    this.save();
    return map[id];
  },
  get(type, id) { return this.state[type]?.[id] || 0; }
};

/**
 * UI 管理器
 */
const UI = {
  init() {
    document.getElementById('username-el').textContent = Store.state.username;
    document.getElementById('avatar-el').textContent = Store.state.username.slice(0,1).toUpperCase();
    this.renderSwiper();
    this.setupTabs();
  },
  openModal(type='played') {
    document.getElementById('modal').style.display = 'flex';
    requestAnimationFrame(() => document.getElementById('modal').classList.add('open'));
    this.switchTab(type);
  },
  closeModal() { document.getElementById('modal').classList.remove('open'); setTimeout(()=>document.getElementById('modal').style.display='none',300); },
  switchTab(type) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
    const container = document.getElementById('list-container');
    const data = Store.state[type] || {};
    container.innerHTML = '';
    if (Object.keys(data).length === 0) {
      container.innerHTML = '<div class="empty-tip">暂无记录，快去滑动玩游戏吧！</div>';
      return;
    }
    const isList = type !== 'liked';
    Object.entries(data).forEach(([id, val]) => {
      const name = GameRegistry[id]?.name || id;
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `<span class="item-name">${name} ${type==='liked'?`(${val})`:''}</span>`;
      const btn = document.createElement('button');
      btn.className = 'remove-btn';
      btn.textContent = type==='played' ? '删除记录' : '取消'+(type==='liked'?'点赞':'收藏');
      btn.onclick = () => {
        Store.toggle(type, id);
        this.switchTab(type);
        this.updateBtns();
      };
      div.appendChild(btn);
      container.appendChild(div);
    });
  },
  setupTabs() { document.querySelectorAll('.tab').forEach(t => t.onclick = () => this.switchTab(t.dataset.type)); },
  renderSwiper() {
    const swiper = document.getElementById('swiper');
    GameRegistry.forEach((g, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.id = i;
      slide.innerHTML = `
        <canvas id="canvas-${i}" width="300" height="500"></canvas>
        <div class="info-box">
          <div class="game-title">${g.name}</div>
          <div class="game-tip">${g.tip}</div>
        </div>
        <div class="right-actions">
          <div class="action-btn like-btn" data-id="${i}" onclick="UI.toggleLike(${i})">
            <div class="action-icon">❤️</div>
            <div class="action-label" id="like-c-${i}">${Store.get('liked', i)}</div>
          </div>
          <div class="action-btn fav-btn" data-id="${i}" onclick="UI.toggleFav(${i})">
            <div class="action-icon">⭐</div>
            <div class="action-label" id="fav-c-${i}">${Store.get('favorited', i)?'已藏':'收藏'}</div>
          </div>
          <div class="action-btn" onclick="UI.openModal()">
            <div class="action-icon">📊</div>
            <div class="action-label">我的</div>
          </div>
        </div>
        <div class="start-hint" id="hint-${i}">
          <p>${g.name}</p>
          <button onclick="GameEngine.start(${i})">开始游戏</button>
        </div>
      `;
      swiper.appendChild(slide);
    });
    this.updateBtns();
    this.setupObserver();
  },
  toggleLike(id) { Store.toggle('liked', id); this.updateBtns(); },
  toggleFav(id) { Store.toggle('favorited', id); this.updateBtns(); },
  updateBtns() {
    GameRegistry.forEach((_, i) => {
      document.getElementById(`like-c-${i}`).textContent = Store.get('liked', i);
      const favEl = document.getElementById(`fav-c-${i}`);
      const btn = document.querySelector(`.fav-btn[data-id="${i}"]`);
      favEl.textContent = Store.get('favorited', i) ? '已藏' : '收藏';
      btn.classList.toggle('like-active', !!Store.get('liked', i));
      btn.classList.toggle('fav-active', !!Store.get('favorited', i));
    });
  },
  setupObserver() {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        const id = parseInt(e.target.dataset.id);
        if (e.isIntersecting && GameEngine.currentId !== id) {
          GameEngine.pauseAll();
          GameEngine.start(id);
        } else if (!e.isIntersecting) {
          GameEngine.stop(id);
        }
      });
    }, { threshold: 0.7 });
    document.querySelectorAll('.slide').forEach(s => obs.observe(s));
  }
};

/**
 * 通关烟花特效
 */
const Fireworks = {
  canvas: document.getElementById('win-canvas'),
  ctx: null, particles: [], active: false,
  init() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', ()=>this.resize()); },
  resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  launch() {
    if(this.active) return; this.active = true;
    document.getElementById('win-overlay').style.display = 'block';
    this.particles = [];
    for(let i=0; i<80; i++) this.spawn(Math.random()*this.canvas.width, Math.random()*this.canvas.height*0.6);
    this.loop();
    setTimeout(()=>{ this.active=false; document.getElementById('win-overlay').style.display='none'; }, 3500);
  },
  spawn(x,y) {
    this.particles.push({
      x, y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8,
      life:1, color:`hsl(${Math.random()*360}, 100%, 60%)`, size:Math.random()*4+2
    });
  },
  loop() {
    if(!this.active) return;
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life-=0.015; p.size*=0.98;
      this.ctx.globalAlpha = p.life;
      this.ctx.fillStyle = p.color;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      this.ctx.fill();
    });
    this.particles = this.particles.filter(p=>p.life>0);
    requestAnimationFrame(()=>this.loop());
  }
};

/**
 * 游戏引擎与7个游戏实现
 */
const GameEngine = {
  currentId: -1, loopId: null, games: {},
  start(id) {
    if (this.games[id]?.running) return;
    this.stopAll();
    this.currentId = id;
    document.getElementById(`hint-${id}`).style.display = 'none';
    const canvas = document.getElementById(`canvas-${id}`);
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width; canvas.height = rect.height;
    if (!this.games[id]) this.games[id] = new GameRegistry[id].class(canvas);
    this.games[id].start();
    Store.state.played[id] = true; Store.save();
  },
  stop(id) {
    if (this.games[id]) this.games[id].destroy();
    const hint = document.getElementById(`hint-${id}`);
    if(hint) hint.style.display = 'block';
  },
  pauseAll() { this.currentId = -1; document.querySelectorAll('.start-hint').forEach(h=>h.style.display='none'); },
  stopAll() { GameRegistry.forEach((_,i)=>this.stop(i)); this.currentId=-1; }
};

const GameRegistry = [
  { name: '🐦 像素跳跃', tip: '点击/空格键跳跃，躲避管道，得分5即通关', id:0, class: class FlappyGame {
    constructor(c) { this.c=c; this.ctx=c.getContext('2d'); this.running=false; this.bind(); }
    bind() { this.up = (e)=>{ e.preventDefault(); if(e.type==='keydown' && e.code!=='Space') return; this.jump(); }; this.c.addEventListener('touchstart', this.up); this.c.addEventListener('mousedown', this.up); this.keyHandler = (e)=>this.up(e); }
    start() { this.running=true; this.y=this.c.height/2; this.vy=0; this.score=0; this.pipes=[]; this.frame=0; this.ctx.canvas.addEventListener('keydown', this.keyHandler); this.loop(); }
    jump() { if(!this.running) return; this.vy = -8; }
    loop() { if(!this.running) return; this.frame++;
      this.ctx.clearRect(0,0,this.c.width,this.c.height);
      if(this.frame%90===0) this.pipes.push({x:this.c.width, gap:120+Math.random()*40, w:40});
      this.pipes.forEach(p=>{ p.x-=4;
        this.ctx.fillStyle='#4ade80'; this.ctx.fillRect(p.x,0,p.w,this.c.height*(0.3+Math.random()*0.4-p.gap/this.c.height));
        this.ctx.fillRect(p.x,this.c.height-p.gap-this.c.height*0.3,p.w,p.gap);
        if(p.x<30 && p.x>10) { this.checkHit(p); }
      });
      this.pipes = this.pipes.filter(p=>p.x>-40);
      this.vy+=0.4; this.y+=this.vy;
      this.ctx.fillStyle='#ff2c55'; this.ctx.beginPath(); this.ctx.arc(50,this.y,15,0,Math.PI*2); this.ctx.fill();
      if(this.y>this.c.height || this.y<0) this.over(false);
      this.ctx.fillStyle='#fff'; this.ctx.font='bold 24px sans-serif'; this.ctx.fillText(`得分: ${this.score}`, 10, 30);
      this.loopId = requestAnimationFrame(()=>this.loop());
    }
    checkHit(p) { if(this.y-15 < this.c.height*(0.3) || this.y+15 > this.c.height-p.gap-this.c.height*0.3) this.over(false); this.score++; if(this.score>=5) this.over(true); }
    over(win) { this.running=false; cancelAnimationFrame(this.loopId); if(win) Fireworks.launch(); }
    destroy() { this.running=false; cancelAnimationFrame(this.loopId); }
  }},
  { name: '🐍 贪吃蛇', tip: '滑动屏幕控制方向，吃够5个食物通关', id:1, class: class SnakeGame {
    constructor(c) { this.c=c; this.ctx=c.getContext('2d'); this.grid=20; this.bind(); }
    bind() { this.touchStart=null; this.c.addEventListener('touchstart', e=>this.touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY});
      this.c.addEventListener('touchmove', e=>{ if(!this.touchStart)return; e.preventDefault(); const dx=e.touches[0].clientX-this.touchStart.x; const dy=e.touches[0].clientY-this.touchStart.y;
        if(Math.abs(dx)>Math.abs(dy)) this.dir=dx>0?1:-1; else this.dir=dy>0?-1:1; this.touchStart=null; }, {passive:false});
      this.keyHandler = e=>{ if(e.key==='ArrowUp') this.dir=-1; if(e.key==='ArrowDown') this.dir=1; if(e.key==='ArrowLeft') this.dir=1; if(e.key==='ArrowRight') this.dir=2; };
    }
    start() { this.running=true; this.snake=[{x:5,y:5}]; this.dir=0; this.food=this.randFood(); this.frame=0; this.score=0;
      document.addEventListener('keydown', this.keyHandler); this.loopId = setInterval(()=>this.loop(), 120); }
    randFood() { return {x:Math.floor(Math.random()*(this.c.width/this.grid)), y:Math.floor(Math.random()*(this.c.height/this.grid))}; }
    loop() { if(!this.running) return; this.frame++;
      const head={...this.snake[0]}; if(this.dir===1) head.y++; if(this.dir===2) head.x++; if(this.dir===-1) head.y--; if(this.dir===-2) head.x--; // 修正方向映射
      if(head.x<0||head.y<0||head.x>=this.c.width/this.grid||head.y>=this.c.height/this.grid||this.snake.some(s=>s.x===head.x&&s.y===head.y)) return this.over(false);
      this.snake.unshift(head);
      if(head.x===this.food.x&&head.y===this.food.y) { this.score++; this.food=this.randFood(); } else this.snake.pop();
      if(this.score>=5) return this.over(true);
      this.ctx.clearRect(0,0,this.c.width,this.c.height);
      this.ctx.fillStyle='#2dd4bf'; this.snake.forEach(s=>this.ctx.fillRect(s.x*this.grid,s.y*this.grid,this.grid-1,this.grid-1));
      this.ctx.fillStyle='#f59e0b'; this.ctx.beginPath(); this.ctx.arc(this.food.x*this.grid+10,this.food.y*this.grid+10,8,0,Math.PI*2); this.ctx.fill();
    }
    over(win) { this.running=false; clearInterval(this.loopId); if(win) Fireworks.launch(); }
    destroy() { this.running=false; clearInterval(this.loopId); document.removeEventListener('keydown', this.keyHandler); }
  }},
  { name: '🧱 打砖块', tip: '鼠标/触屏拖动挡板，击碎全部砖块通关', id:2, class: class BreakoutGame {
    constructor(c) { this.c=c; this.ctx=c.getContext('2d'); this.bind(); }
    bind() { this.move = e=>{ const x=e.touches?e.touches[0].clientX:e.clientX; this.pad.x=x-this.pad.w/2; this.pad.x=Math.max(0,Math.min(this.c.width-this.pad.w,this.pad.x)); }; this.c.addEventListener('touchmove', this.move); this.c.addEventListener('mousemove', this.move); }
    start() { this.running=true; this.ball={x:this.c.width/2,y:this.c.height-50,dx:3,dy:-3,r:6}; this.pad={x:this.c.width/2-40,y:this.c.height-30,w:80,h:10}; this.bricks=[]; this.score=0;
      for(let r=0;r<3;r++) for(let c=0;c<6;c++) this.bricks.push({x:c*(this.c.width/6)+5,y:r*30+40,w:this.c.width/6-10,h:25,hit:false});
      this.loopId = requestAnimationFrame(()=>this.loop()); }
    loop() { if(!this.running) return;
      this.ball.x+=this.ball.dx; this.ball.y+=this.ball.dy;
      if(this.ball.x<0||this.ball.x>this.c.width) this.ball.dx*=-1;
      if(this.ball.y<0) this.ball.dy*=-1;
      if(this.ball.y>this.c.height) return this.over(false);
      if(this.ball.x>this.pad.x && this.ball.x<this.pad.x+this.pad.w && this.ball.y>this.pad.y) this.ball.dy*=-1;
      this.bricks.forEach(b=>{ if(!b.hit && this.ball.x>b.x && this.ball.x<b.x+b.w && this.ball.y>b.y && this.ball.y<b.y+b.h) { b.hit=true; this.ball.dy*=-1; this.score++; } });
      if(this.score>=this.bricks.length) return this.over(true);
      this.ctx.clearRect(0,0,this.c.width,this.c.height);
      this.bricks.forEach(b=>{ if(!b.hit) { this.ctx.fillStyle='#3b82f6'; this.ctx.fillRect(b.x,b.y,b.w,b.h); } });
      this.ctx.fillStyle='#fff'; this.ctx.fillRect(this.pad.x,this.pad.y,this.pad.w,this.pad.h);
      this.ctx.beginPath(); this.ctx.arc(this.ball.x,this.ball.y,this.ball.r,0,Math.PI*2); this.ctx.fill();
      this.loopId = requestAnimationFrame(()=>this.loop()); }
    over(win) { this.running=false; cancelAnimationFrame(this.loopId); if(win) Fireworks.launch(); }
    destroy() { this.running=false; cancelAnimationFrame(this.loopId); }
  }},
  { name: '🃏 记忆翻牌', tip: '点击翻开卡牌，找出所有配对即可通关', id:3, class: class MemoryGame {
    constructor(c) { this.c=c; this.ctx=c.getContext('2d'); this.bind(); }
    bind() { this.click = e=>{ const rect=this.c.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
      const gx=Math.floor(x/(this.c.width/4)), gy=Math.floor(y/(this.c.height/2)); if(gx<4&&gy<2) this.flip(gy*4+gx); }; this.c.addEventListener('touchstart', this.click); this.c.addEventListener('mousedown', this.click); }
    start() { this.running=true; this.cards=['🍎','🍎','🍌','🍌','🍇','🍇','🍓','🍓'].sort(()=>Math.random()-0.5); this.flipped=[]; this.matched=[]; this.turns=0; this.draw(); }
    flip(i) { if(this.flipped.length===2 || this.flipped.includes(i) || this.matched.includes(i)) return; this.flipped.push(i); this.draw();
      if(this.flipped.length===2) { this.turns++; setTimeout(()=>{ if(this.cards[this.flipped[0]]===this.cards[this.flipped[1]]) this.matched.push(...this.flipped); this.flipped=[]; this.draw(); if(this.matched.length===8) this.over(true); }, 600); } }
    draw() { this.ctx.clearRect(0,0,this.c.width,this.c.height); for(let i=0;i<8;i++) { const gx=i%4, gy=Math.floor(i/4); const x=gx*(this.c.width/4), y=gy*(this.c.height/2)+20; this.ctx.fillStyle=this.matched.includes(i)?'#22c55e':this.flipped.includes(i)?'#60a5fa':'#334155'; this.ctx.fillRect(x+5,y+5,this.c.width/4-10,this.c.height/2-20); if(this.flipped.includes(i)||this.matched.includes(i)) { this.ctx.font='30px serif'; this.ctx.textAlign='center'; this.ctx.fillText(this.cards[i],x+this.c.width/8,y+this.c.height/4+20); } } }
    over(win) { this.running=false; if(win) Fireworks.launch(); }
    destroy() { this.running=false; }
  }},
  { name: '🎯 反应打靶', tip: '快速点击出现的红圈，命中10次通关', id:4, class: class TargetGame {
    constructor(c) { this.c=c; this.ctx=c.getContext('2d'); this.bind(); }
    bind() { this.click = e=>{ const rect=this.c.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
      if(Math.hypot(x-this.target.x, y-this.target.y)<this.target.r) this.hit(); }; this.c.addEventListener('touchstart', this.click); this.c.addEventListener('mousedown', this.click); }
    start() { this.running=true; this.score=0; this.spawnTarget(); this.loopId = requestAnimationFrame(()=>this.draw()); }
    spawnTarget() { this.target={x:50+Math.random()*(this.c.width-100), y:50+Math.random()*(this.c.height-100), r:30}; }
    hit() { this.score++; this.spawnTarget(); if(this.score>=10) this.over(true); }
    draw() { if(!this.running) return; this.ctx.clearRect(0,0,this.c.width,this.c.height);
      this.ctx.fillStyle='#ef4444'; this.ctx.beginPath(); this.ctx.arc(this.target.x,this.target.y,this.target.r,0,Math.PI*2); this.ctx.fill(); this.ctx.fillStyle='#fff'; this.ctx.font='16px sans-serif'; this.ctx.fillText(`进度: ${this.score}/10`, 10, 30);
      this.loopId = requestAnimationFrame(()=>this.draw()); }
    over(win) { this.running=false; cancelAnimationFrame(this.loopId); if(win) Fireworks.launch(); }
    destroy() { this.running=false; cancelAnimationFrame(this.loopId); }
  }},
  { name: '⭐ 接星星', tip: '拖动篮子接住掉落星星，接住8颗通关', id:5, class: class CatchGame {
    constructor(c) { this.c=c; this.ctx=c.getContext('2d'); this.bind(); }
    bind() { this.move = e=>{ const x=(e.touches?e.touches[0].clientX:e.clientX)-this.c.getBoundingClientRect().left; this.pad.x=x-30; this.pad.x=Math.max(0,Math.min(this.c.width-60,this.pad.x)); }; this.c.addEventListener('touchmove', this.move); this.c.addEventListener('mousemove', this.move); }
    start() { this.running=true; this.pad={x:this.c.width/2,y:this.c.height-40,w:60,h:10}; this.stars=[]; this.score=0; this.frame=0; this.loop(); }
    loop() { if(!this.running) return; this.frame++;
      if(this.frame%30===0) this.stars.push({x:Math.random()*this.c.width,y:-10,speed:3+Math.random()*2});
      this.stars.forEach(s=>{ s.y+=s.speed;
        if(s.y>this.pad.y && s.y<this.pad.y+20 && s.x>this.pad.x && s.x<this.pad.x+this.pad.w) { this.score++; s.y=9999; }
      });
      if(this.score>=8) return this.over(true);
      this.ctx.clearRect(0,0,this.c.width,this.c.height);
      this.ctx.fillStyle='#f59e0b'; this.ctx.fillRect(this.pad.x,this.pad.y,this.pad.w,this.pad.h);
      this.stars.forEach(s=>{ this.ctx.fillStyle='#3b82f6'; this.ctx.beginPath(); this.ctx.arc(s.x,s.y,8,0,Math.PI*2); this.ctx.fill(); });
      this.ctx.fillStyle='#fff'; this.ctx.font='bold 18px sans-serif'; this.ctx.fillText(`已接: ${this.score}/8`, 10, 30);
      this.loopId = requestAnimationFrame(()=>this.loop()); }
    over(win) { this.running=false; cancelAnimationFrame(this.loopId); if(win) Fireworks.launch(); }
    destroy() { this.running=false; cancelAnimationFrame(this.loopId); }
  }},
  { name: '🔢 顺序点击', tip: '按1-6的顺序点击数字，考验手速通关', id:6, class: class SequenceGame {
    constructor(c) { this.c=c; this.ctx=c.getContext('2d'); this.bind(); }
    bind() { this.click = e=>{ const rect=this.c.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
      this.nodes.forEach((n,i)=>{ if(Math.hypot(x-n.x,y-n.y)<n.r && i+1===this.next) { this.hit(i+1); } }); }; this.c.addEventListener('touchstart', this.click); this.c.addEventListener('mousedown', this.click); }
    start() { this.running=true; this.nodes=[]; this.next=1; this.generate(); this.draw(); }
    generate() { for(let i=0;i<6;i++) this.nodes.push({x:50+Math.random()*(this.c.width-100), y:60+Math.random()*(this.c.height-120), r:20}); }
    hit(num) { if(num===this.next) { this.next++; this.draw(); if(this.next>6) this.over(true); } }
    draw() { this.ctx.clearRect(0,0,this.c.width,this.c.height);
      this.nodes.forEach(n=>{ this.ctx.fillStyle='#10b981'; this.ctx.beginPath(); this.ctx.arc(n.x,n.y,n.r,0,Math.PI*2); this.ctx.fill();
        this.ctx.fillStyle='#fff'; this.ctx.font='bold 16px sans-serif'; this.ctx.textAlign='center'; this.ctx.textBaseline='middle'; this.ctx.fillText(this.nodes.indexOf(n)+1, n.x, n.y); });
      this.ctx.fillText(`下一个: ${this.next}`, this.c.width/2, 30); }
    over(win) { this.running=false; if(win) Fireworks.launch(); }
    destroy() { this.running=false; }
  }}
];

// 初始化
window.onload = () => { Store.init(); UI.init(); Fireworks.init(); };
</script>
