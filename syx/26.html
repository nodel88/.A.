<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>滑动游戏盒子</title>
<style>
  :root { --bg: #000; --text: #fff; --accent: #fe2c55; --gold: #ffbf00; --glass: rgba(255,255,255,0.12); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; height:100vh; touch-action: none; }
  
  /* 自定义垂直视口容器 */
  #pager { position:fixed; top:0; left:0; width:100%; height:100%; overflow:hidden; }
  .page { position:absolute; top:0; left:0; width:100%; height:100%; transition:transform 0.35s cubic-bezier(0.2,0.8,0.2,1); transform:translateY(0); display:flex; align-items:center; justify-content:center; background:#0a0a0a; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }

  /* 边缘滑动提示区 */
  .edge-hint { position:absolute; top:0; width:15%; height:100%; pointer-events:none; z-index:2; }
  .edge-left { left:0; background:linear-gradient(to right, rgba(255,255,255,0.04), transparent); border-right:1px solid rgba(255,255,255,0.05); }
  .edge-right { right:0; background:linear-gradient(to left, rgba(255,255,255,0.04), transparent); border-left:1px solid rgba(255,255,255,0.05); }
  .swipe-tip { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); font-size:11px; color:rgba(255,255,255,0.4); white-space:nowrap; }

  /* 底部渐变与信息 */
  .page::after { content:''; position:absolute; bottom:0; left:0; width:100%; height:25vh; background:linear-gradient(transparent, rgba(0,0,0,0.85)); pointer-events:none; }
  .info-box { position:absolute; bottom:6vh; left:5vw; z-index:10; max-width:70%; pointer-events:none; }
  .game-title { font-size:20px; font-weight:700; margin-bottom:6px; text-shadow:0 2px 4px rgba(0,0,0,0.8); }
  .game-tip { font-size:13px; opacity:0.85; line-height:1.4; color:#ddd; }

  /* 固定操作栏 (不随页面移动) */
  #fixed-ui { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:20; }
  .top-left { position:absolute; top:4vh; left:4vw; display:flex; align-items:center; gap:8px; pointer-events:auto; }
  .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(45deg, #ff6b6b, #845ec2); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; border:2px solid #fff; }
  .username { font-size:14px; font-weight:600; text-shadow:0 1px 3px #000; cursor:pointer; }
  
  .right-actions { position:absolute; right:4vw; bottom:8vh; display:flex; flex-direction:column; align-items:center; gap:16px; pointer-events:auto; }
  .action-btn { display:flex; flex-direction:column; align-items:center; cursor:pointer; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6)); transition:transform .2s; }
  .action-btn:active { transform:scale(0.9); }
  .action-icon { width:44px; height:44px; background:var(--glass); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px; border:1px solid rgba(255,255,255,0.2); backdrop-filter:blur(4px); }
  .action-label { font-size:12px; font-weight:500; text-shadow:0 1px 2px #000; }
  .like-active .action-icon { background:var(--accent); color:#fff; }
  .fav-active .action-icon { background:var(--gold); color:#fff; }

  /* 开始提示 */
  .start-hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); padding:20px 30px; border-radius:16px; text-align:center; backdrop-filter:blur(5px); z-index:5; cursor:pointer; transition:opacity .3s; }
  .start-hint p { margin-bottom:10px; font-weight:bold; font-size:18px; }
  .start-hint button { background:var(--accent); color:#fff; border:none; padding:10px 24px; border-radius:20px; font-size:14px; cursor:pointer; font-weight:600; }

  /* 数据面板 */
  #modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:100; display:none; opacity:0; transition:opacity .3s; padding:20px; }
  #modal.open { display:flex; flex-direction:column; align-items:center; opacity:1; }
  .modal-header { width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
  .modal-title { font-size:18px; font-weight:bold; }
  .close-btn { background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
  .tabs { display:flex; gap:10px; margin-bottom:16px; width:100%; justify-content:center; }
  .tab { padding:8px 16px; background:var(--glass); border-radius:20px; cursor:pointer; font-size:13px; transition:.2s; }
  .tab.active { background:var(--accent); }
  .list-container { flex:1; width:100%; overflow-y:auto; padding-bottom:40px; }
  .list-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .item-name { flex:1; font-size:15px; }
  .remove-btn { color:#888; font-size:13px; padding:6px 12px; background:rgba(255,255,255,0.1); border:none; border-radius:12px; cursor:pointer; }
  .remove-btn:active { background:rgba(255,255,255,0.2); }
  .empty-tip { text-align:center; color:#666; margin-top:40px; font-size:14px; }

  /* 通关特效 */
  #win-overlay { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:90; display:none; }
  #win-canvas { width:100%; height:100%; }
  .congrats-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:36px; font-weight:900; color:#fff; text-shadow:0 0 10px #ff2c55, 0 0 20px #ffbf00; animation:blink 0.6s infinite alternate; white-space:nowrap; }
  @keyframes blink { 0% { opacity:0.6; transform:translate(-50%,-50%) scale(1); } 100% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } }
</style>
</head>
<body>

<div id="pager"></div>

<div id="fixed-ui">
  <div class="top-left">
    <div class="avatar" id="avatar-el">?</div>
    <span class="username" id="username-el" onclick="UI.openModal()">游戏数据</span>
  </div>
  <div class="right-actions" id="right-actions">
    <div class="action-btn like-btn" onclick="UI.toggleLike()">
      <div class="action-icon">❤️</div>
      <div class="action-label" id="like-c">0</div>
    </div>
    <div class="action-btn fav-btn" onclick="UI.toggleFav()">
      <div class="action-icon">⭐</div>
      <div class="action-label" id="fav-c">收藏</div>
    </div>
    <div class="action-btn" onclick="UI.openModal()">
      <div class="action-icon">📊</div>
      <div class="action-label">我的</div>
    </div>
  </div>
</div>

<div id="win-overlay">
  <canvas id="win-canvas"></canvas>
  <div class="congrats-text">🎉 恭喜通关！</div>
</div>

<div id="modal">
  <div class="modal-header">
    <span class="modal-title">📊 游戏记录</span>
    <button class="close-btn" onclick="UI.closeModal()">×</button>
  </div>
  <div class="tabs" id="tab-group">
    <div class="tab active" data-type="played">已玩</div>
    <div class="tab" data-type="liked">已赞</div>
    <div class="tab" data-type="favorited">已藏</div>
  </div>
  <div class="list-container" id="list-container"></div>
</div>

<script>
/** 存储管理 */
const Store = {
  key: 'game_box_v3',
  state: { username: '', played: {}, liked: {}, favorited: {} },
  init() {
    const raw = localStorage.getItem(this.key);
    if (raw) this.state = { ...this.state, ...JSON.parse(raw) };
    else { this.state.username = 'User_' + Math.random().toString(36).slice(2, 8); this.save(); }
  },
  save() { localStorage.setItem(this.key, JSON.stringify(this.state)); },
  toggle(type, id) {
    const map = this.state[type] || {};
    if (map[id]) delete map[id];
    else map[id] = type === 'liked' ? (map[id] || 0) + 1 : true;
    this.state[type] = map; this.save(); return map[id];
  },
  get(type, id) { return this.state[type]?.[id] || 0; }
};

/** 烟花特效 */
const Fireworks = {
  canvas: document.getElementById('win-canvas'), ctx: null, particles: [], active: false,
  init() { this.ctx = this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize', ()=>this.resize()); },
  resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  launch() {
    if(this.active) return; this.active = true;
    document.getElementById('win-overlay').style.display = 'block';
    this.particles = [];
    for(let i=0; i<100; i++) this.spawn(Math.random()*this.canvas.width, Math.random()*this.canvas.height*0.5);
    this.loop();
    setTimeout(()=>{ this.active=false; document.getElementById('win-overlay').style.display='none'; }, 3000);
  },
  spawn(x,y) { this.particles.push({ x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:1, color:`hsl(${Math.random()*360},100%,60%)`, size:Math.random()*5+2 }); },
  loop() {
    if(!this.active) return;
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    this.particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.012; p.size*=0.98;
      this.ctx.globalAlpha = p.life; this.ctx.fillStyle = p.color;
      this.ctx.beginPath(); this.ctx.arc(p.x,p.y,p.size,0,Math.PI*2); this.ctx.fill();
    });
    this.particles = this.particles.filter(p=>p.life>0);
    requestAnimationFrame(()=>this.loop());
  }
};

/** 页面切换管理器 (解决滑动冲突的核心) */
const Pager = {
  index: 0, total: 7, startY: 0, startX: 0, isDragging: false, threshold: 40,
  init() {
    // 仅在左右两侧15%区域监听上下滑动，避免与游戏内手势冲突
    document.addEventListener('touchstart', e => {
      this.startX = e.touches[0].clientX;
      this.startY = e.touches[0].clientY;
      const isEdge = this.startX < window.innerWidth * 0.15 || this.startX > window.innerWidth * 0.85;
      if (isEdge) this.isDragging = true;
    }, {passive: true});

    document.addEventListener('touchend', e => {
      if (!this.isDragging) return;
      this.isDragging = false;
      const dy = e.changedTouches[0].clientY - this.startY;
      if (Math.abs(dy) > this.threshold) {
        if (dy < 0 && this.index < this.total - 1) this.goTo(this.index + 1);
        else if (dy > 0 && this.index > 0) this.goTo(this.index - 1);
      }
    });
  },
  goTo(i) {
    this.index = Math.max(0, Math.min(this.total-1, i));
    document.querySelectorAll('.page').forEach((p, idx) => {
      p.style.transform = `translateY(${(idx - this.index) * 100}vh)`;
      p.style.pointerEvents = idx === this.index ? 'auto' : 'none';
    });
    UI.updateActions(this.index);
    GameEngine.switch(this.index);
  }
};

/** UI 管理 */
const UI = {
  init() {
    document.getElementById('username-el').textContent = Store.state.username;
    document.getElementById('avatar-el').textContent = Store.state.username.slice(0,1).toUpperCase();
    this.renderPages();
    this.setupTabs();
    Pager.goTo(0);
  },
  renderPages() {
    const pager = document.getElementById('pager');
    GameRegistry.forEach((g, i) => {
      const page = document.createElement('div');
      page.className = 'page';
      page.dataset.id = i;
      page.innerHTML = `
        <canvas id="canvas-${i}"></canvas>
        <div class="info-box">
          <div class="game-title">${g.name}</div>
          <div class="game-tip">${g.tip}</div>
        </div>
        <div class="edge-hint edge-left"><div class="swipe-tip">⬆⬇ 切换</div></div>
        <div class="edge-hint edge-right"><div class="swipe-tip">⬆⬇ 切换</div></div>
        <div class="start-hint" id="hint-${i}">
          <p>${g.name}</p>
          <button onclick="GameEngine.start(${i})">开始游戏</button>
        </div>
      `;
      pager.appendChild(page);
    });
  },
  updateActions(id) {
    document.getElementById('like-c').textContent = Store.get('liked', id);
    document.getElementById('fav-c').textContent = Store.get('favorited', id) ? '已藏' : '收藏';
    const likeBtn = document.querySelector('.like-btn');
    const favBtn = document.querySelector('.fav-btn');
    likeBtn.classList.toggle('like-active', !!Store.get('liked', id));
    favBtn.classList.toggle('fav-active', !!Store.get('favorited', id));
    likeBtn.onclick = () => { Store.toggle('liked', id); this.updateActions(id); };
    favBtn.onclick = () => { Store.toggle('favorited', id); this.updateActions(id); };
  },
  toggleLike() { Store.toggle('liked', Pager.index); this.updateActions(Pager.index); },
  toggleFav() { Store.toggle('favorited', Pager.index); this.updateActions(Pager.index); },
  openModal(type='played') {
    document.getElementById('modal').style.display = 'flex';
    requestAnimationFrame(() => document.getElementById('modal').classList.add('open'));
    this.switchTab(type);
  },
  closeModal() { document.getElementById('modal').classList.remove('open'); setTimeout(()=>document.getElementById('modal').style.display='none',300); },
  switchTab(type) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
    const container = document.getElementById('list-container');
    const data = Store.state[type] || {};
    container.innerHTML = '';
    if (Object.keys(data).length === 0) { container.innerHTML = '<div class="empty-tip">暂无记录，快去滑动玩游戏吧！</div>'; return; }
    Object.entries(data).forEach(([id, val]) => {
      const name = GameRegistry[id]?.name || `游戏${id}`;
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `<span class="item-name">${name} ${type==='liked'?`(${val}赞)`:''}</span>`;
      const btn = document.createElement('button');
      btn.className = 'remove-btn';
      btn.textContent = type==='played' ? '删除记录' : `取消${type==='liked'?'点赞':'收藏'}`;
      btn.onclick = () => { Store.toggle(type, id); this.switchTab(type); this.updateActions(Pager.index); };
      div.appendChild(btn); container.appendChild(div);
    });
  },
  setupTabs() { document.querySelectorAll('.tab').forEach(t => t.onclick = () => this.switchTab(t.dataset.type)); }
};

/** 游戏引擎 */
const GameEngine = {
  currentId: -1, loopId: null, games: {},
  switch(id) {
    if (this.currentId === id) return;
    this.stop(this.currentId);
    this.currentId = id;
    document.getElementById(`hint-${id}`).style.display = 'block';
  },
  start(id) {
    if (this.games[id]?.running) return;
    document.getElementById(`hint-${id}`).style.display = 'none';
    const canvas = document.getElementById(`canvas-${id}`);
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    if (!this.games[id]) this.games[id] = new GameRegistry[id].class(canvas);
    this.games[id].start();
    Store.state.played[id] = true; Store.save();
  },
  stop(id) {
    if (id >= 0 && this.games[id]) this.games[id].destroy();
  }
};

/** 7个游戏实现 */
const GameRegistry = [
  { name: '🐦 像素跳跃', tip: '点击/空格跳跃躲避管道，得5分通关', class: class Flappy {
    constructor(c){this.c=c;this.ctx=c.getContext('2d');}
    start(){this.running=true;this.y=this.c.height/2;this.vy=0;this.score=0;this.pipes=[];this.frame=0;
      this.tap=e=>{e.preventDefault();if(e.type==='keydown'&&e.code!=='Space')return;this.vy=-8;};
      this.c.addEventListener('touchstart',this.tap);this.c.addEventListener('mousedown',this.tap);this.keyH=e=>this.tap(e);this.c.addEventListener('keydown',this.keyH);
      this.loop();}
    loop(){if(!this.running)return;this.frame++;
      if(this.frame%80===0)this.pipes.push({x:this.c.width,gap:140});
      this.pipes.forEach(p=>{p.x-=3.5;
        this.ctx.fillStyle='#4ade80';this.ctx.fillRect(p.x,0,p.w||40,this.c.height-p.gap-100);this.ctx.fillRect(p.x,this.c.height-p.gap+100,p.w||40,999);
        if(p.x<30&&p.x>10)this.check(p);});
      this.pipes=this.pipes.filter(p=>p.x>-40);
      this.vy+=0.45;this.y+=this.vy;
      this.ctx.clearRect(0,0,this.c.width,this.c.height);
      this.ctx.fillStyle='#ff2c55';this.ctx.beginPath();this.ctx.arc(50,this.y,15,0,Math.PI*2);this.ctx.fill();
      if(this.y>this.c.height||this.y<0)this.over(false);
      this.ctx.fillStyle='#fff';this.ctx.font='bold 24px sans-serif';this.ctx.fillText(`得分: ${this.score}`,10,30);
      this.loopId=requestAnimationFrame(()=>this.loop());}
    check(p){if(this.y-15<this.c.height-p.gap-100||this.y+15>this.c.height-p.gap+100)return this.over(false);this.score++;if(this.score>=5)this.over(true);}
    over(w){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('keydown',this.keyH);if(w)Fireworks.launch();}
    destroy(){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('touchstart',this.tap);this.c.removeEventListener('mousedown',this.tap);this.c.removeEventListener('keydown',this.keyH);}
  }},
  { name: '🐍 贪吃蛇', tip: '滑动屏幕控制方向，吃够5个食物通关', class: class Snake {
    constructor(c){this.c=c;this.ctx=c.getContext('2d');this.g=20;this.dir=0;}
    start(){this.running=true;this.snake=[{x:5,y:5}];this.food=this.rand();this.score=0;this.frame=0;
      this.ts=null;this.c.addEventListener('touchstart',e=>this.ts={x:e.touches[0].clientX,y:e.touches[0].clientY});
      this.c.addEventListener('touchmove',e=>{if(!this.ts)return;e.preventDefault();const dx=e.touches[0].clientX-this.ts.x,dy=e.touches[0].clientY-this.ts.y;
        if(Math.abs(dx)>Math.abs(dy))this.dir=dx>0?1:-1;else this.dir=dy>0?-2:2;this.ts=null;},{passive:false});
      this.kH=e=>{if(e.key==='ArrowUp')this.dir=-2;if(e.key==='ArrowDown')this.dir=2;if(e.key==='ArrowLeft')this.dir=-1;if(e.key==='ArrowRight')this.dir=1;};
      this.c.addEventListener('keydown',this.kH);this.loopId=setInterval(()=>this.loop(),120);}
    rand(){return{x:Math.floor(Math.random()*(this.c.width/this.g)),y:Math.floor(Math.random()*(this.c.height/this.g))};}
    loop(){if(!this.running)return;const h={...this.snake[0]};
      if(this.dir===1)h.x++;else if(this.dir===-1)h.x--;else if(this.dir===2)h.y++;else if(this.dir===-2)h.y--;
      if(h.x<0||h.y<0||h.x>=this.c.width/this.g||h.y>=this.c.height/this.g||this.snake.some(s=>s.x===h.x&&s.y===h.y))return this.over(false);
      this.snake.unshift(h);if(h.x===this.food.x&&h.y===this.food.y){this.score++;this.food=this.rand();}else this.snake.pop();
      if(this.score>=5)return this.over(true);
      this.ctx.clearRect(0,0,this.c.width,this.c.height);this.ctx.fillStyle='#2dd4bf';this.snake.forEach(s=>this.ctx.fillRect(s.x*this.g,s.y*this.g,this.g-1,this.g-1));
      this.ctx.fillStyle='#f59e0b';this.ctx.beginPath();this.ctx.arc(this.food.x*this.g+10,this.food.y*this.g+10,8,0,Math.PI*2);this.ctx.fill();}
    over(w){this.running=false;clearInterval(this.loopId);this.c.removeEventListener('keydown',this.kH);if(w)Fireworks.launch();}
    destroy(){this.running=false;clearInterval(this.loopId);this.c.removeEventListener('keydown',this.kH);this.c.removeEventListener('touchstart',()=>{});}
  }},
  { name: '🧱 打砖块', tip: '拖动挡板反弹球，击碎全部砖块通关', class: class Breakout {
    constructor(c){this.c=c;this.ctx=c.getContext('2d');}
    start(){this.running=true;this.b={x:this.c.width/2,y:this.c.height-50,dx:4,dy:-4,r:6};this.p={x:this.c.width/2-40,y:this.c.height-30,w:80,h:10};this.br=[];this.sc=0;
      for(let r=0;r<3;r++)for(let c=0;c<6;c++)this.br.push({x:c*(this.c.width/6)+5,y:r*35+40,w:this.c.width/6-10,h:25,h:false});
      this.mv=e=>{const x=e.touches?e.touches[0].clientX:e.clientX;const r=this.c.getBoundingClientRect();this.p.x=x-r.left-this.p.w/2;this.p.x=Math.max(0,Math.min(this.c.width-this.p.w,this.p.x));};
      this.c.addEventListener('touchmove',this.mv);this.c.addEventListener('mousemove',this.mv);this.loop();}
    loop(){if(!this.running)return;this.b.x+=this.b.dx;this.b.y+=this.b.dy;
      if(this.b.x<0||this.b.x>this.c.width)this.b.dx*=-1;if(this.b.y<0)this.b.dy*=-1;if(this.b.y>this.c.height)return this.over(false);
      if(this.b.x>this.p.x&&this.b.x<this.p.x+this.p.w&&this.b.y+this.b.r>this.p.y){this.b.dy*=-1;this.b.y=this.p.y-this.b.r;}
      this.br.forEach(b=>{if(!b.h&&this.b.x>b.x&&this.b.x<b.x+b.w&&this.b.y>b.y&&this.b.y<b.y+b.h){b.h=true;this.b.dy*=-1;this.sc++;}});
      if(this.sc>=this.br.length)return this.over(true);
      this.ctx.clearRect(0,0,this.c.width,this.c.height);this.br.forEach(b=>{if(!b.h){this.ctx.fillStyle='#3b82f6';this.ctx.fillRect(b.x,b.y,b.w,b.h);}});
      this.ctx.fillStyle='#fff';this.ctx.fillRect(this.p.x,this.p.y,this.p.w,this.p.h);this.ctx.beginPath();this.ctx.arc(this.b.x,this.b.y,this.b.r,0,Math.PI*2);this.ctx.fill();
      this.loopId=requestAnimationFrame(()=>this.loop());}
    over(w){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('touchmove',this.mv);this.c.removeEventListener('mousemove',this.mv);if(w)Fireworks.launch();}
    destroy(){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('touchmove',this.mv);this.c.removeEventListener('mousemove',this.mv);}
  }},
  { name: '🃏 记忆翻牌', tip: '点击翻开卡牌，找出4组配对即可通关', class: class Memory {
    constructor(c){this.c=c;this.ctx=c.getContext('2d');}
    start(){this.running=true;this.cards=['🍎','🍌','🍇','🍓','🍒','🥝','🍑','🍍'].sort(()=>Math.random()-0.5);this.fl=[];this.ma=[];
      this.cl=e=>{const r=this.c.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
        const gx=Math.floor(x/(this.c.width/4)),gy=Math.floor(y/(this.c.height/2));if(gx<4&&gy<2)this.flip(gy*4+gx);};
      this.c.addEventListener('touchstart',this.cl);this.c.addEventListener('mousedown',this.cl);this.draw();}
    flip(i){if(this.fl.length===2||this.fl.includes(i)||this.ma.includes(i))return;this.fl.push(i);this.draw();
      if(this.fl.length===2)setTimeout(()=>{if(this.cards[this.fl[0]]===this.cards[this.fl[1]])this.ma.push(...this.fl);this.fl=[];this.draw();if(this.ma.length===8)this.over(true);},600);}
    draw(){this.ctx.clearRect(0,0,this.c.width,this.c.height);for(let i=0;i<8;i++){const gx=i%4,gy=Math.floor(i/4);const x=gx*(this.c.width/4),y=gy*(this.c.height/2)+20;
      this.ctx.fillStyle=this.ma.includes(i)?'#22c55e':this.fl.includes(i)?'#60a5fa':'#334155';this.ctx.fillRect(x+5,y+5,this.c.width/4-10,this.c.height/2-20);
      if(this.fl.includes(i)||this.ma.includes(i)){this.ctx.font='30px serif';this.ctx.textAlign='center';this.ctx.fillText(this.cards[i],x+this.c.width/8,y+this.c.height/4+20);}}}
    over(w){this.running=false;this.c.removeEventListener('touchstart',this.cl);this.c.removeEventListener('mousedown',this.cl);if(w)Fireworks.launch();}
    destroy(){this.running=false;this.c.removeEventListener('touchstart',this.cl);this.c.removeEventListener('mousedown',this.cl);}
  }},
  { name: '🎯 反应打靶', tip: '快速点击出现的红圈，命中10次通关', class: class Target {
    constructor(c){this.c=c;this.ctx=c.getContext('2d');}
    start(){this.running=true;this.sc=0;this.sp();
      this.cl=e=>{const r=this.c.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
        if(Math.hypot(x-this.t.x,y-this.t.y)<this.t.r){this.sc++;this.sp();if(this.sc>=10)this.over(true);}};
      this.c.addEventListener('touchstart',this.cl);this.c.addEventListener('mousedown',this.cl);this.loop();}
    sp(){this.t={x:50+Math.random()*(this.c.width-100),y:50+Math.random()*(this.c.height-100),r:35};}
    loop(){if(!this.running)return;this.ctx.clearRect(0,0,this.c.width,this.c.height);
      this.ctx.fillStyle='#ef4444';this.ctx.beginPath();this.ctx.arc(this.t.x,this.t.y,this.t.r,0,Math.PI*2);this.ctx.fill();
      this.ctx.fillStyle='#fff';this.ctx.font='16px sans-serif';this.ctx.textAlign='left';this.ctx.fillText(`进度: ${this.sc}/10`,10,30);
      this.loopId=requestAnimationFrame(()=>this.loop());}
    over(w){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('touchstart',this.cl);this.c.removeEventListener('mousedown',this.cl);if(w)Fireworks.launch();}
    destroy(){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('touchstart',this.cl);this.c.removeEventListener('mousedown',this.cl);}
  }},
  { name: '⭐ 接星星', tip: '拖动篮子接住掉落星星，接住8颗通关', class: class Catch {
    constructor(c){this.c=c;this.ctx=c.getContext('2d');}
    start(){this.running=true;this.p={x:this.c.width/2,y:this.c.height-40,w:60,h:10};this.st=[];this.sc=0;this.f=0;
      this.mv=e=>{const x=(e.touches?e.touches[0].clientX:e.clientX)-this.c.getBoundingClientRect().left;this.p.x=x-30;this.p.x=Math.max(0,Math.min(this.c.width-60,this.p.x));};
      this.c.addEventListener('touchmove',this.mv);this.c.addEventListener('mousemove',this.mv);this.loop();}
    loop(){if(!this.running)return;this.f++;
      if(this.f%25===0)this.st.push({x:Math.random()*this.c.width,y:-10,s:2.5+Math.random()*2});
      this.st.forEach(s=>{s.y+=s.s;if(s.y>this.p.y&&s.y<this.p.y+20&&s.x>this.p.x&&s.x<this.p.x+this.p.w){this.sc++;s.y=9999;}});
      if(this.sc>=8)return this.over(true);
      this.ctx.clearRect(0,0,this.c.width,this.c.height);this.ctx.fillStyle='#f59e0b';this.ctx.fillRect(this.p.x,this.p.y,this.p.w,this.p.h);
      this.st.forEach(s=>{this.ctx.fillStyle='#3b82f6';this.ctx.beginPath();this.ctx.arc(s.x,s.y,8,0,Math.PI*2);this.ctx.fill();});
      this.ctx.fillStyle='#fff';this.ctx.font='bold 18px sans-serif';this.ctx.fillText(`已接: ${this.sc}/8`,10,30);
      this.loopId=requestAnimationFrame(()=>this.loop());}
    over(w){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('touchmove',this.mv);this.c.removeEventListener('mousemove',this.mv);if(w)Fireworks.launch();}
    destroy(){this.running=false;cancelAnimationFrame(this.loopId);this.c.removeEventListener('touchmove',this.mv);this.c.removeEventListener('mousemove',this.mv);}
  }},
  { name: '🔢 顺序点击', tip: '按1-6的顺序点击数字，考验手速通关', class: class Sequence {
    constructor(c){this.c=c;this.ctx=c.getContext('2d');}
    start(){this.running=true;this.ns=[];this.nx=1;
      for(let i=0;i<6;i++)this.ns.push({x:40+Math.random()*(this.c.width-80),y:60+Math.random()*(this.c.height-120),r:22});
      this.cl=e=>{const r=this.c.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
        this.ns.forEach(n=>{if(Math.hypot(x-n.x,y-n.y)<n.r&&this.ns.indexOf(n)+1===this.nx){this.nx++;this.draw();if(this.nx>7)this.over(true);}});};
      this.c.addEventListener('touchstart',this.cl);this.c.addEventListener('mousedown',this.cl);this.draw();}
    draw(){this.ctx.clearRect(0,0,this.c.width,this.c.height);this.ctx.fillStyle='#10b981';this.ns.forEach(n=>{this.ctx.beginPath();this.ctx.arc(n.x,n.y,n.r,0,Math.PI*2);this.ctx.fill();
      this.ctx.fillStyle='#fff';this.ctx.font='bold 16px sans-serif';this.ctx.textAlign='center';this.ctx.textBaseline='middle';this.ctx.fillText(this.ns.indexOf(n)+1,n.x,n.y);});
      this.ctx.fillStyle='#aaa';this.ctx.font='14px sans-serif';this.ctx.fillText(`下一个: ${this.nx}`,this.c.width/2,30);}
    over(w){this.running=false;this.c.removeEventListener('touchstart',this.cl);this.c.removeEventListener('mousedown',this.cl);if(w)Fireworks.launch();}
    destroy(){this.running=false;this.c.removeEventListener('touchstart',this.cl);this.c.removeEventListener('mousedown',this.cl);}
  }}
];

window.onload = () => { Store.init(); UI.init(); Fireworks.init(); Pager.init(); };
