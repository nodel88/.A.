<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf8ef;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui;padding-bottom:48px}
.game-wrapper{position:relative;display:flex;flex-direction:column;align-items:center}
canvas{background:#faf8ef;border:2px solid #cdc1b4;border-radius:8px;max-width:90vw;max-height:70vh}
.info{text-align:center;margin-top:8px}
.title{color:#776e65;font-size:24px;font-weight:900}
.desc{color:#a39480;font-size:12px}
.score{color:#776e65;font-size:20px;font-weight:700}
.side-btns{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3;align-items:center}
.side-btns button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.85);border:1px solid #ccc;color:#776e65;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nav-btns{display:flex;flex-direction:column;gap:4px}
.social-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#776e65;border:1px solid rgba(0,0,0,0.1);transition:0.15s;position:relative}
.social-btn.liked{color:#ff4d4f;background:rgba(255,77,79,0.1)}
.social-btn.collected{color:#e6a817;background:rgba(230,168,23,0.1)}
.social-btn .count{position:absolute;bottom:-8px;font-size:10px;font-weight:700;background:#fff;padding:2px 6px;border-radius:10px}
.victory-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;background:rgba(0,0,0,0.2)}
.victory-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8vmin;font-weight:900;color:#fff;text-shadow:0 0 20px #ffd700;animation:blink 0.5s infinite alternate}
@keyframes blink{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0.8;transform:translate(-50%,-50%) scale(1.05)}}
</style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="c" width="300" height="400"></canvas>
  <div class="info">
    <div class="title">🐦 Flappy Bird</div>
    <div class="desc">手机点击屏幕 / 电脑按空格键让鸟飞</div>
    <div class="score" id="scoreDisplay">0</div>
  </div>
</div>
<div class="side-btns">
  <button id="muteBtn">🔊</button>
  <button id="restartBtn">↺</button>
  <div class="nav-btns">
    <button class="nav-up">▲</button>
    <button class="nav-down">▼</button>
  </div>
  <div class="social-btn like-btn" id="likeBtn">❤️<span class="count" id="likeCount">0</span></div>
  <div class="social-btn collect-btn" id="collectBtn">⭐</div>
</div>
<script>
const GAME_ID='flappy';
let audioCtx=null, isMuted=false;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx||isMuted) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='flap'){ osc.frequency.setValueAtTime(500,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800,audioCtx.currentTime+0.1); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='hit'){ osc.frequency.setValueAtTime(200,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.5); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5); osc.start(); osc.stop(audioCtx.currentTime+0.5); }
  else if(type==='point'){ osc.frequency.setValueAtTime(700,audioCtx.currentTime); gain.gain.setValueAtTime(0.08,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2); osc.start(); osc.stop(audioCtx.currentTime+0.2); }
}
function playFireworkSound(){
  if(!audioCtx||isMuted) return;
  const bufferSize=audioCtx.sampleRate*0.5;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*0.1));
  const source=audioCtx.createBufferSource(); source.buffer=buffer;
  const gain=audioCtx.createGain(); gain.gain.setValueAtTime(0.5,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);
  source.connect(gain); gain.connect(audioCtx.destination); source.start(); source.stop(audioCtx.currentTime+0.5);
}
function toggleMute(){
  isMuted=!isMuted;
  document.getElementById('muteBtn').textContent=isMuted?'🔇':'🔊';
}
document.getElementById('muteBtn').addEventListener('click',toggleMute);
document.querySelector('.nav-up').addEventListener('click',()=>window.parent.postMessage({type:'nav',direction:'up'},'*'));
document.querySelector('.nav-down').addEventListener('click',()=>window.parent.postMessage({type:'nav',direction:'down'},'*'));

function updateSocial(){
  const likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  document.getElementById('likeCount').textContent=likes;
  document.getElementById('likeBtn').classList.toggle('liked',likes>0);
  const favs=JSON.parse(localStorage.getItem('favs')||'[]');
  document.getElementById('collectBtn').classList.toggle('collected',favs.includes(GAME_ID));
}
document.getElementById('likeBtn').addEventListener('click',()=>{
  let likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  if(likes>=999) return alert('点赞已达上限 999 ❤️');
  likes++; localStorage.setItem('like_'+GAME_ID,likes); updateSocial();
  if(navigator.vibrate) navigator.vibrate(10);
});
document.getElementById('collectBtn').addEventListener('click',()=>{
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  const idx=favs.indexOf(GAME_ID);
  if(idx>-1) favs.splice(idx,1); else favs.push(GAME_ID);
  localStorage.setItem('favs',JSON.stringify(favs)); updateSocial();
});
updateSocial();
function notifyPlayed(){ window.parent.postMessage({type:'played',gameId:GAME_ID},'*'); }

const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=300,H=400;
let bird={x:60,y:200,vy:0}, pipes=[], score=0, gameover=false, winTriggered=false;
function addPipe(){ pipes.push({x:W, y:Math.random()*200+50, scored:false}); }
function reset(){
  bird={x:60,y:200,vy:0}; pipes=[]; score=0; gameover=false; winTriggered=false;
  addPipe(); const ov=document.querySelector('.victory-overlay'); if(ov) ov.remove(); notifyPlayed();
}
function showVictory(){
  const ov=document.createElement('div'); ov.className='victory-overlay';
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    ov.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.className='victory-text'; txt.textContent='🎉 恭喜成功！';
  ov.appendChild(txt); document.body.appendChild(ov); playFireworkSound();
  setTimeout(()=>ov.remove(),3000);
}
function draw(){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#faf8ef'; ctx.fillRect(0,0,W,H);
  if(!gameover){
    bird.vy+=0.5; bird.y+=bird.vy;
    if(bird.y<0 || bird.y>H-20){ gameover=true; playSound('hit'); }
    pipes.forEach(p=>p.x-=2);
    pipes=pipes.filter(p=>p.x>-40);
    if(pipes.length===0||pipes[pipes.length-1].x<W-120) addPipe();
    pipes.forEach(p=>{
      if(!p.scored && p.x+30<bird.x){ p.scored=true; score++; playSound('point'); }
      if(bird.x+18>p.x && bird.x<p.x+30 && (bird.y<p.y || bird.y+18>p.y+80)){ gameover=true; playSound('hit'); }
    });
    if(score>=10 && !winTriggered){ winTriggered=true; gameover=true; showVictory(); setTimeout(reset,3000); }
  }
  pipes.forEach(p=>{ ctx.fillStyle='#7caf7a'; ctx.fillRect(p.x,0,30,p.y); ctx.fillRect(p.x,p.y+80,30,H-p.y-80); });
  ctx.fillStyle='#f2b179'; ctx.fillRect(bird.x,bird.y,18,18);
  ctx.fillStyle='#776e65'; ctx.font='bold 36px system-ui'; ctx.fillText(score, W/2-15, 60);
  if(gameover && !winTriggered){
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#776e65'; ctx.font='bold 24px system-ui'; ctx.textAlign='center';
    ctx.fillText('游戏结束',W/2, H/2-10); ctx.fillText('得分:'+score, W/2, H/2+30); ctx.textAlign='left';
  }
  document.getElementById('scoreDisplay').textContent=score;
  requestAnimationFrame(draw);
}
document.addEventListener('keydown',(e)=>{ initAudio(); if(e.code==='Space'){ if(gameover) reset(); else bird.vy=-6; playSound('flap'); } });
c.addEventListener('touchstart',()=>{ initAudio(); if(gameover) reset(); else bird.vy=-6; playSound('flap'); });
document.getElementById('restartBtn').onclick=reset;
reset(); draw();
</script>
</body>
</html>
