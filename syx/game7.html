<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猜数字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf8ef;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui;color:#776e65}
.info{text-align:center;margin-bottom:8px}
.title{font-size:8vmin;font-weight:900;color:#776e65}
.desc{font-size:4vmin;color:#a39480}
input{padding:12px;font-size:5vmin;width:60%;max-width:300px;text-align:center;border-radius:12px;border:2px solid #cdc1b4;background:#fff;color:#776e65;outline:none;margin:12px 0}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
button{padding:12px 24px;font-size:5vmin;border-radius:12px;border:none;font-weight:700;cursor:pointer;transition:0.1s}
#checkBtn{background:#8f7a66;color:#fff}
#restartBtn{background:#cdc1b4;color:#fff}
.social-actions{display:flex;gap:16px;margin-left:8px}
.social-btn{width:44px;height:44px;border-radius:50%;background:#8f7a66;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;position:relative;transition:0.2s}
.social-btn.liked{background:#f65e3b}
.social-btn.collected{background:#e6a817}
.social-btn .count{position:absolute;bottom:-8px;font-size:10px;font-weight:700;background:#776e65;color:#fff;padding:2px 6px;border-radius:10px}
.nav-btns{display:flex;gap:4px}
.nav-btns button{width:36px;height:36px;border-radius:50%;background:#cdc1b4;color:#fff;border:none;font-size:18px;cursor:pointer}
#hint{font-size:5vmin;margin-top:8px;color:#8f7a66}
#count{font-size:4vmin;color:#a39480}
.victory-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;background:rgba(0,0,0,0.2)}
.victory-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8vmin;font-weight:900;color:#fff;text-shadow:0 0 20px #ffd700;animation:blink 0.5s infinite alternate}
@keyframes blink{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0.8;transform:translate(-50%,-50%) scale(1.05)}}
</style>
</head>
<body>
<div class="info">
  <div class="title">🔢 猜数字</div>
  <div class="desc">手机输入数字点击猜 / 电脑键盘输入回车猜</div>
</div>
<input type="number" id="guess" min="1" max="100" placeholder="输入数字">
<div class="btns">
  <button id="muteBtn">🔊 静音</button>
  <button id="checkBtn">🎯 猜</button>
  <button id="restartBtn">↺ 重新开始</button>
  <div class="social-actions">
    <div class="nav-btns">
      <button class="nav-up">▲</button>
      <button class="nav-down">▼</button>
    </div>
    <div class="social-btn like-btn" id="likeBtn">❤️<span class="count" id="likeCount">0</span></div>
    <div class="social-btn collect-btn" id="collectBtn">⭐</div>
  </div>
</div>
<p id="hint"></p>
<p id="count"></p>
<script>
const GAME_ID='guess';
let audioCtx=null, musicInterval=null, isMuted=false;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx||isMuted) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='guess'){ osc.frequency.setValueAtTime(500,audioCtx.currentTime); gain.gain.setValueAtTime(0.08,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='win'){ osc.type='triangle'; osc.frequency.setValueAtTime(523,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1047,audioCtx.currentTime+0.8); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.8); osc.start(); osc.stop(audioCtx.currentTime+0.8); }
  else if(type==='wrong'){ osc.frequency.setValueAtTime(200,audioCtx.currentTime); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3); osc.start(); osc.stop(audioCtx.currentTime+0.3); }
}
function startMusic(){
  if(musicInterval||isMuted) return;
  const notes=[349,392,440,494,440,392,349,330];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx||isMuted) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.03,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
    i++;
  },500);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function playFireworkSound(){
  if(!audioCtx||isMuted) return;
  const bufferSize = audioCtx.sampleRate * 0.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i/(audioCtx.sampleRate*0.1));
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  source.connect(gain); gain.connect(audioCtx.destination);
  source.start(); source.stop(audioCtx.currentTime + 0.5);
}
function toggleMute(){
  isMuted = !isMuted;
  document.getElementById('muteBtn').textContent = isMuted ? '🔇 已静音' : '🔊 静音';
  if (isMuted) { stopMusic(); } else { startMusic(); }
}
document.getElementById('muteBtn').addEventListener('click', toggleMute);
document.querySelector('.nav-up').addEventListener('click', ()=> window.parent.postMessage({type:'nav',direction:'up'},'*'));
document.querySelector('.nav-down').addEventListener('click', ()=> window.parent.postMessage({type:'nav',direction:'down'},'*'));

function updateSocial(){
  const likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  document.getElementById('likeCount').textContent=likes;
  document.getElementById('likeBtn').classList.toggle('liked',likes>0);
  const favs=JSON.parse(localStorage.getItem('favs')||'[]');
  document.getElementById('collectBtn').classList.toggle('collected',favs.includes(GAME_ID));
}
document.getElementById('likeBtn').addEventListener('click',()=>{
  let likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  if(likes>=999) return alert('点赞已达上限 999 ❤️');
  likes++; localStorage.setItem('like_'+GAME_ID,likes); updateSocial();
  if(navigator.vibrate) navigator.vibrate(10);
});
document.getElementById('collectBtn').addEventListener('click',()=>{
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  const idx=favs.indexOf(GAME_ID);
  if(idx>-1) favs.splice(idx,1); else favs.push(GAME_ID);
  localStorage.setItem('favs',JSON.stringify(favs)); updateSocial();
});
updateSocial();
function notifyPlayed(){ if(window.parent) window.parent.postMessage({type:'played',gameId:GAME_ID},'*'); }

let target, count;
function init(){
  target=Math.floor(Math.random()*100)+1; count=0;
  document.getElementById('hint').textContent=''; document.getElementById('count').textContent='';
  document.getElementById('guess').value='';
  stopMusic(); startMusic(); const ov=document.querySelector('.victory-overlay'); if(ov) ov.remove(); notifyPlayed();
}
function check(){
  initAudio();
  const g=parseInt(document.getElementById('guess').value);
  if(!g) return; count++;
  if(g===target){
    document.getElementById('hint').textContent='🎉 答对了！';
    document.getElementById('count').textContent='用了 '+count+' 次';
    stopMusic(); playSound('win'); showVictory(); setTimeout(init,3000);
  }else{
    if(g<target) document.getElementById('hint').textContent='📈 太小了';
    else document.getElementById('hint').textContent='📉 太大了';
    document.getElementById('count').textContent='已猜 '+count+' 次';
    playSound('wrong');
  }
}
function showVictory(){
  const ov=document.createElement('div'); ov.className='victory-overlay';
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    ov.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.className='victory-text'; txt.textContent='🎉 恭喜成功！';
  ov.appendChild(txt);
  document.body.appendChild(ov);
  playFireworkSound();
  setTimeout(()=>ov.remove(),3000);
}
document.getElementById('checkBtn').onclick=check;
document.getElementById('restartBtn').onclick=init;
document.getElementById('guess').addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
init();
</script>
</body>
</html>
