<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎮 游戏盒子 - 纯净滑动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1008;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: pan-y;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: #faf8f0;
        }

        .swiper-viewport {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .swiper-viewport::-webkit-scrollbar {
            display: none;
        }

        .game-panel {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #faf8f0;
            border-bottom: 1px solid #e8ddd0;
        }
        .game-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 操作提示（自动消失） */
        .game-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 0.5px;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            transition: opacity 0.4s ease, visibility 0.4s ease;
            opacity: 1;
            visibility: visible;
        }
        .game-hint.hidden-hint {
            opacity: 0;
            visibility: hidden;
        }

        #firework-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        .congrats-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .congrats-overlay.show {
            display: flex;
        }
        .congrats-text {
            font-size: clamp(36px, 8vw, 60px);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px #ff9d00, 0 0 60px #ff6a00, 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: congratsFlash 0.6s ease-in-out infinite alternate;
            letter-spacing: 4px;
        }
        @keyframes congratsFlash {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(1.12); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="swiper-viewport" id="swiperViewport">
            <!-- 游戏面板动态生成 -->
        </div>
    </div>

    <canvas id="firework-canvas"></canvas>
    <div class="congrats-overlay" id="congratsOverlay">
        <span class="congrats-text">🎉 恭喜成功！</span>
    </div>

    <script>
        (function() {
            const GAME_FILES = [
                'game1.html', 'game2.html', 'game3.html', 'game4.html', 'game5.html', 'game6.html', 'game7.html'
            ];
            const GAME_NAMES = [
                '数字拼图', '贪吃蛇', '打砖块', '记忆翻牌', '快速点击', '躲避障碍', '颜色匹配'
            ];
            const GAME_IDS = ['game1', 'game2', 'game3', 'game4', 'game5', 'game6', 'game7'];
            const TOTAL_GAMES = 7;

            const swiperViewport = document.getElementById('swiperViewport');
            const fireworkCanvas = document.getElementById('firework-canvas');
            const ctx = fireworkCanvas.getContext('2d');
            const congratsOverlay = document.getElementById('congratsOverlay');

            let currentPanelIndex = 0;
            let globalAudioCtx = null;
            let fireworkParticles = [];
            let fireworkRunning = false;
            let fireworkAnimId = null;
            let congratsTimeout = null;
            let hintTimers = {};

            // 音频
            function getAudioCtx() {
                if (!globalAudioCtx) {
                    globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (globalAudioCtx.state === 'suspended') globalAudioCtx.resume();
                return globalAudioCtx;
            }

            function playFireworkSound() {
                try {
                    const ac = getAudioCtx();
                    const t = ac.currentTime;
                    for (let i = 0; i < 6; i++) {
                        const osc = ac.createOscillator();
                        const gain = ac.createGain();
                        osc.type = 'sawtooth';
                        const f = 80 + Math.random() * 400;
                        osc.frequency.setValueAtTime(f, t + i * 0.04);
                        osc.frequency.exponentialRampToValueAtTime(20, t + i * 0.04 + 0.5);
                        gain.gain.setValueAtTime(0.18, t + i * 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.04 + 0.5);
                        osc.connect(gain);
                        gain.connect(ac.destination);
                        osc.start(t + i * 0.04);
                        osc.stop(t + i * 0.04 + 0.5);
                    }
                } catch (e) {}
            }

            // 烟花
            function resizeFireworkCanvas() {
                fireworkCanvas.width = window.innerWidth;
                fireworkCanvas.height = window.innerHeight;
            }

            function createFireworkParticles(x, y) {
                const count = 80 + Math.floor(Math.random() * 60);
                const colors = [
                    '#ff6b6b', '#ff9d42', '#ffcd3c', '#ff5e99', '#ff8a5c',
                    '#feca57', '#ff6348', '#ff9ff3', '#ffeaa7', '#fd79a8',
                    '#fdcb6e', '#e17055', '#fab1a0', '#ff7675', '#f8a5c2',
                    '#ffd32a', '#ff6b81', '#ffa502', '#ff4757', '#ffda79'
                ];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 9;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    fireworkParticles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: 0.006 + Math.random() * 0.02,
                        size: 1.5 + Math.random() * 4,
                        color,
                        gravity: 0.04 + Math.random() * 0.06,
                    });
                }
            }

            function startFireworks() {
                fireworkParticles = [];
                fireworkRunning = true;
                fireworkCanvas.style.display = 'block';
                resizeFireworkCanvas();
                const w = fireworkCanvas.width;
                const h = fireworkCanvas.height;
                for (let burst = 0; burst < 8; burst++) {
                    setTimeout(() => {
                        if (!fireworkRunning) return;
                        const bx = w * 0.2 + Math.random() * w * 0.6;
                        const by = h * 0.15 + Math.random() * h * 0.45;
                        createFireworkParticles(bx, by);
                        if (burst < 6) playFireworkSound();
                    }, burst * 280);
                }
                let extra = 0;
                const interval = setInterval(() => {
                    if (!fireworkRunning || extra >= 5) {
                        clearInterval(interval);
                        return;
                    }
                    const bx = w * 0.15 + Math.random() * w * 0.7;
                    const by = h * 0.1 + Math.random() * h * 0.5;
                    createFireworkParticles(bx, by);
                    playFireworkSound();
                    extra++;
                }, 500);
                animateFireworks();
                setTimeout(() => stopFireworks(), 4200);
            }

            function stopFireworks() {
                fireworkRunning = false;
                if (fireworkAnimId) cancelAnimationFrame(fireworkAnimId);
                const fadeOut = () => {
                    if (fireworkParticles.length === 0) {
                        fireworkCanvas.style.display = 'none';
                        ctx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
                        return;
                    }
                    fireworkParticles.forEach(p => p.life -= 0.03);
                    fireworkParticles = fireworkParticles.filter(p => p.life > 0);
                    drawFireworks();
                    requestAnimationFrame(() => {
                        if (fireworkParticles.length > 0) fadeOut();
                        else {
                            fireworkCanvas.style.display = 'none';
                            ctx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
                        }
                    });
                };
                fadeOut();
            }

            function animateFireworks() {
                if (!fireworkRunning && fireworkParticles.length === 0) {
                    fireworkCanvas.style.display = 'none';
                    return;
                }
                fireworkParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.life -= p.decay;
                });
                fireworkParticles = fireworkParticles.filter(p => p.life > 0);
                drawFireworks();
                if (fireworkRunning || fireworkParticles.length > 0) {
                    fireworkAnimId = requestAnimationFrame(animateFireworks);
                } else {
                    fireworkCanvas.style.display = 'none';
                    ctx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
                }
            }

            function drawFireworks() {
                ctx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
                fireworkParticles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }

            function showCongrats() {
                congratsOverlay.classList.add('show');
                startFireworks();
                if (congratsTimeout) clearTimeout(congratsTimeout);
                congratsTimeout = setTimeout(() => congratsOverlay.classList.remove('show'), 3500);
            }

            // 提示逻辑
            function showHintTemporarily(gameId) {
                const panel = swiperViewport.querySelector(`[data-game-id="${gameId}"]`);
                if (!panel) return;
                const hint = panel.querySelector('.game-hint');
                if (!hint) return;
                hint.classList.remove('hidden-hint');
                if (hintTimers[gameId]) clearTimeout(hintTimers[gameId]);
                hintTimers[gameId] = setTimeout(() => hint.classList.add('hidden-hint'), 3000);
            }

            // 构建面板
            function buildGamePanels() {
                swiperViewport.innerHTML = '';
                for (let i = 0; i < TOTAL_GAMES; i++) {
                    const panel = document.createElement('div');
                    panel.className = 'game-panel';
                    panel.setAttribute('data-game-id', GAME_IDS[i]);
                    panel.setAttribute('data-index', i);
                    panel.innerHTML = `
                        <iframe src="${GAME_FILES[i]}" allow="autoplay" scrolling="no" 
                                style="width:100%;height:100%;border:none;"
                                title="${GAME_NAMES[i]}"></iframe>
                        <div class="game-hint hidden-hint">${getHint(GAME_IDS[i])}</div>
                    `;
                    swiperViewport.appendChild(panel);
                }
            }

            function getHint(gameId) {
                const hints = {
                    'game1': '📱滑动屏幕 | 🖱️键盘方向键移动数字',
                    'game2': '📱滑动方向 | 🖱️方向键控制蛇的移动',
                    'game3': '📱左右滑动 | 🖱️鼠标/方向键移动挡板',
                    'game4': '📱点击翻牌 | 🖱️鼠标点击翻开卡片',
                    'game5': '📱快速点击目标 | 🖱️鼠标点击出现的圆点',
                    'game6': '📱左右倾斜/滑动 | 🖱️方向键躲避障碍',
                    'game7': '📱点击正确颜色 | 🖱️鼠标点击匹配的颜色块',
                };
                return hints[gameId] || '📱滑动或点击 | 🖱️鼠标键盘操作';
            }

            function navigateTo(index) {
                if (index < 0) index = TOTAL_GAMES - 1;
                if (index >= TOTAL_GAMES) index = 0;
                const panel = swiperViewport.children[index];
                if (panel) {
                    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    currentPanelIndex = index;
                }
            }

            // 滑动监听
            let scrollTimeout;
            swiperViewport.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const panels = swiperViewport.querySelectorAll('.game-panel');
                    let closest = 0;
                    let minDist = Infinity;
                    const viewTop = swiperViewport.scrollTop;
                    panels.forEach((p, i) => {
                        const dist = Math.abs(p.offsetTop - viewTop);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = i;
                        }
                    });
                    if (closest !== currentPanelIndex) {
                        currentPanelIndex = closest;
                        showHintTemporarily(GAME_IDS[currentPanelIndex]);
                    }
                }, 250);
            });

            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                    e.preventDefault();
                    navigateTo(currentPanelIndex + 1);
                } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                    e.preventDefault();
                    navigateTo(currentPanelIndex - 1);
                }
            });

            // 游戏通关消息
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'gameComplete') {
                    showCongrats();
                    playFireworkSound();
                }
            });

            window.addEventListener('resize', resizeFireworkCanvas);

            function init() {
                resizeFireworkCanvas();
                buildGamePanels();
                swiperViewport.scrollTop = 0;
                currentPanelIndex = 0;
                setTimeout(() => showHintTemporarily(GAME_IDS[0]), 300);
            }

            init();
        })();
    </script>
</body>
</html>
