<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>游戏流</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #faf8ef; font-family: system-ui, sans-serif; }
    .container {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .slide {
      scroll-snap-align: start;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    .slide iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
      padding: 8px 16px; display: flex; align-items: center; justify-content: space-between;
      color: #776e65; font-size: 14px; border-top: 1px solid #ddd;
    }
    .user-name { font-weight: bold; color: #8f7a66; margin-right: 12px; max-width: 35%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stats { display: flex; gap: 12px; }
    .stat-item { cursor: pointer; background: #ede0c8; border-radius: 20px; padding: 4px 12px; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #776e65; }
    .stat-num { font-weight: 700; color: #8f7a66; }
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; display: none; justify-content: center; align-items: flex-end; }
    .popup-overlay.active { display: flex; }
    .popup-panel { background: #fff; border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-width: 500px; max-height: 60vh; overflow-y: auto; color: #776e65; }
    .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .popup-header h3 { font-size: 20px; }
    .close-btn { font-size: 24px; cursor: pointer; color: #c0392b; }
    .game-entry { display: flex; justify-content: space-between; align-items: center; background: #faf8ef; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid #ddd; }
    .game-entry .name { font-size: 16px; }
    .game-entry .actions { display: flex; gap: 8px; }
    .game-entry button { background: #eee4da; color: #776e65; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
    .game-entry button.del { background: #f2b179; color: #fff; }
    .game-entry button.add { background: #7caf7a; color: #fff; }
    .empty { color: #aaa; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="container" id="container"></div>
  <div class="bottom-bar" id="bottomBar">
    <span class="user-name" id="usernameDisplay">🎮 旅行者</span>
    <div class="stats">
      <div class="stat-item" id="statPlayed">🎮 <span class="stat-num" id="playedCount">0</span></div>
      <div class="stat-item" id="statFav">⭐ <span class="stat-num" id="favCount">0</span></div>
      <div class="stat-item" id="statLike">❤️ <span class="stat-num" id="likeTotalCount">0</span></div>
    </div>
  </div>
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-panel">
      <div class="popup-header">
        <h3 id="popupTitle">已玩游戏</h3>
        <span class="close-btn" id="closePopup">✕</span>
      </div>
      <div id="popupContent"></div>
    </div>
  </div>
  <script>
    const games = [
      { id: 'snake',    title: '贪吃蛇',     src: 'game1.html' },
      { id: 'breakout', title: '打砖块',     src: 'game2.html' },
      { id: 'flappy',   title: 'Flappy Bird',src: 'game3.html' },
      { id: '2048',     title: '2048',       src: 'game4.html' },
      { id: 'memory',   title: '记忆翻牌',   src: 'game5.html' },
      { id: 'tictactoe',title: '井字棋',     src: 'game6.html' },
      { id: 'guess',    title: '猜数字',     src: 'game7.html' }
    ];
    const STORAGE_USER='username', STORAGE_PLAYED_PREFIX='played_', STORAGE_FAV='favs', STORAGE_LIKE_PREFIX='like_';
    function randomUsername() { const adj = ['快乐','勇敢','闪亮','神秘','悠闲','酷酷','萌萌','飞翔','超级','小小']; const noun = ['玩家','小猫','狐狸','熊猫','海豚','星星','月亮','闪电','泡泡','糖果']; return adj[Math.floor(Math.random()*adj.length)]+noun[Math.floor(Math.random()*noun.length)]; }
    function getUsername() { let name=localStorage.getItem(STORAGE_USER); if(!name){ name=randomUsername(); localStorage.setItem(STORAGE_USER,name); } return name; }
    function getPlayedList() { const list=[]; for(let i=0;i<localStorage.length;i++){ const key=localStorage.key(i); if(key.startsWith(STORAGE_PLAYED_PREFIX)&&localStorage.getItem(key)==='true') list.push(key.replace(STORAGE_PLAYED_PREFIX,'')); } return list; }
    function addPlayed(id) { localStorage.setItem(STORAGE_PLAYED_PREFIX+id,'true'); }
    function removePlayed(id) { localStorage.removeItem(STORAGE_PLAYED_PREFIX+id); }
    function getFavs() { try { return JSON.parse(localStorage.getItem(STORAGE_FAV))||[]; } catch(e) { return []; } }
    function saveFavs(arr) { localStorage.setItem(STORAGE_FAV,JSON.stringify(arr)); }
    function getLikeCount(id) { const val=localStorage.getItem(STORAGE_LIKE_PREFIX+id); return val?parseInt(val,10):0; }
    function setLikeCount(id,count) { if(count<0) count=0; if(count>999) count=999; localStorage.setItem(STORAGE_LIKE_PREFIX+id,count); }
    function addLike(id) { let count=getLikeCount(id); if(count>=999) return false; setLikeCount(id,count+1); return true; }
    function removeOneLike(id) { let count=getLikeCount(id); if(count<=0) return; setLikeCount(id,count-1); }
    function clearLikes(id) { localStorage.removeItem(STORAGE_LIKE_PREFIX+id); }

    function updateUI() {
      document.getElementById('usernameDisplay').textContent = getUsername();
      const played = getPlayedList();
      const favs = getFavs();
      let totalLikes = 0;
      games.forEach(g => totalLikes += getLikeCount(g.id));
      document.getElementById('playedCount').textContent = played.length;
      document.getElementById('favCount').textContent = favs.length;
      document.getElementById('likeTotalCount').textContent = totalLikes;
    }

    const container = document.getElementById('container');
    games.forEach(g => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.gameId = g.id;
      slide.innerHTML = `<iframe src="${g.src}" scrolling="no"></iframe>`;
      container.appendChild(slide);
    });

    container.addEventListener('scroll', () => {
      if (container.scrollTop + container.clientHeight >= container.scrollHeight - 5) {
        container.scrollTo({ top: 0, behavior: 'instant' });
      }
    });

    window.addEventListener('message', (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === 'played' && e.data.gameId) {
        addPlayed(e.data.gameId);
        updateUI();
      } else if (e.data.type === 'nav' && e.data.direction) {
        const slides = document.querySelectorAll('.slide');
        const currentIndex = Array.from(slides).findIndex(s => s.dataset.visible === 'true');
        let targetIndex = currentIndex;
        if (e.data.direction === 'up') targetIndex = (currentIndex - 1 + slides.length) % slides.length;
        else if (e.data.direction === 'down') targetIndex = (currentIndex + 1) % slides.length;
        if (targetIndex >= 0 && targetIndex < slides.length) {
          slides[targetIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { entry.target.dataset.visible = entry.isIntersecting ? 'true' : 'false'; if (entry.isIntersecting) updateUI(); });
    }, { threshold: 0.6 });
    document.querySelectorAll('.slide').forEach(s => observer.observe(s));

    const overlay = document.getElementById('popupOverlay'), popupTitle = document.getElementById('popupTitle'), popupContent = document.getElementById('popupContent');
    function showPopup(type) {
      overlay.classList.add('active');
      if (type === 'played') { popupTitle.textContent = '已玩游戏'; renderPlayedList(); }
      else if (type === 'fav') { popupTitle.textContent = '已收藏游戏'; renderFavList(); }
      else if (type === 'like') { popupTitle.textContent = '已点赞游戏'; renderLikeList(); }
    }
    function renderPlayedList() { const list = getPlayedList(); if (list.length === 0) { popupContent.innerHTML = '<div class="empty">还没有玩过任何游戏</div>'; return; } let html = ''; list.forEach(id => { const game = games.find(g => g.id === id); html += `<div class="game-entry"><span class="name">${game ? game.title : id}</span><div class="actions"><button class="del" onclick="removePlayed('${id}');updateUI();renderPlayedList();">删除记录</button></div></div>`; }); popupContent.innerHTML = html; }
    function renderFavList() { const favs = getFavs(); if (favs.length === 0) { popupContent.innerHTML = '<div class="empty">还没有收藏任何游戏</div>'; return; } let html = ''; favs.forEach(id => { const game = games.find(g => g.id === id); html += `<div class="game-entry"><span class="name">${game ? game.title : id}</span><div class="actions"><button class="del" onclick="toggleCollect('${id}');updateUI();renderFavList();">取消收藏</button></div></div>`; }); popupContent.innerHTML = html; }
    function toggleCollect(id) { let favs = getFavs(); const idx = favs.indexOf(id); if (idx > -1) favs.splice(idx, 1); else favs.push(id); saveFavs(favs); }
    function renderLikeList() { let hasLike = false; let html = ''; games.forEach(g => { const count = getLikeCount(g.id); if (count > 0) { hasLike = true; html += `<div class="game-entry"><span class="name">${g.title} ❤️ ${count}</span><div class="actions"><button class="add" onclick="addLike('${g.id}');updateUI();renderLikeList();">+1</button><button class="del" onclick="removeOneLike('${g.id}');updateUI();renderLikeList();">-1</button><button class="del" onclick="clearLikes('${g.id}');updateUI();renderLikeList();">清空</button></div></div>`; } }); if (!hasLike) html = '<div class="empty">还没有点赞任何游戏</div>'; popupContent.innerHTML = html; }
    document.getElementById('closePopup').addEventListener('click', () => overlay.classList.remove('active'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });
    document.getElementById('statPlayed').addEventListener('click', () => showPopup('played'));
    document.getElementById('statFav').addEventListener('click', () => showPopup('fav'));
    document.getElementById('statLike').addEventListener('click', () => showPopup('like'));
    updateUI();
  </script>
</body>
</html>
