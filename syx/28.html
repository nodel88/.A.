<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>抖音模式刷H5小游戏</title>
    <style>
        /* CSS样式内嵌区域 */
        :root {
            --primary-text: #fff;
            --secondary-text: rgba(255, 255, 255, 0.7);
            --theme-color: #fe2c55;
            --dark-bg: #121212;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--primary-text);
        }
        /* ... Swiper.js 的 CSS 代码 ... */
        /* ... 应用的自定义CSS, 包括顶部栏、侧边栏、按钮、弹窗、烟花特效等样式 ... */
        /* 示例: */
        .swiper-container { width: 100%; height: 100vh; }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #000;
            position: relative;
        }
        .game-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .action-bar {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        .action-button { /* ... 点赞、收藏按钮样式 ... */ }
        .win-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; /* 默认隐藏 */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        #fireworks-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .congrats-text {
            font-size: 3rem; font-weight: bold;
            color: #fff; text-shadow: 0 0 10px #ff0, 0 0 20px #ff0;
            animation: flicker 1.5s infinite alternate;
        }
        @keyframes flicker {
            /* ... 闪烁动画定义 ... */
        }
    </style>
</head>

    <!-- 页面HTML结构 -->
    <div id="app">
        <!-- 顶部信息栏 -->
        <header class="top-bar">
             <div id="username-display"></div>
             <nav>
                 <button id="show-played">已玩: <span id="played-count">0</span></button>
                 <button id="show-favorites">收藏: <span id="favorites-count">0</span></button>
                 <button id="show-likes">点赞: <span id="likes-count">0</span></button>
             </nav>
        </header>

        <!-- Swiper 滑动容器 -->
        <div class="swiper-container">
            <div class="swiper-wrapper">
                <!-- 游戏1: 贪吃蛇 -->
                <div class="swiper-slide" data-game-id="snake" data-game-title="贪吃蛇">
                    <canvas id="snake-canvas" class="game-canvas"></canvas>
                    <div class="game-info">玩法：电脑用方向键，手机滑动屏幕控制方向</div>
                </div>
                <!-- 游戏2: 俄罗斯方块 -->
                <div class="swiper-slide" data-game-id="tetris" data-game-title="俄罗斯方块">
                     <canvas id="tetris-canvas" class="game-canvas"></canvas>
                     <div class="game-info">玩法：电脑方向键移动/旋转，手机点击屏幕两侧和下方</div>
                </div>
                <!-- ... 其他5个游戏slide ... -->
            </div>
        </div>

        <!-- 侧边操作栏 (动态生成或单个模板) -->
        <div class="action-bar" id="main-action-bar">
            <button class="action-button" id="like-btn">
                <svg>...</svg> <span id="like-count">0</span>
            </button>
            <button class="action-button" id="favorite-btn">
                <svg>...</svg> <span id="favorite-count">0</span>
            </button>
        </div>

        <!-- 通关祝贺特效 -->
        <div class="win-overlay" id="win-animation-overlay">
            <canvas id="fireworks-canvas"></canvas>
            <h1 class="congrats-text">恭喜通关！</h1>
        </div>

        <!-- 游戏列表弹窗 -->
        <div class="modal" id="list-modal">...</div>
    </div>
