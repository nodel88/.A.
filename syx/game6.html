<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>井字棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf8ef;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui}
.info{text-align:center;margin-bottom:8px}
.title{font-size:32px;font-weight:900;color:#776e65}
.desc{font-size:13px;color:#a39480}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#bbada0;padding:8px;border-radius:12px;width:90vmin;height:90vmin;max-width:400px;max-height:400px}
.cell{aspect-ratio:1;background:#cdc1b4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:8vmin;font-weight:800;color:#776e65;cursor:pointer;transition:0.1s}
.cell:hover{background:#eee4da}
#msg{font-size:5vmin;margin-top:12px;font-weight:600;color:#776e65}
.controls{margin-top:8px;display:flex;gap:12px;align-items:center}
.controls button{background:#8f7a66;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
.social-actions{display:flex;gap:16px;margin-left:12px}
.social-btn{width:44px;height:44px;border-radius:50%;background:#8f7a66;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff;position:relative;transition:0.2s}
.social-btn.liked{background:#f65e3b}
.social-btn.collected{background:#e6a817}
.social-btn .count{position:absolute;bottom:-8px;font-size:10px;font-weight:700;background:#776e65;color:#fff;padding:2px 6px;border-radius:10px}
.nav-btns{display:flex;gap:4px}
.nav-btns button{width:36px;height:36px;border-radius:50%;background:#8f7a66;color:#fff;border:none;font-size:18px;cursor:pointer}
.victory-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;background:rgba(0,0,0,0.2)}
.victory-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8vmin;font-weight:900;color:#fff;text-shadow:0 0 20px #ffd700;animation:blink 0.5s infinite alternate}
@keyframes blink{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0.8;transform:translate(-50%,-50%) scale(1.05)}}
</style>
</head>
<body>
<div class="info">
  <div class="title">⭕❌ 井字棋</div>
  <div class="desc">手机点击格子 / 电脑鼠标点击轮流下棋</div>
</div>
<div class="board" id="board"></div>
<p id="msg"></p>
<div class="controls">
  <button id="muteBtn">🔊 静音</button>
  <button id="restartBtn">↺ 重新开始</button>
  <div class="social-actions">
    <div class="nav-btns">
      <button class="nav-up">▲</button>
      <button class="nav-down">▼</button>
    </div>
    <div class="social-btn like-btn" id="likeBtn">❤️<span class="count" id="likeCount">0</span></div>
    <div class="social-btn collect-btn" id="collectBtn">⭐</div>
  </div>
</div>
<script>
const GAME_ID='tictactoe';
let audioCtx=null, musicInterval=null, isMuted=false;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx||isMuted) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='place'){ osc.frequency.setValueAtTime(400,audioCtx.currentTime); gain.gain.setValueAtTime(0.08,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='win'){ osc.type='triangle'; osc.frequency.setValueAtTime(523,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(784,audioCtx.currentTime+0.5); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5); osc.start(); osc.stop(audioCtx.currentTime+0.5); }
  else if(type==='draw'){ osc.frequency.setValueAtTime(200,audioCtx.currentTime); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); osc.start(); osc.stop(audioCtx.currentTime+0.4); }
}
function startMusic(){
  if(musicInterval||isMuted) return;
  const notes=[262,294,330,349,330,294,262,247];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx||isMuted) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.03,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
    i++;
  },500);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function playFireworkSound(){
  if(!audioCtx||isMuted) return;
  const bufferSize = audioCtx.sampleRate * 0.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i/(audioCtx.sampleRate*0.1));
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  source.connect(gain); gain.connect(audioCtx.destination);
  source.start(); source.stop(audioCtx.currentTime + 0.5);
}
function toggleMute(){
  isMuted = !isMuted;
  document.getElementById('muteBtn').textContent = isMuted ? '🔇 已静音' : '🔊 静音';
  if (isMuted) { stopMusic(); } else { startMusic(); }
}
document.getElementById('muteBtn').addEventListener('click', toggleMute);
document.querySelector('.nav-up').addEventListener('click', ()=> window.parent.postMessage({type:'nav',direction:'up'},'*'));
document.querySelector('.nav-down').addEventListener('click', ()=> window.parent.postMessage({type:'nav',direction:'down'},'*'));

function updateSocial(){
  const likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  document.getElementById('likeCount').textContent=likes;
  document.getElementById('likeBtn').classList.toggle('liked',likes>0);
  const favs=JSON.parse(localStorage.getItem('favs')||'[]');
  document.getElementById('collectBtn').classList.toggle('collected',favs.includes(GAME_ID));
}
document.getElementById('likeBtn').addEventListener('click',()=>{
  let likes=parseInt(localStorage.getItem('like_'+GAME_ID)||'0');
  if(likes>=999) return alert('点赞已达上限 999 ❤️');
  likes++; localStorage.setItem('like_'+GAME_ID,likes); updateSocial();
  if(navigator.vibrate) navigator.vibrate(10);
});
document.getElementById('collectBtn').addEventListener('click',()=>{
  let favs=JSON.parse(localStorage.getItem('favs')||'[]');
  const idx=favs.indexOf(GAME_ID);
  if(idx>-1) favs.splice(idx,1); else favs.push(GAME_ID);
  localStorage.setItem('favs',JSON.stringify(favs)); updateSocial();
});
updateSocial();
function notifyPlayed(){ if(window.parent) window.parent.postMessage({type:'played',gameId:GAME_ID},'*'); }

let board, turn, gameover;
function init(){
  board=Array(9).fill(null); turn='X'; gameover=false;
  document.getElementById('msg').textContent='';
  stopMusic(); startMusic(); const ov=document.querySelector('.victory-overlay'); if(ov) ov.remove(); notifyPlayed();
  draw();
}
function draw(){ const b=document.getElementById('board'); b.innerHTML=''; board.forEach((v,i)=>{ const d=document.createElement('div'); d.className='cell'; d.textContent=v||''; d.onclick=()=>move(i); b.appendChild(d); }); }
function move(i){
  initAudio();
  if(gameover||board[i]) return;
  playSound('place'); board[i]=turn;
  if(checkWin(turn)){ document.getElementById('msg').textContent=turn+' 赢了！'; gameover=true; draw(); stopMusic(); playSound('win'); showVictory(); setTimeout(init,3000); return; }
  if(board.every(v=>v)){ document.getElementById('msg').textContent='平局'; gameover=true; draw(); stopMusic(); playSound('draw'); return; }
  turn=turn==='X'?'O':'X'; draw();
}
function checkWin(p){ const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return wins.some(w=>w.every(i=>board[i]===p)); }
function showVictory(){
  const ov=document.createElement('div'); ov.className='victory-overlay';
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    ov.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.className='victory-text'; txt.textContent='🎉 恭喜成功！';
  ov.appendChild(txt);
  document.body.appendChild(ov);
  playFireworkSound();
  setTimeout(()=>ov.remove(),3000);
}
document.getElementById('restartBtn').onclick=init;
init();
</script>
</body>
</html>
