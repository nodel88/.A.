<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>刷游戏 - 像刷抖音一样玩小游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: pan-y;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #faf8ef;
        }
        
        .game-container {
            height: calc(100vh - 70px);
            overflow: hidden;
            position: relative;
        }
        
        .game-slide {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.3s ease-out;
        }
        
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
        }
        
        .game-title {
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 10px;
        }
        
        .game-instructions {
            font-size: 14px;
            color: #8f7a66;
            margin-bottom: 15px;
            text-align: center;
            padding: 0 20px;
        }
        
        .game-board {
            background: #bbada0;
            border-radius: 6px;
            padding: 10px;
            position: relative;
        }
        
        .bottom-nav {
            height: 70px;
            background: #faf8ef;
            border-top: 2px solid #bbada0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #776e65;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .nav-item:hover {
            color: #f65e3b;
        }
        
        .nav-item.active {
            color: #f65e3b;
        }
        
        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .nav-count {
            font-weight: bold;
            font-size: 11px;
        }
        
        .game-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
        }
        
        .control-btn {
            background: #8f7a66;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .control-btn:hover {
            background: #776e65;
        }
        
        .like-collect {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #8f7a66;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            color: #f65e3b;
        }
        
        .action-btn.active {
            color: #f65e3b;
        }
        
        .action-icon {
            font-size: 28px;
        }
        
        .action-count {
            font-size: 12px;
            font-weight: bold;
        }
        
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .nav-arrow {
            background: #8f7a66;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .nav-arrow:hover {
            background: #776e65;
        }
        
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        
        .congrats-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #f65e3b;
            text-shadow: 0 0 10px #fff, 0 0 20px #f65e3b, 0 0 30px #f65e3b;
            z-index: 1001;
            display: none;
            animation: blink 0.5s infinite alternate;
        }
        
        @keyframes blink {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #faf8ef;
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .modal-close {
            background: #f65e3b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #eee4da;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        
        .list-item-name {
            font-weight: bold;
            color: #776e65;
        }
        
        .list-item-btn {
            background: #f65e3b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* 2048游戏样式 */
        .grid-2048 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .cell-2048 {
            width: 60px;
            height: 60px;
            background: #cdc1b4;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
        }
        
        .cell-2048[data-value="2"] { background: #eee4da; }
        .cell-2048[data-value="4"] { background: #ede0c8; }
        .cell-2048[data-value="8"] { background: #f2b179; color: white; }
        .cell-2048[data-value="16"] { background: #f59563; color: white; }
        .cell-2048[data-value="32"] { background: #f67c5f; color: white; }
        .cell-2048[data-value="64"] { background: #f65e3b; color: white; }
        .cell-2048[data-value="128"] { background: #edcf72; color: white; font-size: 20px; }
        .cell-2048[data-value="256"] { background: #edcc61; color: white; font-size: 20px; }
        .cell-2048[data-value="512"] { background: #edc850; color: white; font-size: 20px; }
        .cell-2048[data-value="1024"] { background: #edc53f; color: white; font-size: 16px; }
        .cell-2048[data-value="2048"] { background: #edc22e; color: white; font-size: 16px; }
        
        /* 贪吃蛇游戏样式 */
        .snake-canvas {
            background: #eee4da;
            border-radius: 4px;
        }
        
        /* 井字棋游戏样式 */
        .grid-tic {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .cell-tic {
            width: 70px;
            height: 70px;
            background: #eee4da;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .cell-tic:hover {
            background: #ddd0c0;
        }
        
        .cell-tic.x {
            color: #f65e3b;
        }
        
        .cell-tic.o {
            color: #776e65;
        }
        
        /* 打砖块游戏样式 */
        .breakout-canvas {
            background: #eee4da;
            border-radius: 4px;
        }
        
        /* 记忆翻牌游戏样式 */
        .grid-memory {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        .card-memory {
            width: 55px;
            height: 55px;
            background: #8f7a66;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            transform: rotateY(180deg);
        }
        
        .card-memory.flipped {
            background: #eee4da;
            transform: rotateY(0);
        }
        
        .card-memory.matched {
            background: #77dd77;
            transform: rotateY(0);
        }
        
        /* 俄罗斯方块游戏样式 */
        .tetris-canvas {
            background: #eee4da;
            border-radius: 4px;
        }
        
        /* 消消乐游戏样式 */
        .grid-match {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }
        
        .cell-match {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cell-match.selected {
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        
        .cell-match[data-color="0"] { background: #f65e3b; }
        .cell-match[data-color="1"] { background: #776e65; }
        .cell-match[data-color="2"] { background: #edc22e; }
        .cell-match[data-color="3"] { background: #77dd77; }
        .cell-match[data-color="4"] { background: #66ccff; }
        .cell-match[data-color="5"] { background: #ff99cc; }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer"></div>
    
    <div class="bottom-nav">
        <div class="nav-item" id="userName">
            <div class="nav-icon">👤</div>
            <div>玩家</div>
        </div>
        <div class="nav-item" id="playedBtn">
            <div class="nav-icon">🎮</div>
            <div>已玩</div>
            <div class="nav-count" id="playedCount">0</div>
        </div>
        <div class="nav-item" id="collectedBtn">
            <div class="nav-icon">⭐</div>
            <div>收藏</div>
            <div class="nav-count" id="collectedCount">0</div>
        </div>
        <div class="nav-item" id="likedBtn">
            <div class="nav-icon">👍</div>
            <div>点赞</div>
            <div class="nav-count" id="likedCount">0</div>
        </div>
        <div class="nav-item" id="muteBtn">
            <div class="nav-icon" id="muteIcon">🔊</div>
            <div>静音</div>
        </div>
    </div>
    
    <canvas id="fireworks"></canvas>
    <div class="congrats-text" id="congratsText">恭喜成功！</div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalList"></div>
            <button class="modal-close" id="modalClose">关闭</button>
        </div>
    </div>

    <script>
        // 游戏数据
        const games = [
            {
                id: 1,
                name: "2048",
                instructions: "电脑：方向键移动；手机：滑动屏幕移动，合并相同数字到2048",
                init: init2048,
                restart: restart2048
            },
            {
                id: 2,
                name: "贪吃蛇",
                instructions: "电脑：方向键控制；手机：滑动屏幕控制，吃食物长大不要撞墙",
                init: initSnake,
                restart: restartSnake
            },
            {
                id: 3,
                name: "井字棋",
                instructions: "电脑/手机：点击格子下棋，连成三个相同符号获胜",
                init: initTicTacToe,
                restart: restartTicTacToe
            },
            {
                id: 4,
                name: "打砖块",
                instructions: "电脑：左右方向键移动；手机：点击屏幕左右移动，打掉所有砖块",
                init: initBreakout,
                restart: restartBreakout
            },
            {
                id: 5,
                name: "记忆翻牌",
                instructions: "电脑/手机：点击卡片翻转，找出所有配对的卡片",
                init: initMemory,
                restart: restartMemory
            },
            {
                id: 6,
                name: "俄罗斯方块",
                instructions: "电脑：方向键控制；手机：左右滑动移动，点击旋转，下滑加速",
                init: initTetris,
                restart: restartTetris
            },
            {
                id: 7,
                name: "消消乐",
                instructions: "电脑/手机：点击两个相邻方块交换，三个相同即可消除",
                init: initMatch,
                restart: restartMatch
            }
        ];
        
        // 音效生成器
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let isMuted = false;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }
        
        function playSound(type) {
            if (isMuted || !audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            switch(type) {
                case 'move':
                    oscillator.frequency.value = 300;
                    gainNode.gain.value = 0.1;
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'collect':
                    oscillator.frequency.value = 523;
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    setTimeout(() => oscillator.frequency.value = 659, 100);
                    setTimeout(() => oscillator.frequency.value = 784, 200);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'like':
                    oscillator.frequency.value = 440;
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'win':
                    oscillator.frequency.value = 523;
                    gainNode.gain.value = 0.3;
                    oscillator.start();
                    setTimeout(() => oscillator.frequency.value = 659, 150);
                    setTimeout(() => oscillator.frequency.value = 784, 300);
                    setTimeout(() => oscillator.frequency.value = 1047, 450);
                    oscillator.stop(audioCtx.currentTime + 0.6);
                    break;
                case 'gameover':
                    oscillator.frequency.value = 200;
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    setTimeout(() => oscillator.frequency.value = 150, 200);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    break;
            }
        }
        
        // 本地存储管理
        let userData = {
            userName: '',
            played: [],
            collected: [],
            liked: [],
            likesCount: {}
        };
        
        function loadUserData() {
            const saved = localStorage.getItem('gameUserData');
            if (saved) {
                userData = JSON.parse(saved);
            } else {
                // 生成随机用户名
                const adjectives = ['快乐', '聪明', '勇敢', '可爱', '帅气', '美丽', '机智', '幸运'];
                const nouns = ['玩家', '达人', '高手', '大神', '萌新', '小能手', '挑战者', '冒险家'];
                userData.userName = adjectives[Math.floor(Math.random() * adjectives.length)] + 
                                   nouns[Math.floor(Math.random() * nouns.length)] + 
                                   Math.floor(Math.random() * 100);
                saveUserData();
            }
            updateUI();
        }
        
        function saveUserData() {
            localStorage.setItem('gameUserData', JSON.stringify(userData));
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('userName').querySelector('div:last-child').textContent = userData.userName;
            document.getElementById('playedCount').textContent = userData.played.length;
            document.getElementById('collectedCount').textContent = userData.collected.length;
            document.getElementById('likedCount').textContent = userData.liked.length;
            
            // 更新当前游戏的按钮状态
            updateGameButtons(currentGameIndex);
        }
        
        function updateGameButtons(index) {
            const game = games[index];
            const collectBtn = document.getElementById(`collect-${game.id}`);
            const likeBtn = document.getElementById(`like-${game.id}`);
            const collectCount = document.getElementById(`collect-count-${game.id}`);
            const likeCount = document.getElementById(`like-count-${game.id}`);
            
            if (collectBtn) {
                collectBtn.classList.toggle('active', userData.collected.includes(game.id));
            }
            if (likeBtn) {
                likeBtn.classList.toggle('active', userData.liked.includes(game.id));
            }
            if (collectCount) {
                collectCount.textContent = userData.collected.filter(id => id === game.id).length;
            }
            if (likeCount) {
                const count = userData.likesCount[game.id] || 0;
                likeCount.textContent = Math.min(count, 999);
            }
        }
        
        function toggleCollect(gameId) {
            initAudio();
            const index = userData.collected.indexOf(gameId);
            if (index > -1) {
                userData.collected.splice(index, 1);
            } else {
                userData.collected.push(gameId);
                playSound('collect');
            }
            saveUserData();
        }
        
        function toggleLike(gameId) {
            initAudio();
            const index = userData.liked.indexOf(gameId);
            if (index > -1) {
                userData.liked.splice(index, 1);
                if (userData.likesCount[gameId]) {
                    userData.likesCount[gameId]--;
                }
            } else {
                userData.liked.push(gameId);
                userData.likesCount[gameId] = (userData.likesCount[gameId] || 0) + 1;
                playSound('like');
            }
            saveUserData();
        }
        
        function addPlayed(gameId) {
            if (!userData.played.includes(gameId)) {
                userData.played.push(gameId);
                saveUserData();
            }
        }
        
        // 烟花效果
        function showFireworks() {
            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.display = 'block';
            
            const congrats = document.getElementById('congratsText');
            congrats.style.display = 'block';
            
            playSound('win');
            
            const particles = [];
            const colors = ['#f65e3b', '#edc22e', '#77dd77', '#66ccff', '#ff99cc', '#ff6b6b'];
            
            function createFirework(x, y) {
                for (let i = 0; i < 50; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: Math.random() * 3 + 1
                    });
                }
            }
            
            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.alpha -= 0.01;
                    
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }
                    
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.globalAlpha = 1;
                
                if (particles.length > 0) {
                    requestAnimationFrame(animate);
                } else {
                    canvas.style.display = 'none';
                    congrats.style.display = 'none';
                }
            }
            
            // 发射多个烟花
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height * 0.6
                    );
                }, i * 300);
            }
            
            animate();
            
            // 3秒后隐藏
            setTimeout(() => {
                canvas.style.display = 'none';
                congrats.style.display = 'none';
            }, 3000);
        }
        
        // 滑动逻辑
        let currentGameIndex = 0;
        let startY = 0;
        let isDragging = false;
        
        function createGameSlides() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = '';
            
            games.forEach((game, index) => {
                const slide = document.createElement('div');
                slide.className = 'game-slide';
                slide.id = `slide-${game.id}`;
                slide.style.transform = `translateY(${index * 100}%)`;
                
                slide.innerHTML = `
                    <div class="game-area">
                        <div class="game-title">${game.name}</div>
                        <div class="game-instructions">${game.instructions}</div>
                        <div class="game-board" id="board-${game.id}"></div>
                        <div class="game-controls">
                            <button class="control-btn" onclick="games[${index}].restart()">重新开始</button>
                            <div class="nav-buttons">
                                <button class="nav-arrow" onclick="navigateGame(-1)">↑</button>
                                <button class="nav-arrow" onclick="navigateGame(1)">↓</button>
                            </div>
                            <div class="like-collect">
                                <div class="action-btn" id="collect-${game.id}" onclick="toggleCollect(${game.id})">
                                    <div class="action-icon">⭐</div>
                                    <div class="action-count" id="collect-count-${game.id}">0</div>
                                </div>
                                <div class="action-btn" id="like-${game.id}" onclick="toggleLike(${game.id})">
                                    <div class="action-icon">👍</div>
                                    <div class="action-count" id="like-count-${game.id}">0</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(slide);
            });
            
            // 初始化第一个游戏
            games[0].init();
            addPlayed(games[0].id);
            updateGameButtons(0);
        }
        
        function navigateGame(direction) {
            const newIndex = (currentGameIndex + direction + games.length) % games.length;
            slideToGame(newIndex);
        }
        
        function slideToGame(index) {
            if (index === currentGameIndex) return;
            
            currentGameIndex = index;
            
            games.forEach((game, i) => {
                const slide = document.getElementById(`slide-${game.id}`);
                slide.style.transform = `translateY(${(i - currentGameIndex) * 100}%)`;
            });
            
            // 初始化新游戏
            games[currentGameIndex].init();
            addPlayed(games[currentGameIndex].id);
            updateGameButtons(currentGameIndex);
        }

        document.getElementById('gameContainer').addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            const endY = e.changedTouches[0].clientY;
            const diff = startY - endY;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    // 向上滑，下一个游戏
                    navigateGame(1);
                } else {
                    // 向下滑，上一个游戏
                    navigateGame(-1);
                }
            }
        });

        // ==================== 游戏实现 ====================
        
        // 1. 2048游戏
        let grid2048 = [];
        
        function init2048() {
            const board = document.getElementById('board-1');
            board.innerHTML = `
                <div class="grid-2048" id="grid2048">
                    ${Array(16).fill('<div class="cell-2048"></div>').join('')}
                </div>
            `;
            
            grid2048 = Array(4).fill().map(() => Array(4).fill(0));
            addRandomTile();
            addRandomTile();
            render2048();
            
            // 键盘控制
            document.removeEventListener('keydown', handle2048Keydown);
            document.addEventListener('keydown', handle2048Keydown);
            
            // 触摸控制
            let touchStartX, touchStartY;
            board.removeEventListener('touchstart', handle2048TouchStart);
            board.addEventListener('touchstart', handle2048TouchStart);
            
            function handle2048TouchStart(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                
                function handleTouchEnd(e) {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    const diffX = touchEndX - touchStartX;
                    const diffY = touchEndY - touchStartY;
                    
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 30) move2048('right');
                        else if (diffX < -30) move2048('left');
                    } else {
                        if (diffY > 30) move2048('down');
                        else if (diffY < -30) move2048('up');
                    }
                    
                    board.removeEventListener('touchend', handleTouchEnd);
                }
                
                board.addEventListener('touchend', handleTouchEnd);
            }
        }
        
        function handle2048Keydown(e) {
            if (currentGameIndex !== 0) return;
            
            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); move2048('up'); break;
                case 'ArrowDown': e.preventDefault(); move2048('down'); break;
                case 'ArrowLeft': e.preventDefault(); move2048('left'); break;
                case 'ArrowRight': e.preventDefault(); move2048('right'); break;
            }
        }
        
        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid2048[i][j] === 0) {
                        emptyCells.push({row: i, col: j});
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid2048[randomCell.row][randomCell.col] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function render2048() {
            const cells = document.querySelectorAll('.cell-2048');
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const value = grid2048[i][j];
                    const cell = cells[i * 4 + j];
                    cell.textContent = value || '';
                    cell.dataset.value = value;
                }
            }
        }
        
        function move2048(direction) {
            let moved = false;
            const oldGrid = JSON.parse(JSON.stringify(grid2048));
            
            if (direction === 'left') {
                for (let i = 0; i < 4; i++) {
                    let row = grid2048[i].filter(val => val !== 0);
                    for (let j = 0; j < row.length - 1; j++) {
                        if (row[j] === row[j + 1]) {
                            row[j] *= 2;
                            row.splice(j + 1, 1);
                        }
                    }
                    while (row.length < 4) row.push(0);
                    grid2048[i] = row;
                }
            } else if (direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    let row = grid2048[i].filter(val => val !== 0);
                    for (let j = row.length - 1; j > 0; j--) {
                        if (row[j] === row[j - 1]) {
                            row[j] *= 2;
                            row.splice(j - 1, 1);
                            j--;
                        }
                    }
                    while (row.length < 4) row.unshift(0);
                    grid2048[i] = row;
                }
            } else if (direction === 'up') {
                for (let j = 0; j < 4; j++) {
                    let col = [];
                    for (let i = 0; i < 4; i++) {
                        if (grid2048[i][j] !== 0) col.push(grid2048[i][j]);
                    }
                    for (let i = 0; i < col.length - 1; i++) {
                        if (col[i] === col[i + 1]) {
                            col[i] *= 2;
                            col.splice(i + 1, 1);
                        }
                    }
                    while (col.length < 4) col.push(0);
                    for (let i = 0; i < 4; i++) {
                        grid2048[i][j] = col[i];
                    }
                }
            } else if (direction === 'down') {
                for (let j = 0; j < 4; j++) {
                    let col = [];
                    for (let i = 0; i < 4; i++) {
                        if (grid2048[i][j] !== 0) col.push(grid2048[i][j]);
                    }
                    for (let i = col.length - 1; i > 0; i--) {
                        if (col[i] === col[i - 1]) {
                            col[i] *= 2;
                            col.splice(i - 1, 1);
                            i--;
                        }
                    }
                    while (col.length < 4) col.unshift(0);
                    for (let i = 0; i < 4; i++) {
                        grid2048[i][j] = col[i];
                    }
                }
            }
            
            // 检查是否移动
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (oldGrid[i][j] !== grid2048[i][j]) {
                        moved = true;
                        break;
                    }
                }
                if (moved) break;
            }
            
            if (moved) {
                playSound('move');
                addRandomTile();
                render2048();
                
                // 检查胜利
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (grid2048[i][j] === 2048) {
                            showFireworks();
                            return;
                        }
                    }
                }
            }
        }
        
        function restart2048() {
            init2048();
        }
        
        // 2. 贪吃蛇游戏
        let snake, snakeDirection, food, snakeGameInterval, snakeCanvas, snakeCtx;
        
        function initSnake() {
            const board = document.getElementById('board-2');
            board.innerHTML = `<canvas class="snake-canvas" id="snakeCanvas" width="240" height="240"></canvas>`;
            
            snakeCanvas = document.getElementById('snakeCanvas');
            snakeCtx = snakeCanvas.getContext('2d');
            
            snake = [{x: 10, y: 10}];
            snakeDirection = {x: 1, y: 0};
            generateFood();
            
            if (snakeGameInterval) clearInterval(snakeGameInterval);
            snakeGameInterval = setInterval(updateSnake, 150);
            
            // 键盘控制
            document.removeEventListener('keydown', handleSnakeKeydown);
            document.addEventListener('keydown', handleSnakeKeydown);
            
            // 触摸控制
            let touchStartX, touchStartY;
            board.removeEventListener('touchstart', handleSnakeTouchStart);
            board.addEventListener('touchstart', handleSnakeTouchStart);
            
            function handleSnakeTouchStart(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                
                function handleTouchEnd(e) {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    const diffX = touchEndX - touchStartX;
                    const diffY = touchEndY - touchStartY;
                    
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 30 && snakeDirection.x !== -1) snakeDirection = {x: 1, y: 0};
                        else if (diffX < -30 && snakeDirection.x !== 1) snakeDirection = {x: -1, y: 0};
                    } else {
                        if (diffY > 30 && snakeDirection.y !== -1) snakeDirection = {x: 0, y: 1};
                        else if (diffY < -30 && snakeDirection.y !== 1) snakeDirection = {x: 0, y: -1};
                    }
                    
                    board.removeEventListener('touchend', handleTouchEnd);
                }
                
                board.addEventListener('touchend', handleTouchEnd);
            }
        }
        
        function handleSnakeKeydown(e) {
            if (currentGameIndex !== 1) return;
            
            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); if (snakeDirection.y !== 1) snakeDirection = {x: 0, y: -1}; break;
                case 'ArrowDown': e.preventDefault(); if (snakeDirection.y !== -1) snakeDirection = {x: 0, y: 1}; break;
                case 'ArrowLeft': e.preventDefault(); if (snakeDirection.x !== 1) snakeDirection = {x: -1, y: 0}; break;
                case 'ArrowRight': e.preventDefault(); if (snakeDirection.x !== -1) snakeDirection = {x: 1, y: 0}; break;
            }
        }
        
        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * 20),
                    y: Math.floor(Math.random() * 20)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }
        
        function updateSnake() {
            const head = {x: snake[0].x + snakeDirection.x, y: snake[0].y + snakeDirection.y};
            
            // 撞墙检测
            if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                gameOverSnake();
                return;
            }
            
            // 撞自己检测
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOverSnake();
                return;
            }
            
            snake.unshift(head);
            
            // 吃食物
            if (head.x === food.x && head.y === food.y) {
                playSound('collect');
                generateFood();
                
                // 胜利条件：蛇长到20节
                if (snake.length >= 20) {
                    clearInterval(snakeGameInterval);
                    showFireworks();
                    return;
                }
            } else {
                snake.pop();
            }
            
            renderSnake();
        }
        
        function renderSnake() {
            snakeCtx.fillStyle = '#eee4da';
            snakeCtx.fillRect(0, 0, 240, 240);
            
            // 画蛇
            snakeCtx.fillStyle = '#776e65';
            snake.forEach((segment, index) => {
                if (index === 0) snakeCtx.fillStyle = '#f65e3b';
                snakeCtx.fillRect(segment.x * 12, segment.y * 12, 11, 11);
            });
            
            // 画食物
            snakeCtx.fillStyle = '#77dd77';
            snakeCtx.fillRect(food.x * 12, food.y * 12, 11, 11);
        }
        
        function gameOverSnake() {
            clearInterval(snakeGameInterval);
            playSound('gameover');
            snakeCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            snakeCtx.fillRect(0, 0, 240, 240);
            snakeCtx.fillStyle = 'white';
            snakeCtx.font = '24px Arial';
            snakeCtx.textAlign = 'center';
            snakeCtx.fillText('游戏结束', 120, 120);
            snakeCtx.font = '16px Arial';
            snakeCtx.fillText(`得分: ${snake.length - 1}`, 120, 150);
        }
        
        function restartSnake() {
            if (snakeGameInterval) clearInterval(snakeGameInterval);
            initSnake();
        }
        
        // 3. 井字棋游戏
        let ticBoard, currentPlayer, gameOverTic;
        
        function initTicTacToe() {
            const board = document.getElementById('board-3');
            board.innerHTML = `
                <div class="grid-tic" id="gridTic">
                    ${Array(9).fill('<div class="cell-tic"></div>').join('')}
                </div>
            `;
            
            ticBoard = Array(9).fill(null);
            currentPlayer = 'X';
            gameOverTic = false;
            
            const cells = document.querySelectorAll('.cell-tic');
            cells.forEach((cell, index) => {
                cell.addEventListener('click', () => handleTicClick(index));
            });
        }
        
        function handleTicClick(index) {
            if (ticBoard[index] || gameOverTic) return;
            
            ticBoard[index] = currentPlayer;
            const cell = document.querySelectorAll('.cell-tic')[index];
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());
            playSound('move');
            
            if (checkWinTic(currentPlayer)) {
                gameOverTic = true;
                setTimeout(() => showFireworks(), 300);
                return;
            }
            
            if (ticBoard.every(cell => cell !== null)) {
                gameOverTic = true;
                playSound('gameover');
                return;
            }
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            
            // 电脑回合
            if (currentPlayer === 'O' && !gameOverTic) {
                setTimeout(computerMove, 500);
            }
        }
        
        function computerMove() {
            if (gameOverTic) return;
            
            // 简单AI：随机选择空位置
            const emptyCells = ticBoard.map((cell, index) => cell === null ? index : null).filter(val => val !== null);
            if (emptyCells.length > 0) {
                const randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                handleTicClick(randomIndex);
            }
        }
        
        function checkWinTic(player) {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // 行
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // 列
                [0, 4, 8], [2, 4, 6] // 对角线
            ];
            
            return winPatterns.some(pattern => 
                pattern.every(index => ticBoard[index] === player)
            );
        }
        
        function restartTicTacToe() {
            initTicTacToe();
        }
        
        // 4. 打砖块游戏
        let breakoutCanvas, breakoutCtx, paddle, ball, bricks, breakoutGameInterval;
        
        function initBreakout() {
            const board = document.getElementById('board-4');
            board.innerHTML = `<canvas class="breakout-canvas" id="breakoutCanvas" width="280" height="320"></canvas>`;
            
            breakoutCanvas = document.getElementById('breakoutCanvas');
            breakoutCtx = breakoutCanvas.getContext('2d');
            
            paddle = {x: 110, y: 300, width: 60, height: 10, speed: 7};
            ball = {x: 140, y: 290, radius: 5, dx: 3, dy: -3};
            
            // 初始化砖块
            bricks = [];
            const brickRowCount = 5;
            const brickColumnCount = 7;
            const brickWidth = 35;
            const brickHeight = 15;
            const brickPadding = 3;
            const brickOffsetTop = 20;
            const brickOffsetLeft = 10;
            
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    bricks.push({
                        x: c * (brickWidth + brickPadding) + brickOffsetLeft,
                        y: r * (brickHeight + brickPadding) + brickOffsetTop,
                        width: brickWidth,
                        height: brickHeight,
                        alive: true
                    });
                }
            }
            
            if (breakoutGameInterval) clearInterval(breakoutGameInterval);
            breakoutGameInterval = setInterval(updateBreakout, 16);
            
            // 键盘控制
            document.removeEventListener('keydown', handleBreakoutKeydown);
            document.addEventListener('keydown', handleBreakoutKeydown);
            
            // 触摸控制
            breakoutCanvas.removeEventListener('touchstart', handleBreakoutTouch);
            breakoutCanvas.addEventListener('touchstart', handleBreakoutTouch);
        }
        
        function handleBreakoutKeydown(e) {
            if (currentGameIndex !== 3) return;
            
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                paddle.x = Math.max(0, paddle.x - paddle.speed);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                paddle.x = Math.min(280 - paddle.width, paddle.x + paddle.speed);
            }
        }
        
        function handleBreakoutTouch(e) {
            const touchX = e.touches[0].clientX - breakoutCanvas.getBoundingClientRect().left;
            paddle.x = Math.max(0, Math.min(280 - paddle.width, touchX - paddle.width / 2));
        }
        
        function updateBreakout() {
            // 移动球
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 墙壁碰撞
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > 280) {
                ball.dx = -ball.dx;
                playSound('move');
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
                playSound('move');
            }
            
            // 挡板碰撞
            if (ball.y + ball.radius > paddle.y && 
                ball.x > paddle.x && 
                ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
                playSound('move');
            }
            
            // 砖块碰撞
            let bricksAlive = 0;
            bricks.forEach(brick => {
                if (brick.alive) {
                    bricksAlive++;
                    if (ball.x > brick.x && 
                        ball.x < brick.x + brick.width && 
                        ball.y > brick.y && 
                        ball.y < brick.y + brick.height) {
                        ball.dy = -ball.dy;
                        brick.alive = false;
                        playSound('collect');
                        bricksAlive--;
                    }
                }
            });
            
            // 胜利检测
            if (bricksAlive === 0) {
                clearInterval(breakoutGameInterval);
                showFireworks();
                return;
            }
            
            // 游戏结束
            if (ball.y + ball.radius > 320) {
                clearInterval(breakoutGameInterval);
                playSound('gameover');
                breakoutCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                breakoutCtx.fillRect(0, 0, 280, 320);
                breakoutCtx.fillStyle = 'white';
                breakoutCtx.font = '24px Arial';
                breakoutCtx.textAlign = 'center';
                breakoutCtx.fillText('游戏结束', 140, 160);
                return;
            }
            
            renderBreakout();
        }
        
        function renderBreakout() {
            breakoutCtx.fillStyle = '#eee4da';
            breakoutCtx.fillRect(0, 0, 280, 320);
            
            // 画挡板
            breakoutCtx.fillStyle = '#776e65';
            breakoutCtx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // 画球
            breakoutCtx.fillStyle = '#f65e3b';
            breakoutCtx.beginPath();
            breakoutCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            breakoutCtx.fill();
            
            // 画砖块
            bricks.forEach((brick, index) => {
                if (brick.alive) {
                    const colors = ['#f65e3b', '#edc22e', '#77dd77', '#66ccff', '#ff99cc'];
                    breakoutCtx.fillStyle = colors[index % 5];
                    breakoutCtx.fillRect(brick.x, brick.y, brick.width, brick.height);
                }
            });
        }
        
        function restartBreakout() {
            if (breakoutGameInterval) clearInterval(breakoutGameInterval);
            initBreakout();
        }
        
        // 5. 记忆翻牌游戏
        let memoryCards, flippedCards, matchedPairs;
        
        function initMemory() {
            const board = document.getElementById('board-5');
            
            // 生成卡片
            const symbols = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🥝', '🍑'];
            memoryCards = [...symbols, ...symbols];
            // 洗牌
            for (let i = memoryCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [memoryCards[i], memoryCards[j]] = [memoryCards[j], memoryCards[i]];
            }
            
            flippedCards = [];
            matchedPairs = 0;
            
            board.innerHTML = `
                <div class="grid-memory" id="gridMemory">
                    ${memoryCards.map((symbol, index) => 
                        `<div class="card-memory" data-index="${index}" data-symbol="${symbol}"></div>`
                    ).join('')}
                </div>
            `;
            
            const cards = document.querySelectorAll('.card-memory');
            cards.forEach(card => {
                card.addEventListener('click', () => handleMemoryCardClick(card));
            });
        }
        
        function handleMemoryCardClick(card) {
            const index = parseInt(card.dataset.index);
            
            // 不能翻已经翻开的或已经匹配的卡片
            if (flippedCards.includes(index) || card.classList.contains('matched')) return;
            // 最多同时翻两张
            if (flippedCards.length >= 2) return;
            
            card.textContent = card.dataset.symbol;
            card.classList.add('flipped');
            flippedCards.push(index);
            playSound('move');
            
            if (flippedCards.length === 2) {
                const [firstIndex, secondIndex] = flippedCards;
                const firstCard = document.querySelector(`.card-memory[data-index="${firstIndex}"]`);
                const secondCard = document.querySelector(`.card-memory[data-index="${secondIndex}"]`);
                
                if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
                    // 匹配成功
                    firstCard.classList.add('matched');
                    secondCard.classList.add('matched');
                    matchedPairs++;
                    playSound('collect');
                    flippedCards = [];
                    
                    // 胜利检测
                    if (matchedPairs === 8) {
                        setTimeout(() => showFireworks(), 300);
                    }
                } else {
                    // 匹配失败
                    setTimeout(() => {
                        firstCard.textContent = '';
                        secondCard.textContent = '';
                        firstCard.classList.remove('flipped');
                        secondCard.classList.remove('flipped');
                        flippedCards = [];
                    }, 1000);
                }
            }
        }
        
        function restartMemory() {
            initMemory();
        }
        
        // 6. 俄罗斯方块游戏
        let tetrisCanvas, tetrisCtx, tetrisBoard, currentPiece, currentX, currentY, tetrisGameInterval;
        
        const TETRIS_PIECES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[1, 1, 1], [0, 1, 0]], // T
            [[1, 1, 1], [1, 0, 0]], // L
            [[1, 1, 1], [0, 0, 1]], // J
            [[1, 1, 0], [0, 1, 1]], // S
            [[0, 1, 1], [1, 1, 0]]  // Z
        ];
        
        const TETRIS_COLORS = ['#f65e3b', '#edc22e', '#77dd77', '#66ccff', '#ff99cc', '#ff6b6b', '#9966ff'];
        
        function initTetris() {
            const board = document.getElementById('board-6');
            board.innerHTML = `<canvas class="tetris-canvas" id="tetrisCanvas" width="200" height="400"></canvas>`;
            
            tetrisCanvas = document.getElementById('tetrisCanvas');
            tetrisCtx = tetrisCanvas.getContext('2d');
            
            // 10列20行
            tetrisBoard = Array(20).fill().map(() => Array(10).fill(0));
            
            spawnPiece();
            
            if (tetrisGameInterval) clearInterval(tetrisGameInterval);
            tetrisGameInterval = setInterval(updateTetris, 500);
            
            // 键盘控制
            document.removeEventListener('keydown', handleTetrisKeydown);
            document.addEventListener('keydown', handleTetrisKeydown);
            
            // 触摸控制
            let touchStartX, touchStartY;
            board.removeEventListener('touchstart', handleTetrisTouchStart);
            board.addEventListener('touchstart', handleTetrisTouchStart);
            
            function handleTetrisTouchStart(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                
                function handleTouchEnd(e) {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    const diffX = touchEndX - touchStartX;
                    const diffY = touchEndY - touchStartY;
                    
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 30) movePiece(1, 0);
                        else if (diffX < -30) movePiece(-1, 0);
                    } else {
                        if (diffY > 30) movePiece(0, 1);
                        else if (diffY < -30) rotatePiece();
                    }
                    
                    board.removeEventListener('touchend', handleTouchEnd);
                }
                
                board.addEventListener('touchend', handleTouchEnd);
            }
            
            // 点击旋转
            board.removeEventListener('click', handleTetrisClick);
            board.addEventListener('click', handleTetrisClick);
            
            function handleTetrisClick(e) {
                rotatePiece();
            }
        }
        
        function handleTetrisKeydown(e) {
            if (currentGameIndex !== 5) return;
            
            switch(e.key) {
                case 'ArrowLeft': e.preventDefault(); movePiece(-1, 0); break;
                case 'ArrowRight': e.preventDefault(); movePiece(1, 0); break;
                case 'ArrowDown': e.preventDefault(); movePiece(0, 1); break;
                case 'ArrowUp': e.preventDefault(); rotatePiece(); break;
            }
        }
        
        function spawnPiece() {
            const pieceIndex = Math.floor(Math.random() * TETRIS_PIECES.length);
            currentPiece = TETRIS_PIECES[pieceIndex];
            currentPiece.color = TETRIS_COLORS[pieceIndex];
            currentX = Math.floor(10 / 2) - Math.floor(currentPiece[0].length / 2);
            currentY = 0;
            
            // 游戏结束检测
            if (checkCollision(currentPiece, currentX, currentY)) {
                clearInterval(tetrisGameInterval);
                playSound('gameover');
                tetrisCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                tetrisCtx.fillRect(0, 0, 200, 400);
                tetrisCtx.fillStyle = 'white';
                tetrisCtx.font = '24px Arial';
                tetrisCtx.textAlign = 'center';
                tetrisCtx.fillText('游戏结束', 100, 200);
            }
        }
        
        function checkCollision(piece, x, y) {
            for (let i = 0; i < piece.length; i++) {
                for (let j = 0; j < piece[i].length; j++) {
                    if (piece[i][j]) {
                        const newX = x + j;
                        const newY = y + i;
                        
                        if (newX < 0 || newX >= 10 || newY >= 20 || 
                            (newY >= 0 && tetrisBoard[newY][newX])) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }
        
        function movePiece(dx, dy) {
            if (!checkCollision(currentPiece, currentX + dx, currentY + dy)) {
                currentX += dx;
                currentY += dy;
                playSound('move');
                renderTetris();
                return true;
            }
            return false;
        }
        
        function rotatePiece() {
            // 旋转矩阵
            const rotated = currentPiece[0].map((_, index) => 
                currentPiece.map(row => row[index]).reverse()
            );
            
            if (!checkCollision(rotated, currentX, currentY)) {
                currentPiece = rotated;
                currentPiece.color = TETRIS_COLORS[TETRIS_PIECES.findIndex(p => 
                    JSON.stringify(p) === JSON.stringify(currentPiece) || 
                    JSON.stringify(p) === JSON.stringify(rotated)
                )];
                playSound('move');
                renderTetris();
            }
        }
        
        function lockPiece() {
            for (let i = 0; i < currentPiece.length; i++) {
                for (let j = 0; j < currentPiece[i].length; j++) {
                    if (currentPiece[i][j]) {
                        tetrisBoard[currentY + i][currentX + j] = currentPiece.color;
                    }
                }
            }
            
            // 检查消行
            let linesCleared = 0;
            for (let i = tetrisBoard.length - 1; i >= 0; i--) {
                if (tetrisBoard[i].every(cell => cell !== 0)) {
                    tetrisBoard.splice(i, 1);
                    tetrisBoard.unshift(Array(10).fill(0));
                    linesCleared++;
                    i++; // 重新检查当前行
                }
            }
            
            if (linesCleared > 0) {
                playSound('collect');
            }
            
            // 胜利条件：消除10行
            if (linesCleared >= 10) {
                clearInterval(tetrisGameInterval);
                showFireworks();
                return;
            }
            
            spawnPiece();
        }
        
        function updateTetris() {
            if (!movePiece(0, 1)) {
                lockPiece();
            }
            renderTetris();
        }
        
        function renderTetris() {
            tetrisCtx.fillStyle = '#eee4da';
            tetrisCtx.fillRect(0, 0, 200, 400);
            
            // 画已落下的方块
            for (let i = 0; i < 20; i++) {
                for (let j = 0; j < 10; j++) {
                    if (tetrisBoard[i][j]) {
                        tetrisCtx.fillStyle = tetrisBoard[i][j];
                        tetrisCtx.fillRect(j * 20, i * 20, 19, 19);
                    }
                }
            }
            
            // 画当前方块
            for (let i = 0; i < currentPiece.length; i++) {
                for (let j = 0; j < currentPiece[i].length; j++) {
                    if (currentPiece[i][j]) {
                        tetrisCtx.fillStyle = currentPiece.color;
                        tetrisCtx.fillRect((currentX + j) * 20, (currentY + i) * 20, 19, 19);
                    }
                }
            }
        }
        
        function restartTetris() {
            if (tetrisGameInterval) clearInterval(tetrisGameInterval);
            initTetris();
        }
        
        // 7. 消消乐游戏
        let matchBoard, selectedCell, matchScore;
        
        function initMatch() {
            const board = document.getElementById('board-7');
            matchBoard = Array(6).fill().map(() => Array(6).fill(0));
            selectedCell = null;
            matchScore = 0;
            
            // 初始化棋盘，确保没有初始匹配
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 6; j++) {
                    do {
                        matchBoard[i][j] = Math.floor(Math.random() * 6);
                    } while (hasMatchAt(i, j));
                }
            }
            
            renderMatch();
            
            const cells = document.querySelectorAll('.cell-match');
            cells.forEach((cell, index) => {
                cell.addEventListener('click', () => handleMatchClick(index));
            });
        }
        
        function hasMatchAt(row, col) {
            const color = matchBoard[row][col];
            
            // 检查水平
            let horizontalCount = 1;
            for (let j = col - 1; j >= 0 && matchBoard[row][j] === color; j--) horizontalCount++;
            for (let j = col + 1; j < 6 && matchBoard[row][j] === color; j++) horizontalCount++;
            
            // 检查垂直
            let verticalCount = 1;
            for (let i = row - 1; i >= 0 && matchBoard[i][col] === color; i--) verticalCount++;
            for (let i = row + 1; i < 6 && matchBoard[i][col] === color; i++) verticalCount++;
            
            return horizontalCount >= 3 || verticalCount >= 3;
        }
        
        function handleMatchClick(index) {
            const row = Math.floor(index / 6);
            const col = index % 6;
            
            if (selectedCell === null) {
                // 选择第一个格子
                selectedCell = {row, col};
                document.querySelectorAll('.cell-match')[index].classList.add('selected');
                playSound('move');
            } else {
                // 检查是否相邻
                const isAdjacent = 
                    (Math.abs(selectedCell.row - row) === 1 && selectedCell.col === col) ||
                    (Math.abs(selectedCell.col - col) === 1 && selectedCell.row === row);
                
                if (isAdjacent) {
                    // 交换
                    [matchBoard[selectedCell.row][selectedCell.col], matchBoard[row][col]] = 
                    [matchBoard[row][col], matchBoard[selectedCell.row][selectedCell.col]];
                    
                    // 检查是否有匹配
                    if (checkAndRemoveMatches()) {
                        playSound('collect');
                        // 下落并填充
                        setTimeout(() => {
                            dropAndFill();
                            // 连锁反应
                            setTimeout(() => {
                                while (checkAndRemoveMatches()) {
                                    dropAndFill();
                                }
                                renderMatch();
                                
                                // 胜利条件：达到100分
                                if (matchScore >= 100) {
                                    showFireworks();
                                }
                            }, 300);
                        }, 300);
                    } else {
                        // 没有匹配，交换回来
                        [matchBoard[selectedCell.row][selectedCell.col], matchBoard[row][col]] = 
                        [matchBoard[row][col], matchBoard[selectedCell.row][selectedCell.col]];
                    }
                }
                
                // 取消选择
                document.querySelectorAll('.cell-match').forEach(cell => cell.classList.remove('selected'));
                selectedCell = null;
            }
        }
        
        function checkAndRemoveMatches() {
            const toRemove = new Set();
            
            // 检查水平匹配
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 4; j++) {
                    if (matchBoard[i][j] === matchBoard[i][j+1] && 
                        matchBoard[i][j] === matchBoard[i][j+2]) {
                        toRemove.add(`${i},${j}`);
                        toRemove.add(`${i},${j+1}`);
                        toRemove.add(`${i},${j+2}`);
                    }
                }
            }
            
            // 检查垂直匹配
            for (let j = 0; j < 6; j++) {
                for (let i = 0; i < 4; i++) {
                    if (matchBoard[i][j] === matchBoard[i+1][j] && 
                        matchBoard[i][j] === matchBoard[i+2][j]) {
                        toRemove.add(`${i},${j}`);
                        toRemove.add(`${i+1},${j}`);
                        toRemove.add(`${i+2},${j}`);
                    }
                }
            }
            
            if (toRemove.size > 0) {
                matchScore += toRemove.size * 10;
                toRemove.forEach(key => {
                    const [i, j] = key.split(',').map(Number);
                    matchBoard[i][j] = null;
                });
                return true;
            }
            return false;
        }
        
        function dropAndFill() {
            // 下落
            for (let j = 0; j < 6; j++) {
                let emptyRow = 5;
                for (let i = 5; i >= 0; i--) {
                    if (matchBoard[i][j] !== null) {
                        matchBoard[emptyRow][j] = matchBoard[i][j];
                        if (emptyRow !== i) {
                            matchBoard[i][j] = null;
                        }
                        emptyRow--;
                    }
                }
                
                // 填充新方块
                for (let i = emptyRow; i >= 0; i--) {
                    matchBoard[i][j] = Math.floor(Math.random() * 6);
                }
            }
            
            renderMatch();
        }
        
        function renderMatch() {
            const board = document.getElementById('board-7');
            board.innerHTML = `
                <div class="grid-match" id="gridMatch">
                    ${matchBoard.flat().map((color, index) => 
                        `<div class="cell-match" data-color="${color}" data-index="${index}"></div>`
                    ).join('')}
                </div>
                <div style="margin-top: 10px; font-size: 18px; font-weight: bold; color: #776e65;">
                    得分: ${matchScore}/100
                </div>
            `;
            
            const cells = document.querySelectorAll('.cell-match');
            cells.forEach((cell, index) => {
                cell.addEventListener('click', () => handleMatchClick(index));
            });
        }
        
        function restartMatch() {
            initMatch();
        }
        
        // 初始化应用
        loadUserData();
        createGameSlides();
    </script>
</body>
