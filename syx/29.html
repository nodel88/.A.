<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GameFeed - 刷游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* === TOP BAR === */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px 6px;
  background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
  padding-top:max(env(safe-area-inset-top),10px)}
.tl{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#fe2c55,#25f4ee);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  box-shadow:0 2px 8px rgba(254,44,85,.35)}
.un{font-size:14px;font-weight:700;letter-spacing:-.3px}
.tr{display:flex;gap:5px}
.tb{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:20px;
  padding:5px 11px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-weight:600;transition:background .2s}
.tb:active{background:rgba(255,255,255,.25)}

/* === FEED === */
#feed-wrap{position:relative;width:100%;height:100%;overflow:hidden}
#feed{position:relative;width:100%;will-change:transform}
.gc{position:absolute;top:0;left:0;width:100%;overflow:hidden;display:flex;flex-direction:column}

/* === PREVIEW === */
.preview{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;z-index:2;transition:opacity .35s ease}
.preview .pe{font-size:72px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.4))}
.preview .pn{font-size:26px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.preview .pd{font-size:13px;color:rgba(255,255,255,.75);text-align:center;max-width:70%}
.preview .pt{margin-top:20px;padding:10px 30px;border:2px solid rgba(255,255,255,.45);
  border-radius:28px;font-size:14px;font-weight:600;
  animation:pulse 2s ease-in-out infinite;backdrop-filter:blur(4px)}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.gc.playing .preview{opacity:0;pointer-events:none}

/* === PLAY AREA === */
.play-area{position:absolute;inset:0;z-index:3;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding-top:50px;padding-bottom:120px}
.gc.playing .play-area{display:flex}
.cbtn{position:absolute;top:max(env(safe-area-inset-top),46px);right:14px;
  width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);
  border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:17px;
  cursor:pointer;z-index:10;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gc.playing .cbtn{display:flex}
.gc-inner{position:relative;border-radius:12px;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.6)}
.gc-inner canvas{display:block}

/* === DPAD === */
.dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;
  gap:5px;margin-top:12px}
.dp{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s;color:rgba(255,255,255,.8)}
.dp:active{background:rgba(255,255,255,.3)}
.dp-u{grid-column:2;grid-row:1}.dp-l{grid-column:1;grid-row:2}
.dp-d{grid-column:2;grid-row:2}.dp-r{grid-column:3;grid-row:2}

/* === SIDEBAR === */
#sidebar{position:fixed;right:12px;bottom:200px;z-index:50;
  display:flex;flex-direction:column;align-items:center;gap:16px}
.sb{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.sb .si{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  transition:transform .2s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sb .si:active{transform:scale(.82)}
.sb .sc{font-size:11px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.sb.on .si{background:rgba(254,44,85,.25);border:1px solid rgba(254,44,85,.3)}

/* === BOTTOM === */
#bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:10px 16px max(env(safe-area-inset-bottom),10px);
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent)}
.bb{font-size:15px;font-weight:700;margin-bottom:3px}
.bt{font-size:13px;margin-bottom:2px;line-height:1.3}
.bh{font-size:11px;color:rgba(255,255,255,.45);overflow:hidden;white-space:nowrap}
.bh span{display:inline-block;animation:ticker 12s linear infinite}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* === FIREWORKS === */
#fw{position:fixed;inset:0;pointer-events:none;z-index:1000}

/* === MODAL === */
#modal{position:fixed;inset:0;z-index:200;display:none}
#modal.show{display:block}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.mpn{position:absolute;bottom:0;left:0;right:0;max-height:72vh;
  background:#161616;border-radius:14px 14px 0 0;overflow:hidden;
  display:flex;flex-direction:column;animation:su .3s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mph{padding:14px 18px 10px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.mph h3{font-size:15px;font-weight:700}
.mx{background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;padding:4px}
.mbd{overflow-y:auto;padding:8px 18px 24px;flex:1;-webkit-overflow-scrolling:touch}
.mi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.mi .me{font-size:28px;flex-shrink:0}
.mi .mf{flex:1;min-width:0}
.mi .mn{font-size:14px;font-weight:600}
.mi .md{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px}
.mi .mb{background:rgba(254,44,85,.15);border:none;color:#fe2c55;padding:5px 13px;
  border-radius:14px;font-size:11px;cursor:pointer;white-space:nowrap;font-weight:600;flex-shrink:0}
.empty{text-align:center;padding:36px 0;color:rgba(255,255,255,.25);font-size:13px}

/* === GAME SPECIFIC === */
.g2048-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px;background:rgba(255,255,255,.05);border-radius:10px}
.g2048-cell{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;background:rgba(255,255,255,.06);transition:all .1s}

.mem-grid{display:grid;gap:7px;padding:7px;background:rgba(255,255,255,.04);border-radius:10px}
.mem-card{aspect-ratio:1;border-radius:9px;cursor:pointer;position:relative;
  transform-style:preserve-3d;transition:transform .35s ease}
.mem-card .bk,.mem-card .ft{position:absolute;inset:0;border-radius:9px;
  display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.mem-card .bk{background:linear-gradient(135deg,#6c5ce7,#a29bfe);font-size:18px}
.mem-card .ft{background:#2d3436;transform:rotateY(180deg);font-size:26px}
.mem-card.flipped{transform:rotateY(180deg)}
.mem-card.matched{opacity:.45;pointer-events:none}

.puzzle-grid{display:grid;gap:4px;padding:7px;background:rgba(255,255,255,.04);border-radius:10px}
.puzzle-tile{border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;cursor:pointer;transition:all .12s;
  background:linear-gradient(135deg,#0984e3,#74b9ff);color:#fff}
.puzzle-tile.empty{background:rgba(255,255,255,.03);cursor:default}

.mole-grid{display:grid;gap:8px;padding:8px;background:rgba(255,255,255,.04);border-radius:10px}
.mole-hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#3d2914,#1a1005);
  position:relative;overflow:hidden;cursor:pointer;box-shadow:inset 0 4px 12px rgba(0,0,0,.6)}
.mole-hole .mole{position:absolute;bottom:-100%;left:8%;right:8%;height:80%;
  border-radius:50% 50% 30% 30%;
  background:linear-gradient(to bottom,#a07020,#7a5510);
  transition:bottom .18s ease;display:flex;align-items:center;justify-content:center;font-size:22px}
.mole-hole .mole.up{bottom:8%}
.mole-hole .whacked .mole{background:linear-gradient(to bottom,#e74c3c,#c0392b)}

.score-bar{text-align:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.7);
  margin-bottom:8px;letter-spacing:.3px}

.go-overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:8;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.go-overlay button{padding:10px 36px;background:linear-gradient(135deg,#fe2c55,#ff6b81);
  border:none;color:#fff;border-radius:26px;font-size:15px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 16px rgba(254,44,85,.4)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tl"><div class="av">🎮</div><span class="un" id="dun"></span></div>
    <div class="tr">
      <button class="tb" onclick="openModal('played')">📋 <span id="cp">0</span></button>
      <button class="tb" onclick="openModal('liked')">❤️ <span id="cl">0</span></button>
      <button class="tb" onclick="openModal('faved')">⭐ <span id="cf">0</span></button>
    </div>
  </div>
  <div id="feed-wrap"><div id="feed"></div></div>
  <div id="sidebar">
    <div class="sb" id="sbl" onclick="togLike()"><div class="si" id="ili">🤍</div><span class="sc" id="nl">0</span></div>
    <div class="sb" id="sbf" onclick="togFav()"><div class="si" id="ifi">🔖</div><span class="sc" id="nf">0</span></div>
  </div>
  <div id="bottom">
    <div class="bb" id="bu">@GameFeed</div>
    <div class="bt" id="bt"></div>
    <div class="bh"><span id="bht"></span></div>
  </div>
  <canvas id="fw"></canvas>
  <div id="modal">
    <div class="mbg" onclick="closeModal()"></div>
    <div class="mpn">
      <div class="mph"><h3 id="mt"></h3><button class="mx" onclick="closeModal()">✕</button></div>
      <div class="mbd" id="mb"></div>
    </div>
  </div>
</div>

<script>
// ============ UTILITIES ============
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];

// ============ USERNAME ============
const ADJ=['快乐的','疯狂的','无敌的','闪亮的','聪明的','神秘的','可爱的','暴躁的','优雅的','幸运的','炫酷的','呆萌的'];
const NOUN=['小猫','熊猫','海豚','猎鹰','龙猫','企鹅','狐狸','白兔','老虎','柴犬','仓鼠','树懒','刺猬','水獭'];
let username=localStorage.getItem('gf_u');
if(!username){username=pick(ADJ)+pick(NOUN)+rnd(100,999);localStorage.setItem('gf_u',username);}
('#dun').textContent='@'+username;

// ============ STATE ============
let liked=JSON.parse(localStorage.getItem('gf_lk')||'{}');
let faved=JSON.parse(localStorage.getItem('gf_fv')||'{}');
let played=JSON.parse(localStorage.getItem('gf_pl')||'[]');
function save(){localStorage.setItem('gf_lk',JSON.stringify(liked));localStorage.setItem('gf_fv',JSON.stringify(faved));localStorage.setItem('gf_pl',JSON.stringify(played));}
function isL(id){return !!liked[id];}
function isF(id){return !!faved[id];}
function getL(id){return liked[id]||0;}
function getF(id){return faved[id]||0;}

// ============ GAMES DATA ============
const GAMES=[
  {id:'g1',name:'2048',emoji:'🔢',desc:'经典数字拼图，合并到2048！',howto:'🎮 点击开始 → 使用下方方向键/键盘方向键移动数字，相同数字合并',
    grad:'linear-gradient(145deg,#f7c948,#e17055)'},
  {id:'g2',name:'贪吃蛇',emoji:'🐍',desc:'控制小蛇吃食物不断变长',howto:'🎮 点击开始 → 方向键控制蛇移动，吃到食物变长，目标长度15',
    grad:'linear-gradient(145deg,#00b894,#00cec9)'},
  {id:'g3',name:'像素鸟',emoji:'🐤',desc:'控制小鸟穿越管道障碍',howto:'🎮 直接点击屏幕 → 点击/空格让小鸟飞翔，穿越管道得分，目标10分',
    grad:'linear-gradient(145deg,#74b9ff,#0984e3)'},
  {id:'g4',name:'翻牌配对',emoji:'🃏',desc:'翻开两张相同的牌即可配对',howto:'🎮 点击开始 → 点击翻开牌面，连续翻两张，图案相同则配对成功',
    grad:'linear-gradient(145deg,#a29bfe,#6c5ce7)'},
  {id:'g5',name:'打砖块',emoji:'🧱',desc:'用挡板反弹小球击碎砖块',howto:'🎮 点击开始 → 拖动/方向键移动挡板，小球击碎全部砖块获胜',
    grad:'linear-gradient(145deg,#fd79a8,#e84393)'},
  {id:'g6',name:'数字华容道',emoji:'🔢',desc:'滑动方块按1~15排列',howto:'🎮 点击开始 → 点击空格旁边的方块，将数字按1-15顺序排列',
    grad:'linear-gradient(145deg,#55efc4,#00b894)'},
  {id:'g7',name:'打地鼠',emoji:'🔨',desc:'30秒内快速点击冒出的地鼠',howto:'🎮 点击开始 → 地鼠从洞口冒出时快速点击它，30秒内得15分获胜',
    grad:'linear-gradient(145deg,#ffeaa7,#fdcb6e)'}
];

// ============ FEED SYSTEM ============
let curIdx=0,isGameActive=false,didSwipe=false;
const feed=$('#feed'),vh=window.innerHeight;

function buildFeed(){
  feed.innerHTML='';
  GAMES.forEach((g,i)=>{
    const card=document.createElement('div');
    card.className='gc';
    card.id='c_'+g.id;
    card.style.cssText=`height:${vh}px;`;
    card.innerHTML=`
      <div class="preview" style="background:${g.grad}">
        <div class="pe">${g.emoji}</div>
        <div class="pn">${g.name}</div>
        <div class="pd">${g.desc}</div>
        <div class="pt">点击开始游戏</div>
      </div>
      <button class="cbtn" onclick="deactivateGame()">✕</button>
      <div class="play-area" id="pa_${g.id}"></div>`;
    card.addEventListener('click',e=>{
      if(didSwipe||isGameActive)return;
      if(e.target.closest('.cbtn')||e.target.closest('.play-area'))return;
      activateGame(i);
    });
    feed.appendChild(card);
  });
  updateUI();
  window.addEventListener('resize',()=>{
    const nv=window.innerHeight;
    $$$$('.gc').forEach(c=>c.style.height=nv+'px');
    feed.style.transform=`translateY(-${curIdx*nv}px)`;
  });
}

function switchTo(idx){
  if(idx<0||idx>=GAMES.length)return;
  curIdx=idx;
  feed.style.transform=`translateY(-${idx*vh}px)`;
  updateUI();
}

// ============ TOUCH SWIPE ============
let tSY=0,tDY=0,touching=false;
const fWrap=$('#feed-wrap');

fWrap.addEventListener('touchstart',e=>{
  if(isGameActive)return;
  tSY=e.touches[0].clientY;tDY=0;touching=true;didSwipe=false;
  feed.style.transition='none';
},{passive:true});

fWrap.addEventListener('touchmove',e=>{
  if(isGameActive||!touching)return;
  tDY=e.touches[0].clientY-tSY;
  feed.style.transform=`translateY(${-curIdx*vh+tDY}px)`;
},{passive:true});

fWrap.addEventListener('touchend',()=>{
  if(isGameActive||!touching)return;
  touching=false;
  feed.style.transition='transform .4s cubic-bezier(.25,.46,.45,.94)';
  if(Math.abs(tDY)>55){
    didSwipe=true;setTimeout(()=>didSwipe=false,400);
    if(tDY>0&&curIdx>0)curIdx--;
    else if(tDY<0&&curIdx<GAMES.length-1)curIdx++;
  }
  feed.style.transform=`translateY(-${curIdx*vh}px)`;
  tDY=0;
  updateUI();
},{passive:true});

// Desktop wheel
let wLock=false;
document.addEventListener('wheel',e=>{
  if(isGameActive||wLock)return;
  wLock=true;
  if(e.deltaY>25&&curIdx<GAMES.length-1)curIdx++;
  else if(e.deltaY<-25&&curIdx>0)curIdx--;
  feed.style.transition='transform .4s cubic-bezier(.25,.46,.45,.94)';
  feed.style.transform=`translateY(-${curIdx*vh}px)`;
  updateUI();
  setTimeout(()=>wLock=false,500);
},{passive:true});

// ============ UI UPDATE ============
function updateUI(){
  const g=GAMES[curIdx];
  $('#bt').textContent='#'+g.name+' '+g.desc;
  $('#bht').textContent=g.howto;
  const id=g.id;
  $('#ili').textContent=isL(id)?'❤️':'🤍';
  $('#nl').textContent=getL(id);
  $('#ifi').textContent=isF(id)?'⭐':'🔖';
  $('#nf').textContent=getF(id);
  $('#sbl').classList.toggle('on',isL(id));
  $('#sbf').classList.toggle('on',isF(id));
  $('#cp').textContent=played.length;
  $('#cl').textContent=Object.keys(liked).filter(k=>liked[k]).length;
  $('#cf').textContent=Object.keys(faved).filter(k=>faved[k]).length;
}
function togLike(){
  const id=GAMES[curIdx].id;
  if(isL(id))delete liked[id];else liked[id]=1;
  save();updateUI();
  bounce('#ili');
}
function togFav(){
  const id=GAMES[curIdx].id;
  if(isF(id))delete faved[id];else faved[id]=1;
  save();updateUI();
  bounce('#ifi');
}
function bounce(sel){const el=$(sel);el.style.transform='scale(1.5)';setTimeout(()=>el.style.transform='',250);}

// ============ MODAL ============
function openModal(type){
  const bd=$('#mb'),mt=$('#mt');
  let items=[];
  if(type==='played'){
    mt.textContent='📋 已玩过的游戏';
    items=played.map(id=>GAMES.find(g=>g.id===id)).filter(Boolean);
    bd.innerHTML=items.length?items.map(g=>`
      <div class="mi"><div class="me">${g.emoji}</div><div class="mf"><div class="mn">${g.name}</div><div class="md">${g.desc}</div></div>
      <button class="mb" onclick="rmPlayed('${g.id}')">删除</button></div>`).join(''):'<div class="empty">还没有玩过游戏~</div>';
  }else if(type==='liked'){
    mt.textContent='❤️ 已点赞的游戏';
    items=Object.keys(liked).filter(k=>liked[k]).map(id=>GAMES.find(g=>g.id===id)).filter(Boolean);
    bd.innerHTML=items.length?items.map(g=>`
      <div class="mi"><div class="me">${g.emoji}</div><div class="mf"><div class="mn">${g.name}</div><div class="md">${g.desc}</div></div>
      <button class="mb" onclick="unLike('${g.id}')">取消点赞</button></div>`).join(''):'<div class="empty">还没有点赞游戏~</div>';
  }else{
    mt.textContent='⭐ 已收藏的游戏';
    items=Object.keys(faved).filter(k=>faved[k]).map(id=>GAMES.find(g=>g.id===id)).filter(Boolean);
    bd.innerHTML=items.length?items.map(g=>`
      <div class="mi"><div class="me">${g.emoji}</div><div class="mf"><div class="mn">${g.name}</div><div class="md">${g.desc}</div></div>
      <button class="mb" onclick="unFav('${g.id}')">取消收藏</button></div>`).join(''):'<div class="empty">还没有收藏游戏~</div>';
  }
  $('#modal').classList.add('show');
}
function closeModal(){$('#modal').classList.remove('show');}
function rmPlayed(id){played=played.filter(x=>x!==id);save();openModal('played');updateUI();}
function unLike(id){delete liked[id];save();openModal('liked');updateUI();}
function unFav(id){delete faved[id];save();openModal('faved');updateUI();}

// ============ FIREWORKS ============
const fwC=$('#fw'),fwX=fwC.getContext('2d');
let fwP=[],fwRun=false,fwT=0;
function resizeFw(){fwC.width=innerWidth;fwC.height=innerHeight;}
addEventListener('resize',resizeFw);resizeFw();

function showFireworks(){
  fwP=[];fwRun=true;fwT=0;
  const W=fwC.width,H=fwC.height;
  const colors=['#ff0055','#00ff88','#00aaff','#ffaa00','#ff00ff','#00ffff','#ffff00','#ff4444','#44ff44','#ff69b4','#ffd700','#7fffd4'];
  function burst(x,y){
    for(let i=0;i<55;i++){
      const a=Math.random()*Math.PI*2,s=Math.random()*6+2;
      fwP.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        c:pick(colors),life:1,dec:Math.random()*.013+.006,sz:Math.random()*3.5+1});
    }
  }
  // Staggered bursts
  for(let i=0;i<8;i++)setTimeout(()=>burst(rnd(60,W-60),rnd(40,H*.45)),i*320);
  for(let i=0;i<5;i++)setTimeout(()=>burst(rnd(60,W-60),rnd(40,H*.35)),2600+i*380);
  animFW();
  setTimeout(()=>{fwRun=false;},5500);
}

function animFW(){
  fwX.clearRect(0,0,fwC.width,fwC.height);
  if(!fwRun&&fwP.length===0&&fwT<=0)return;
  // Particles
  fwP=fwP.filter(p=>p.life>0);
  for(const p of fwP){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.055;p.vx*=.992;p.life-=p.dec;
    const a=Math.max(0,p.life);
    fwX.globalAlpha=a;fwX.fillStyle=p.c;
    fwX.beginPath();fwX.arc(p.x,p.y,p.sz,0,Math.PI*2);fwX.fill();
    fwX.globalAlpha=a*.25;
    fwX.beginPath();fwX.arc(p.x-p.vx*.8,p.y-p.vy*.8,p.sz*.5,0,Math.PI*2);fwX.fill();
  }
  // Text
  if(fwRun)fwT=Math.min(1,fwT+.025);
  else fwT=Math.max(0,fwT-.018);
  if(fwT>0){
    const cx=fwC.width/2,cy=fwC.height/2;
    const fs=Math.min(fwC.width*.085,48);
    const hue=(Date.now()*.06)%360;
    fwX.save();
    fwX.globalAlpha=fwT;
    fwX.font=`bold ${fs}px -apple-system,sans-serif`;
    fwX.textAlign='center';fwX.textBaseline='middle';
    // Glow layers
    fwX.shadowColor=`hsl(${hue},100%,55%)`;fwX.shadowBlur=35;
    fwX.fillStyle=`hsl(${(hue+120)%360},100%,72%)`;
    fwX.fillText('🎉 恭喜通关！🎉',cx,cy);
    fwX.shadowBlur=15;
    fwX.fillText('🎉 恭喜通关！🎉',cx,cy);
    fwX.shadowBlur=0;fwX.fillStyle='#fff';
    fwX.fillText('🎉 恭喜通关！🎉',cx,cy);
    // Sub
    const fs2=fs*.38;
    fwX.font=`bold ${fs2}px -apple-system,sans-serif`;
    fwX.fillStyle=`hsl(${(hue+240)%360},100%,78%)`;
    fwX.shadowColor=`hsl(${(hue+240)%360},100%,50%)`;fwX.shadowBlur=12;
    fwX.fillText('点击 ✕ 返回继续刷游戏',cx,cy+fs*.85);
    fwX.restore();
  }
  fwX.globalAlpha=1;
  requestAnimationFrame(animFW);
}

// ============ GAME ENGINE ============
class GE{
  constructor(id,el){
    this.id=id;this.el=el;this.alive=true;this._c=[];
    const m={g1:'init2048',g2:'initSnake',g3:'initFlappy',g4:'initMemory',g5:'initBreakout',g6:'initPuzzle',g7:'initMole'};
    this[m[id]]();
  }
  destroy(){this.alive=false;this._c.forEach(f=>f());this.el.innerHTML='';}
  on(fn){this._c.push(fn);}
  mkS(text){const d=document.createElement('div');d.className='score-bar';d.textContent=text;this.el.appendChild(d);return d;}
  onWin(){this.alive=false;showFireworks();}

  // ==================== 2048 ====================
  init2048(){
    const N=4,self=this;
    let grid,score,won;
    const se=this.mkS('分数: 0');
    const wrap=document.createElement('div');wrap.className='gc-inner';
    const ge=document.createElement('div');ge.className='g2048-grid';
    const sz=Math.min(Math.floor((innerWidth*.82)/N),80);
    ge.style.width=(sz*N+35)+'px';
    wrap.appendChild(ge);this.el.appendChild(wrap);
    const C={0:'rgba(255,255,255,.05)',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',
      64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
    const tc=v=>v<=4?'#776e65':'#f9f6f2';
    const cells=[];

    function init(){
      grid=Array.from({length:N},()=>Array(N).fill(0));score=0;won=false;
      ge.innerHTML='';
      for(let r=0;r<N;r++){cells[r]=[];for(let c=0;c<N;c++){
        const cell=document.createElement('div');cell.className='g2048-cell';
        cell.style.width=sz+'px';cell.style.height=sz+'px';
        ge.appendChild(cell);cells[r][c]=cell;
      }}
      addR();addR();render();
    }
    function addR(){
      const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]===0)e.push([r,c]);
      if(!e.length)return;const[r,c]=pick(e);grid[r][c]=Math.random()<.9?2:4;
    }
    function render(){
      se.textContent='分数: '+score;
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){
        const v=grid[r][c],cl=cells[r][c];
        cl.textContent=v||'';cl.style.background=C[v]||'#3c3a32';
        cl.style.color=tc(v);cl.style.fontSize=v>=1024?'14px':'18px';
      }
    }
    function slide(row){
      let a=row.filter(v=>v);
      for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);if(a[i]===2048)won=true;}
      while(a.length<N)a.push(0);return a;
    }
    function move(dir){
      const old=JSON.stringify(grid);
      if(dir==='left'){for(let r=0;r<N;r++)grid[r]=slide(grid[r]);}
      else if(dir==='right'){for(let r=0;r<N;r++)grid[r]=slide(grid[r].reverse()).reverse();}
      else if(dir==='up'){for(let c=0;c<N;c++){let cl=[];for(let r=0;r<N;r++)cl.push(grid[r][c]);cl=slide(cl);for(let r=0;r<N;r++)grid[r][c]=cl[r];}}
      else{for(let c=0;c<N;c++){let cl=[];for(let r=N-1;r>=0;r--)cl.push(grid[r][c]);cl=slide(cl);for(let r=N-1;r>=0;r--)grid[r][c]=cl[N-1-r];}}
      if(JSON.stringify(grid)===old)return;
      addR();render();
      if(won){setTimeout(()=>self.onWin(),200);return;}
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){
        if(grid[r][c]===0)return;
        if(c<N-1&&grid[r][c]===grid[r][c+1])return;
        if(r<N-1&&grid[r][c]===grid[r+1][c])return;
      }
      setTimeout(()=>goOverlay(wrap,'2048',()=>{init();}),300);
    }

    // D-pad
    const dp=document.createElement('div');dp.className='dpad';
    ['↑','←','↓','→'].forEach((t,i)=>{
      const b=document.createElement('div');b.className='dp '+['dp-u','dp-l','dp-d','dp-r'][i];b.textContent=t;
      b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();},{passive:false});
      b.addEventListener('click',e=>{e.stopPropagation();move(['up','left','down','right'][i]);});
      dp.appendChild(b);
    });
    this.el.appendChild(dp);

    // Keyboard
    const kh=e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]){e.preventDefault();move(m[e.key]);}};
    document.addEventListener('keydown',kh);this.on(()=>document.removeEventListener('keydown',kh));

    // Swipe on game area
    let sx,sy;
    wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;e.stopPropagation();},{passive:true});
    wrap.addEventListener('touchend',e=>{e.stopPropagation();
      const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>25)move(dx>0?'right':'left');
      else if(Math.abs(dy)>25)move(dy>0?'down':'up');
    },{passive:true});

    init();
  }

  // ==================== SNAKE ====================
  initSnake(){
    const COLS=15,ROWS=20,SZ=Math.min(Math.floor((innerWidth*.85)/COLS),Math.floor((innerHeight*.45)/ROWS)),self=this;
    let snake,dir,food,score,over,iv;
    const se=this.mkS('得分: 0 / 目标: 15');
    const wrap=document.createElement('div');wrap.className='gc-inner';
    const cvs=document.createElement('canvas');cvs.width=COLS*SZ;cvs.height=ROWS*SZ;
    wrap.appendChild(cvs);this.el.appendChild(wrap);
    const ctx=cvs.getContext('2d');

    function init(){
      snake=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];dir='right';score=0;over=false;
      placeFood();se.textContent='得分: 0 / 目标: 15';
    }
    function placeFood(){
      let p;do{p={x:rnd(0,COLS-1),y:rnd(0,ROWS-1)};}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p;
    }
    function render(){
      ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cvs.width,cvs.height);
      ctx.strokeStyle='rgba(255,255,255,.025)';
      for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)ctx.strokeRect(x*SZ,y*SZ,SZ,SZ);
      // Food glow
      ctx.fillStyle='#e74c3c';ctx.shadowColor='#e74c3c';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ*.38,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      // Snake
      snake.forEach((s,i)=>{
        const pct=i/snake.length;
        const g=Math.floor(200-pct*80);
        ctx.fillStyle=i===0?'#2ecc71':`rgb(${Math.floor(30+pct*20)},${g},${Math.floor(50+pct*30)})`;
        const r=i===0?4:3;
        ctx.beginPath();
        ctx.roundRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2,r);ctx.fill();
        if(i===0){ctx.fillStyle='#000';ctx.fillRect(s.x*SZ+SZ*.25,s.y*SZ+SZ*.25,3,3);ctx.fillRect(s.x*SZ+SZ*.6,s.y*SZ+SZ*.25,3,3);}
      });
    }
    function step(){
      if(over||!self.alive)return;
      const head={...snake[0]};
      if(dir==='right')head.x++;else if(dir==='left')head.x--;else if(dir==='up')head.y--;else head.y++;
      if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){die();return;}
      if(snake.some(s=>s.x===head.x&&s.y===head.y)){die();return;}
      snake.unshift(head);
      if(head.x===food.x&&head.y===food.y){
        score++;se.textContent='得分: '+score+' / 目标: 15';
        if(score>=15){over=true;render();self.onWin();return;}
        placeFood();
      }else snake.pop();
      render();
    }
    function die(){over=true;goOverlay(wrap,'贪吃蛇',()=>{init();render();over=false;});}
    function setD(d){
      const opp={up:'down',down:'up',left:'right',right:'left'};
      if(d!==opp[dir])dir=d;
    }

    const dp=document.createElement('div');dp.className='dpad';
    ['↑','←','↓','→'].forEach((t,i)=>{
      const b=document.createElement('div');b.className='dp '+['dp-u','dp-l','dp-d','dp-r'][i];b.textContent=t;
      b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();},{passive:false});
      b.addEventListener('click',e=>{e.stopPropagation();setD(['up','left','down','right'][i]);});
      dp.appendChild(b);
    });
    this.el.appendChild(dp);

    const kh=e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]){e.preventDefault();setD(m[e.key]);}};
    document.addEventListener('keydown',kh);
    this.on(()=>{document.removeEventListener('keydown',kh);clearInterval(iv);});

    let sx,sy;
    wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;e.stopPropagation();},{passive:true});
    wrap.addEventListener('touchend',e=>{e.stopPropagation();
      const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>22)setD(dx>0?'right':'left');
      else if(Math.abs(dy)>22)setD(dy>0?'down':'up');
    },{passive:true});

    init();render();
    iv=setInterval(step,135);
  }

  // ==================== FLAPPY BIRD ====================
  initFlappy(){
    const W=Math.min(innerWidth*.88,360),H=Math.min(innerHeight*.52,460),self=this;
    let bird,pipes,score,dead,started,raf;
    const se=this.mkS('得分: 0 / 目标: 10');
    const wrap=document.createElement('div');wrap.className='gc-inner';
    const cvs=document.createElement('canvas');cvs.width=W;cvs.height=H;
    wrap.appendChild(cvs);this.el.appendChild(wrap);
    const ctx=cvs.getContext('2d');
    const G=.38,FLAP=-7,GAP=135,PW=46,PS=2.8;
    let ground=0;

    function init(){
      bird={x:W*.25,y:H/2,vy:0};pipes=[];score=0;dead=false;started=false;
      se.textContent='得分: 0 / 目标: 10';
    }
    function spawn(){const gy=rnd(70,H-GAP-70);pipes.push({x:W,gy,scored:false});}
    function draw(){
      // Sky gradient
      const sky=ctx.createLinearGradient(0,0,0,H);
      sky.addColorStop(0,'#87ceeb');sky.addColorStop(.6,'#74b9ff');sky.addColorStop(1,'#e8d5b7');
      ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      // Clouds
      ctx.fillStyle='rgba(255,255,255,.4)';
      for(let i=0;i<3;i++){ctx.beginPath();ctx.arc((i*130+ground*.3)%W-20,60+i*30,25,0,Math.PI*2);ctx.arc((i*130+ground*.3)%W+10,55+i*30,30,0,Math.PI*2);ctx.fill();}
      // Pipes
      pipes.forEach(p=>{
        const grad=ctx.createLinearGradient(p.x,0,p.x+PW,0);
        grad.addColorStop(0,'#27ae60');grad.addColorStop(.5,'#2ecc71');grad.addColorStop(1,'#27ae60');
        ctx.fillStyle=grad;
        ctx.fillRect(p.x,0,PW,p.gy);ctx.fillRect(p.x,p.gy+GAP,PW,H-p.gy-GAP);
        ctx.fillStyle='#1e8449';
        ctx.fillRect(p.x-4,p.gy-20,PW+8,20);ctx.fillRect(p.x-4,p.gy+GAP,PW+8,20);
      });
      // Ground
      ctx.fillStyle='#c4a35a';ctx.fillRect(0,H-12,W,12);
      ctx.fillStyle='#a0884a';ctx.fillRect(0,H-12,W,4);
      // Bird
      ctx.save();ctx.translate(bird.x,bird.y);
      ctx.rotate(Math.min(bird.vy*.04,.6));
      // Body
      ctx.fillStyle='#f9ca24';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
      // Wing
      ctx.fillStyle='#f0932b';ctx.beginPath();ctx.ellipse(-2,4,10,6,Math.sin(Date.now()*.02)*.3,0,Math.PI*2);ctx.fill();
      // Eye
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-5,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2d3436';ctx.beginPath();ctx.arc(8,-5,3,0,Math.PI*2);ctx.fill();
      // Beak
      ctx.fillStyle='#e17055';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(22,2);ctx.lineTo(14,5);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    function update(){
      if(dead)return;
      bird.vy+=G;bird.y+=bird.vy;ground+=2;
      pipes.forEach(p=>p.x-=PS);
      if(!pipes.length||pipes[pipes.length-1].x<W-150)spawn();
      pipes.forEach(p=>{if(!p.scored&&p.x+PW<bird.x){p.scored=true;score++;se.textContent='得分: '+score+' / 目标: 10';}});
      pipes=pipes.filter(p=>p.x>-PW);
      if(bird.y<0||bird.y>H-12)die();
      pipes.forEach(p=>{
        if(bird.x+11>p.x&&bird.x-11<p.x+PW&&(bird.y-11<p.gy||bird.y+11>p.gy+GAP))die();
      });
      if(score>=10){dead=true;cancelAnimationFrame(raf);self.onWin();}
    }
    function die(){dead=true;goOverlay(wrap,'像素鸟',()=>{init();loop();});}
    function loop(){if(!self.alive)return;if(started)update();draw();if(!dead)raf=requestAnimationFrame(loop);}
    function flap(){if(dead)return;started=true;bird.vy=FLAP;}

    cvs.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();flap();},{passive:false});
    cvs.addEventListener('click',e=>{e.stopPropagation();flap();});
    const kh=e=>{if((e.key===' '||e.key==='ArrowUp')&&self.alive){e.preventDefault();flap();}};
    document.addEventListener('keydown',kh);
    this.on(()=>{document.removeEventListener('keydown',kh);cancelAnimationFrame(raf);});
    init();loop();
  }

  // ==================== MEMORY ====================
  initMemory(){
    const P=8,self=this;
    const EMOJIS=['🍎','🍊','🍋','🍇','🍓','🍒','🍑','🥝','🫐','🍉','🍌','🥭','🍍','🥑','🌽','🥕'];
    const chosen=EMOJIS.slice(0,P);
    let cards,flipped,matched,moves;
    const se=this.mkS('配对: 0/'+P+' · 步数: 0');
    const ge=document.createElement('div');ge.className='mem-grid gc-inner';
    const sz=Math.min(Math.floor((innerWidth*.84)/4),85);
    ge.style.cssText=`width:${sz*4+35}px;grid-template-columns:repeat(4,${sz}px)`;
    this.el.appendChild(ge);

    function init(){
      cards=[...chosen,...chosen].sort(()=>Math.random()-.5);
      flipped=[];matched=new Set();moves=0;
      ge.innerHTML='';
      cards.forEach((e,i)=>{
        const card=document.createElement('div');
        card.className='mem-card';card.style.cssText=`width:${sz}px;height:${sz}px`;
        card.innerHTML=`<div class="bk">❓</div><div class="ft">${e}</div>`;
        card.addEventListener('click',()=>flip(i));
        ge.appendChild(card);
      });
      se.textContent='配对: 0/'+P+' · 步数: 0';
    }
    function flip(i){
      if(flipped.length>=2||flipped.includes(i)||matched.has(i))return;
      flipped.push(i);ge.children[i].classList.add('flipped');
      if(flipped.length===2){
        moves++;
        const[a,b]=flipped;
        if(cards[a]===cards[b]){
          matched.add(a);matched.add(b);
          ge.children[a].classList.add('matched');ge.children[b].classList.add('matched');
          flipped=[];
          se.textContent='配对: '+matched.size/2+'/'+P+' · 步数: '+moves;
          if(matched.size===P*2)setTimeout(()=>self.onWin(),500);
        }else{
          setTimeout(()=>{if(ge.children[a])ge.children[a].classList.remove('flipped');if(ge.children[b])ge.children[b].classList.remove('flipped');flipped=[];},650);
        }
        se.textContent='配对: '+matched.size/2+'/'+P+' · 步数: '+moves;
      }
    }
    init();
  }

  // ==================== BREAKOUT ====================
  initBreakout(){
    const W=Math.min(innerWidth*.88,360),H=Math.min(innerHeight*.48,400),self=this;
    const se=this.mkS('砖块: 0');
    const wrap=document.createElement('div');wrap.className='gc-inner';
    const cvs=document.createElement('canvas');cvs.width=W;cvs.height=H;
    wrap.appendChild(cvs);this.el.appendChild(wrap);
    const ctx=cvs.getContext('2d');
    const BR=5,BC=7,BW=W/BC-3,BH=15,PW=65,PH=11,BS=6;
    let ball,paddle,bricks,score,started,raf,alive=true;

    function init(){
      paddle={x:W/2-PW/2,y:H-28,w:PW};
      ball={x:W/2,y:H-48,vx:2.8,vy:-2.8};
      bricks=[];score=0;started=false;alive=true;
      const colors=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db'];
      for(let r=0;r<BR;r++)for(let c=0;c<BC;c++)
        bricks.push({x:c*(BW+3)+1.5,y:r*(BH+3)+35,w:BW,h:BH,c:colors[r],on:true});
      se.textContent='砖块: '+bricks.filter(b=>b.on).length;
    }
    function draw(){
      ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
      // Bricks
      bricks.forEach(b=>{if(!b.on)return;
        const gr=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
        gr.addColorStop(0,b.c);gr.addColorStop(1,shade(b.c,-30));
        ctx.fillStyle=gr;ctx.fillRect(b.x,b.y,b.w,b.h);
        ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(b.x,b.y,b.w,b.h/3);
      });
      // Paddle
      const pg=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
      pg.addColorStop(0,'#dfe6e9');pg.addColorStop(.5,'#fff');pg.addColorStop(1,'#dfe6e9');
      ctx.fillStyle=pg;ctx.fillRect(paddle.x,paddle.y,paddle.w,PH);
      // Ball
      ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(ball.x,ball.y,BS,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
    function shade(hex,amt){
      let c=hex.replace('#','');
      const r=Math.max(0,Math.min(255,parseInt(c.substr(0,2),16)+amt));
      const g=Math.max(0,Math.min(255,parseInt(c.substr(2,2),16)+amt));
      const b=Math.max(0,Math.min(255,parseInt(c.substr(4,2),16)+amt));
      return `rgb(${r},${g},${b})`;
    }
    function update(){
      if(!started||!alive)return;
      ball.x+=ball.vx;ball.y+=ball.vy;
      if(ball.x<BS||ball.x>W-BS)ball.vx*=-1;
      if(ball.y<BS)ball.vy*=-1;
      if(ball.y+BS>paddle.y&&ball.y+BS<paddle.y+PH+4&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.vy>0){
        ball.vy=-Math.abs(ball.vy);
        ball.vx+=(ball.x-(paddle.x+paddle.w/2))*.1;
        const sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
        const maxSp=5;if(sp>maxSp){ball.vx*=maxSp/sp;ball.vy*=maxSp/sp;}
      }
      if(ball.y>H+10){alive=false;goOverlay(wrap,'打砖块',()=>{init();draw();});return;}
      bricks.forEach(b=>{
        if(!b.on)return;
        if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){
          b.on=false;ball.vy*=-1;score++;
          se.textContent='砖块: '+bricks.filter(bb=>bb.on).length;
          if(bricks.every(bb=>!bb.on)){cancelAnimationFrame(raf);self.onWin();}
        }
      });
    }
    function loop(){if(!self.alive)return;update();draw();raf=requestAnimationFrame(loop);}
    function mv(px){paddle.x=Math.max(0,Math.min(W-paddle.w,px-paddle.w/2));}

    cvs.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();started=true;
      mv(e.touches[0].clientX-cvs.getBoundingClientRect().left);},{passive:false});
    cvs.addEventListener('touchmove',e=>{e.preventDefault();e.stopPropagation();
      mv(e.touches[0].clientX-cvs.getBoundingClientRect().left);},{passive:false});
    cvs.addEventListener('mousedown',e=>{started=true;mv(e.offsetX);});
    cvs.addEventListener('mousemove',e=>{if(e.buttons)mv(e.offsetX);});

    const kh=e=>{if(e.key==='ArrowLeft'){paddle.x=Math.max(0,paddle.x-18);started=true;}if(e.key==='ArrowRight'){paddle.x=Math.min(W-paddle.w,paddle.x+18);started=true;}};
    document.addEventListener('keydown',kh);
    this.on(()=>{document.removeEventListener('keydown',kh);cancelAnimationFrame(raf);});
    init();draw();loop();
  }

  // ==================== 15 PUZZLE ====================
  initPuzzle(){
    const N=4,self=this;
    let tiles,er,ec,moves;
    const se=this.mkS('步数: 0');
    const ge=document.createElement('div');ge.className='puzzle-grid gc-inner';
    const sz=Math.min(Math.floor((innerWidth*.78)/N),78);
    ge.style.cssText=`width:${sz*N+20}px;grid-template-columns:repeat(${N},${sz}px)`;
    this.el.appendChild(ge);

    function init(){
      tiles=[];moves=0;
      for(let i=1;i<N*N;i++)tiles.push(i);tiles.push(0);
      er=N-1;ec=N-1;
      // Shuffle
      for(let i=0;i<500;i++){
        const nb=[];
        if(er>0)nb.push([er-1,ec]);if(er<N-1)nb.push([er+1,ec]);
        if(ec>0)nb.push([er,ec-1]);if(ec<N-1)nb.push([er,ec+1]);
        const[r,c]=pick(nb);
        tiles[er*N+ec]=tiles[r*N+c];tiles[r*N+c]=0;er=r;ec=c;
      }
      if(solved())init();
      se.textContent='步数: 0';render();
    }
    function solved(){for(let i=0;i<N*N-1;i++)if(tiles[i]!==i+1)return false;return true;}
    function render(){
      ge.innerHTML='';
      tiles.forEach((v,i)=>{
        const t=document.createElement('div');
        t.className='puzzle-tile'+(v===0?' empty':'');
        t.style.width=sz+'px';t.style.height=sz+'px';
        t.textContent=v||'';
        if(v!==0){
          t.addEventListener('click',()=>{
            const r=Math.floor(i/N),c=i%N;
            if((r===er&&Math.abs(c-ec)===1)||(c===ec&&Math.abs(r-er)===1)){
              tiles[er*N+ec]=v;tiles[i]=0;er=r;ec=c;moves++;
              se.textContent='步数: '+moves;render();
              if(solved())setTimeout(()=>self.onWin(),350);
            }
          });
        }
        ge.appendChild(t);
      });
    }
    init();
  }

  // ==================== WHACK A MOLE ====================
  initMole(){
    const N=3,TIME=30,GOAL=15,self=this;
    let score,timeLeft,moles,run2,t2,spawnT;
    const se=this.mkS('得分: 0 / 目标: '+GOAL+' · ⏱ '+TIME+'s');
    const ge=document.createElement('div');ge.className='mole-grid gc-inner';
    const sz=Math.min(Math.floor((innerWidth*.78)/N),105);
    ge.style.cssText=`width:${sz*N+16}px;grid-template-columns:repeat(${N},${sz}px)`;
    this.el.appendChild(ge);

    function init(){
      score=0;timeLeft=TIME;run2=true;
      ge.innerHTML='';
      moles=Array(N*N).fill(false);
      for(let i=0;i<N*N;i++){
        const hole=document.createElement('div');hole.className='mole-hole';
        hole.style.width=sz+'px';hole.style.height=sz+'px';
        const mole=document.createElement('div');mole.className='mole';mole.textContent='🐹';
        mole.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();whack(i);});
        hole.appendChild(mole);ge.appendChild(hole);
      }
      se.textContent='得分: 0 / 目标: '+GOAL+' · ⏱ '+TIME+'s';
      t2=setInterval(()=>{
        if(!run2)return;
        timeLeft--;
        se.textContent='得分: '+score+' / 目标: '+GOAL+' · ⏱ '+timeLeft+'s';
        if(timeLeft<=0){clearInterval(t2);run2=false;
          if(score>=GOAL)self.onWin();
          else{clearTimeout(spawnT);goOverlay(ge,'打地鼠',()=>{init();});}
        }
      },1000);
      spawnL();
    }
    function spawnL(){
      if(!run2||!self.alive)return;
      const idx=rnd(0,N*N-1);
      const ml=ge.children[idx].querySelector('.mole');
      ml.classList.add('up');moles[idx]=true;
      const dur=rnd(800,1400);
      setTimeout(()=>{if(moles[idx]){ml.classList.remove('up');moles[idx]=false;}},dur);
      spawnT=setTimeout(spawnL,rnd(250,700));
    }
    function whack(i){
      if(!moles[i]||!run2)return;
      moles[i]=false;
      const ml=ge.children[i].querySelector('.mole');
      ml.classList.remove('up');
      const hole=ge.children[i];hole.classList.add('whacked');setTimeout(()=>hole.classList.remove('whacked'),200);
      score++;se.textContent='得分: '+score+' / 目标: '+GOAL+' · ⏱ '+timeLeft+'s';
      if(score>=GOAL){run2=false;clearInterval(t2);clearTimeout(spawnT);self.onWin();}
    }
    this.on(()=>{clearInterval(t2);clearTimeout(spawnT);run2=false;});
    init();
  }
}

buildFeed();
