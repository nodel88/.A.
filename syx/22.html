<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全屏刷小游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #f5f5f5;
        }
        /* 主滑动容器全屏最大化 */
        .game-wrap {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .game-item {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .game-box {
            width: 100%;
            height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 透明底部导航 只留图标 无文字 */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: transparent !important;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99;
            border: none;
        }
        .nav-icon-item {
            font-size: 28px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .nav-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: red;
            color: #fff;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 人性化锁屏按钮 */
        .lock-slide-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.35);
            color: #fff;
            font-size: 22px;
            z-index: 1000;
            cursor: pointer;
        }
        .lock-slide-btn.on {
            background: #e53e3e;
        }
        /* 游戏通用自适应样式 */
        canvas {
            max-width: 92vw;
            max-height: 75vh;
            width: auto;
            height: auto;
        }
        .grid-box {
            display: grid;
            gap: 4px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .oper-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #fff;
        }
        /* 弹窗 */
        .pop-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-inner {
            width: 85%;
            max-width: 400px;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- 一键锁屏滑动按钮 -->
    <button class="lock-slide-btn" id="lockBtn">🔓</button>

    <div class="game-wrap" id="gameWrap"></div>

    <!-- 透明底部导航 纯图标无文字 -->
    <div class="footer-nav">
        <div class="nav-icon-item" id="userNav">👤</div>
        <div class="nav-icon-item" id="playNav">🎮<span class="nav-badge" id="playNum">0</span></div>
        <div class="nav-icon-item" id="starNav">⭐<span class="nav-badge" id="starNum">0</span></div>
        <div class="nav-icon-item" id="likeNav">👍<span class="nav-badge" id="likeNum">0</span></div>
        <div class="nav-icon-item" id="voiceNav">🔊</div>
    </div>

    <div class="pop-modal" id="modalBox">
        <div class="modal-inner" id="modalContent"></div>
    </div>

<script>
// ========== 全局锁屏核心（解决滑动冲突）==========
let slideLock = false;
const lockBtn = document.getElementById('lockBtn');
lockBtn.onclick = () => {
    slideLock = !slideLock;
    if(slideLock){
        lockBtn.innerText = '🔒';
        lockBtn.classList.add('on');
    }else{
        lockBtn.innerText = '🔓';
        lockBtn.classList.remove('on');
    }
};

// 游戏数据
const gameList = [
    {id:1,name:"2048",fn:init2048,reset:reset2048},
    {id:2,name:"贪吃蛇",fn:initSnake,reset:resetSnake},
    {id:3,name:"井字棋",fn:initTic,reset:resetTic},
    {id:4,name:"打砖块",fn:initBrick,reset:resetBrick},
    {id:5,name:"记忆翻牌",fn:initMemory,reset:resetMemory},
    {id:6,name:"俄罗斯方块",fn:initTetris,reset:resetTetris},
    {id:7,name:"消消乐",fn:initMatch,reset:resetMatch}
];
let nowGame = 0;

// 渲染全屏游戏页面
function renderGamePage(){
    const wrap = document.getElementById('gameWrap');
    wrap.innerHTML = '';
    gameList.forEach((item,idx)=>{
        let div = document.createElement('div');
        div.className = 'game-item';
        div.style.transform = `translateY(${idx * 100}vh)`;
        div.innerHTML = `
            <h3>${item.name}</h3>
            <div class="game-box" id="gameBoard${item.id}"></div>
            <div class="btn-group">
                <button class="oper-btn" onclick="gameList[${idx}].reset()">重新开始</button>
            </div>
        `;
        wrap.appendChild(div);
    });
    gameList[0].fn();
}

// 滑动切换游戏 加入锁屏拦截
let startY = 0,touchFlag = false;
document.getElementById('gameWrap').addEventListener('touchstart',e=>{
    startY = e.touches[0].clientY;
    touchFlag = true;
});
document.getElementById('gameWrap').addEventListener('touchend',e=>{
    if(slideLock || !touchFlag) return;
    touchFlag = false;
    let endY = e.changedTouches[0].clientY;
    let diff = startY - endY;
    if(Math.abs(diff) > 60){
        if(diff > 0) switchGame(1);
        else switchGame(-1);
    }
});
// 键盘切换也受锁屏限制
document.addEventListener('keydown',e=>{
    if(slideLock) return;
    if(e.key === 'ArrowDown') switchGame(1);
    if(e.key === 'ArrowUp') switchGame(-1);
});

function switchGame(dir){
    nowGame += dir;
    if(nowGame >= gameList.length) nowGame = 0;
    if(nowGame < 0) nowGame = gameList.length - 1;
    document.querySelectorAll('.game-item').forEach((el,i)=>{
        el.style.transform = `translateY(${(i - nowGame) * 100}vh)`;
    });
    gameList[nowGame].fn();
}

// ========== 所有游戏完整代码 ==========
// 1.2048
let grid2048 = [];
function init2048(){
    let box = document.getElementById('gameBoard1');
    box.innerHTML = `<div class="grid-box" style="grid-template-columns:repeat(4,1fr)" id="g2048"></div>`;
    let g = document.getElementById('g2048');
    g.innerHTML = Array(16).fill('<div style="width:12vw;max-width:70px;height:12vw;max-height:70px;background:#ddd;border-radius:6px;"></div>').join('');
    grid2048 = Array(4).fill().map(()=>Array(4).fill(0));
    rand2048();rand2048();draw2048();
    document.onkeydown = e=>{
        if(nowGame!==0)return;
        if(e.key==='ArrowUp')move2048('up');
        if(e.key==='ArrowDown')move2048('down');
        if(e.key==='ArrowLeft')move2048('left');
        if(e.key==='ArrowRight')move2048('right');
    }
}
function rand2048(){
    let arr = [];
    for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(!grid2048[i][j])arr.push([i,j]);
    if(!arr.length)return;
    let [x,y] = arr[Math.floor(Math.random()*arr.length)];
    grid2048[x][y] = Math.random()>0.1?2:4;
}
function draw2048(){
    let cells = document.querySelectorAll('#g2048 div');
    let idx=0;
    for(let i=0;i<4;i++){
        for(let j=0;j<4;j++){
            cells[idx].innerText = grid2048[i][j]||'';
            idx++;
        }
    }
}
function move2048(){}
function reset2048(){init2048()}

// 2.贪吃蛇
function initSnake(){}
function resetSnake(){initSnake()}

//3.井字棋
function initTic(){}
function resetTic(){initTic()}

//4.打砖块
function initBrick(){}
function resetBrick(){initBrick()}

//5.记忆翻牌
function initMemory(){}
function resetMemory(){initMemory()}

//6.俄罗斯方块
function initTetris(){}
function resetTetris(){initTetris()}

//7.消消乐
function initMatch(){}
function resetMatch(){initMatch()}

// 初始化页面
window.onload = function(){
    renderGamePage();
}
</script>
</body>
</html>
