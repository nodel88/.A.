<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#faf8ef;}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#bbada0;padding:6px;border-radius:6px;max-width:90vw;max-height:90vh;}
.tile{aspect-ratio:1;background:#cdc1b4;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#776e65;}
.tile[data-value="2"]{background:#eee4da}.tile[data-value="4"]{background:#ede0c8}.tile[data-value="8"]{background:#f2b179;color:#f9f6f2}
</style></head><body><div id="board"></div><script>
let grid=Array(4).fill().map(()=>Array(4).fill(0));
function addRandom(){let empty=[];grid.forEach((r,i)=>r.forEach((v,j)=>{if(v===0)empty.push([i,j])}));if(empty.length){let[i,j]=empty[Math.floor(Math.random()*empty.length)];grid[i][j]=Math.random()<0.9?2:4;}}
function draw(){let b=document.getElementById('board');b.innerHTML='';grid.flat().forEach(v=>{let d=document.createElement('div');d.className='tile';if(v)d.textContent=v,d.dataset.value=v;b.appendChild(d);});}
function move(dir){
  let moved=false;
  let range=[0,1,2,3];
  if(dir==='left'){
    for(let r=0;r<4;r++){
      let row=grid[r].filter(v=>v);
      for(let i=0;i<row.length-1;i++)if(row[i]===row[i+1]){row[i]*=2;row[i+1]=0;}
      row=row.filter(v=>v);while(row.length<4)row.push(0);
      if(row.join(',')!==grid[r].join(','))moved=true;
      grid[r]=row;
    }
  }else if(dir==='right'){
    for(let r=0;r<4;r++){
      let row=grid[r].filter(v=>v);row.reverse();
      for(let i=0;i<row.length-1;i++)if(row[i]===row[i+1]){row[i]*=2;row[i+1]=0;}
      row=row.filter(v=>v);while(row.length<4)row.unshift(0);
      if(row.join(',')!==grid[r].join(','))moved=true;
      grid[r]=row;
    }
  }else if(dir==='up'){
    for(let c=0;c<4;c++){
      let col=[grid[0][c],grid[1][c],grid[2][c],grid[3][c]].filter(v=>v);
      for(let i=0;i<col.length-1;i++)if(col[i]===col[i+1]){col[i]*=2;col[i+1]=0;}
      col=col.filter(v=>v);while(col.length<4)col.push(0);
      for(let r=0;r<4;r++){if(grid[r][c]!==col[r])moved=true;grid[r][c]=col[r];}
    }
  }else if(dir==='down'){
    for(let c=0;c<4;c++){
      let col=[grid[0][c],grid[1][c],grid[2][c],grid[3][c]].filter(v=>v);col.reverse();
      for(let i=0;i<col.length-1;i++)if(col[i]===col[i+1]){col[i]*=2;col[i+1]=0;}
      col=col.filter(v=>v);while(col.length<4)col.unshift(0);
      for(let r=0;r<4;r++){if(grid[r][c]!==col[r])moved=true;grid[r][c]=col[r];}
    }
  }
  if(moved){addRandom();draw();}
}
addRandom();addRandom();draw();
let startX,startY;
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(e.key.slice(5).toLowerCase());}});
document.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;});
document.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');
});
</script></body></html>
