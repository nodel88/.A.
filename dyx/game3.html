<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#70c5ce;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.info{position:fixed;top:16px;left:16px;z-index:2;pointer-events:none}
.title{color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,0.4)}
.desc{color:#fff;font-size:13px;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,0.4)}
.score{color:#fff;font-size:24px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,0.4);margin-top:8px}
.btns{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:2}
.btns button{background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:24px;padding:8px 18px;font-size:16px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<canvas id="c" width="300" height="400"></canvas>
<div class="info">
  <div class="title">🐦 Flappy Bird</div>
  <div class="desc">点击/空格让鸟飞过管道</div>
  <div class="score" id="scoreDisplay">0</div>
</div>
<div class="btns">
  <button id="restartBtn">↺ 重新开始</button>
</div>
<script>
function notifyPlayed() { if (window.parent) window.parent.postMessage({type:'played',gameId:'flappy'},'*'); }
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='flap'){ osc.frequency.setValueAtTime(500,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800,audioCtx.currentTime+0.1); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='hit'){ osc.frequency.setValueAtTime(200,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.5); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5); osc.start(); osc.stop(audioCtx.currentTime+0.5); }
  else if(type==='point'){ osc.frequency.setValueAtTime(700,audioCtx.currentTime); gain.gain.setValueAtTime(0.08,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2); osc.start(); osc.stop(audioCtx.currentTime+0.2); }
}
let musicInterval=null;
function startMusic(){
  if(musicInterval) return;
  const notes=[392,440,494,523,494,440,392,349];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.02,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.5);
    i++;
  },700);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function showVictory(){
  const div=document.createElement('div'); div.id='victoryOverlay';
  div.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;';
  document.body.appendChild(div);
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    div.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.textContent='🎉 恭喜通关！';
  txt.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff0;';
  div.appendChild(txt);
  setTimeout(()=>{ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); },3000);
}
function removeVictory(){ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); }

const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=300,H=400;
let bird,pipes,score,gameover,winTriggered=false;
function reset(){
  bird={x:60,y:200,vy:0}; pipes=[]; score=0; gameover=false; winTriggered=false;
  addPipe(); stopMusic(); startMusic(); removeVictory(); notifyPlayed();
}
function addPipe(){ pipes.push({x:W, y:Math.random()*200+50, scored:false}); }
function draw(){
  ctx.clearRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#4dc9f6'); grad.addColorStop(1,'#a0e9ff');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  if(!gameover){
    bird.vy+=0.5; bird.y+=bird.vy;
    if(bird.y<0 || bird.y>H-20){ gameover=true; playSound('hit'); stopMusic(); }
    pipes.forEach(p=>p.x-=2);
    pipes=pipes.filter(p=>p.x>-40);
    if(pipes.length===0||pipes[pipes.length-1].x<W-120) addPipe();
    pipes.forEach(p=>{
      if(!p.scored && p.x+30<bird.x){ p.scored=true; score++; playSound('point'); }
      if(bird.x+18>p.x && bird.x<p.x+30 && (bird.y<p.y || bird.y+18>p.y+80)){ gameover=true; playSound('hit'); stopMusic(); }
    });
    if(score>=10 && !winTriggered){ winTriggered=true; gameover=true; stopMusic(); showVictory(); setTimeout(reset,3000); }
  }
  pipes.forEach(p=>{ ctx.fillStyle='#73c259'; ctx.shadowColor='#2d5a1e'; ctx.shadowBlur=6; ctx.fillRect(p.x,0,30,p.y); ctx.fillRect(p.x,p.y+80,30,H-p.y-80); });
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffcc00'; ctx.shadowColor='#b38600'; ctx.shadowBlur=8; ctx.fillRect(bird.x,bird.y,18,18); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 36px system-ui'; ctx.fillText(score, W/2-15, 60);
  if(gameover && !winTriggered){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.font='bold 24px system-ui'; ctx.textAlign='center';
    ctx.fillText('游戏结束',W/2, H/2-10); ctx.fillText('得分:'+score, W/2, H/2+30); ctx.textAlign='left';
  }
  document.getElementById('scoreDisplay').textContent=score;
  requestAnimationFrame(draw);
}
document.addEventListener('keydown',(e)=>{ initAudio(); if(e.code==='Space'){ if(gameover) reset(); else bird.vy=-6; playSound('flap'); } });
c.addEventListener('touchstart',()=>{ initAudio(); if(gameover) reset(); else bird.vy=-6; playSound('flap'); });
document.getElementById('restartBtn').onclick=reset;
reset(); draw();
</script>
</body>
</html>
