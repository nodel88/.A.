<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>游戏流</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    /* 顶部用户栏 */
    .user-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      padding: 8px 16px; display: flex; align-items: center; justify-content: space-between;
      color: #fff; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .user-name { font-weight: bold; color: #ffd700; margin-right: 12px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stats { display: flex; gap: 12px; }
    .stat-item { cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 12px; display: flex; align-items: center; gap: 4px; font-size: 13px; transition: 0.2s; }
    .stat-item:active { background: rgba(255,255,255,0.2); }
    .stat-num { font-weight: 700; color: #0ff; }
    /* 列表弹出层 */
    .popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
      z-index: 200; display: none; justify-content: center; align-items: center;
    }
    .popup-overlay.active { display: flex; }
    .popup-panel {
      background: #1e1e2e; border-radius: 16px; padding: 20px; width: 90%; max-width: 400px;
      max-height: 70vh; overflow-y: auto; color: #fff;
    }
    .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .popup-header h3 { font-size: 20px; }
    .close-btn { font-size: 24px; cursor: pointer; color: #ff5555; }
    .game-entry { display: flex; justify-content: space-between; align-items: center; background: #2a2a3a; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .game-entry .name { font-size: 16px; }
    .game-entry .actions { display: flex; gap: 8px; }
    .game-entry button { background: #444; color: #fff; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
    .game-entry button.del { background: #c0392b; }
    .game-entry button.add { background: #27ae60; }
    .empty { color: #aaa; text-align: center; padding: 20px; }

    /* 滑动容器 */
    .container { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; padding-top: 44px; }
    .slide { scroll-snap-align: start; height: calc(100vh - 44px); width: 100vw; position: relative; }
    .slide iframe { width: 100%; height: 100%; border: none; }
    .actions { position: absolute; right: 12px; bottom: 80px; display: flex; flex-direction: column; gap: 20px; z-index: 10; pointer-events: none; }
    .btn {
      width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; user-select: none; color: #fff; transition: 0.15s; pointer-events: auto;
      line-height: 1; border: 1px solid rgba(255,255,255,0.15);
    }
    .btn span { font-size: 10px; margin-top: -1px; font-weight: 600; }
    .btn.liked { color: #ff4d4f; background: rgba(255,77,79,0.15); }
    .btn.collected { color: #ffc107; background: rgba(255,193,7,0.15); }
    .btn.full { opacity: 0.5; }
  </style>
</head>
<body>
  <!-- 用户栏 -->
  <div class="user-bar" id="userBar">
    <span class="user-name" id="usernameDisplay">🎮 旅行者</span>
    <div class="stats">
      <div class="stat-item" id="statPlayed">🎮 <span class="stat-num" id="playedCount">0</span></div>
      <div class="stat-item" id="statFav">⭐ <span class="stat-num" id="favCount">0</span></div>
      <div class="stat-item" id="statLike">❤️ <span class="stat-num" id="likeTotalCount">0</span></div>
    </div>
  </div>

  <!-- 弹出列表 -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-panel">
      <div class="popup-header">
        <h3 id="popupTitle">已玩游戏</h3>
        <span class="close-btn" id="closePopup">✕</span>
      </div>
      <div id="popupContent"></div>
    </div>
  </div>

  <!-- 游戏滑动区 -->
  <div class="container" id="container"></div>

  <script>
    // ========== 游戏配置 ==========
    const games = [
      { id: 'snake',    title: '贪吃蛇',     src: 'game1.html' },
      { id: 'breakout', title: '打砖块',     src: 'game2.html' },
      { id: 'flappy',   title: 'Flappy Bird',src: 'game3.html' },
      { id: '2048',     title: '2048',       src: 'game4.html' },
      { id: 'memory',   title: '记忆翻牌',   src: 'game5.html' },
      { id: 'tictactoe',title: '井字棋',     src: 'game6.html' },
      { id: 'guess',    title: '猜数字',     src: 'game7.html' }
    ];

    // ========== 用户与数据管理 ==========
    const STORAGE_USER = 'username';
    const STORAGE_PLAYED_PREFIX = 'played_';
    const STORAGE_FAV = 'favs';
    const STORAGE_LIKE_PREFIX = 'like_';

    function randomUsername() {
      const adj = ['快乐','勇敢','闪亮','神秘','悠闲','酷酷','萌萌','飞翔','超级','小小'];
      const noun = ['玩家','小猫','狐狸','熊猫','海豚','星星','月亮','闪电','泡泡','糖果'];
      return adj[Math.floor(Math.random()*adj.length)] + noun[Math.floor(Math.random()*noun.length)];
    }

    function getUsername() {
      let name = localStorage.getItem(STORAGE_USER);
      if (!name) {
        name = randomUsername();
        localStorage.setItem(STORAGE_USER, name);
      }
      return name;
    }

    function getPlayedList() {
      const list = [];
      for (let i=0; i<localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith(STORAGE_PLAYED_PREFIX) && localStorage.getItem(key) === 'true') {
          list.push(key.replace(STORAGE_PLAYED_PREFIX, ''));
        }
      }
      return list;
    }

    function addPlayed(gameId) {
      localStorage.setItem(STORAGE_PLAYED_PREFIX + gameId, 'true');
    }

    function removePlayed(gameId) {
      localStorage.removeItem(STORAGE_PLAYED_PREFIX + gameId);
    }

    function getFavs() {
      try { return JSON.parse(localStorage.getItem(STORAGE_FAV)) || []; } catch(e) { return []; }
    }

    function saveFavs(arr) { localStorage.setItem(STORAGE_FAV, JSON.stringify(arr)); }

    function isCollected(gameId) { return getFavs().includes(gameId); }

    function toggleCollect(gameId) {
      const favs = getFavs();
      const idx = favs.indexOf(gameId);
      if (idx > -1) { favs.splice(idx, 1); saveFavs(favs); return false; }
      else { favs.push(gameId); saveFavs(favs); return true; }
    }

    function getLikeCount(gameId) {
      const val = localStorage.getItem(STORAGE_LIKE_PREFIX + gameId);
      return val ? parseInt(val, 10) : 0;
    }

    function setLikeCount(gameId, count) {
      if (count < 0) count = 0;
      if (count > 999) count = 999;
      localStorage.setItem(STORAGE_LIKE_PREFIX + gameId, count);
    }

    function addLike(gameId) {
      let count = getLikeCount(gameId);
      if (count >= 999) return false;
      setLikeCount(gameId, count + 1);
      return true;
    }

    function removeOneLike(gameId) {
      let count = getLikeCount(gameId);
      if (count <= 0) return;
      setLikeCount(gameId, count - 1);
    }

    function clearLikes(gameId) {
      localStorage.removeItem(STORAGE_LIKE_PREFIX + gameId);
    }

    // ========== UI 更新 ==========
    function updateUI() {
      document.getElementById('usernameDisplay').textContent = getUsername();
      const played = getPlayedList();
      const favs = getFavs();
      let totalLikes = 0;
      games.forEach(g => { totalLikes += getLikeCount(g.id); });
      document.getElementById('playedCount').textContent = played.length;
      document.getElementById('favCount').textContent = favs.length;
      document.getElementById('likeTotalCount').textContent = totalLikes;

      // 更新当前可见游戏的按钮状态
      const visibleSlide = document.querySelector('.slide[data-visible="true"]');
      if (visibleSlide) {
        const gameId = visibleSlide.dataset.gameId;
        const likeCount = getLikeCount(gameId);
        const likeBtn = visibleSlide.querySelector('.like-btn');
        const collectBtn = visibleSlide.querySelector('.collect-btn');
        if (likeBtn) {
          likeBtn.querySelector('span').textContent = likeCount;
          likeBtn.classList.toggle('liked', likeCount > 0);
          likeBtn.classList.toggle('full', likeCount >= 999);
        }
        if (collectBtn) {
          collectBtn.classList.toggle('collected', isCollected(gameId));
        }
      }
    }

    // ========== 滑动容器生成 ==========
    const container = document.getElementById('container');
    games.forEach(g => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.gameId = g.id;
      slide.innerHTML = `
        <iframe src="${g.src}" scrolling="no"></iframe>
        <div class="actions">
          <div class="btn like-btn" data-game-id="${g.id}">❤️<span>0</span></div>
          <div class="btn collect-btn" data-game-id="${g.id}">⭐</div>
        </div>
      `;
      container.appendChild(slide);
    });

    // ========== 监听 iframe 消息（记录已玩） ==========
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'played' && e.data.gameId) {
        addPlayed(e.data.gameId);
        updateUI();
      }
    });

    // ========== 当前可见游戏标识 ==========
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        entry.target.dataset.visible = entry.isIntersecting ? 'true' : 'false';
        if (entry.isIntersecting) updateUI();
      });
    }, { threshold: 0.6 });
    document.querySelectorAll('.slide').forEach(s => observer.observe(s));

    // ========== 按钮点击事件 ==========
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.like-btn, .collect-btn');
      if (btn) {
        const gameId = btn.dataset.gameId;
        if (btn.classList.contains('like-btn')) {
          const current = getLikeCount(gameId);
          if (current < 999) {
            addLike(gameId);
            // 震动反馈（如有）
            if (navigator.vibrate) navigator.vibrate(10);
          } else {
            alert('点赞已达上限 999 ❤️');
          }
          updateUI();
        } else {
          toggleCollect(gameId);
          updateUI();
        }
      }
    });

    // ========== 弹出列表相关 ==========
    const overlay = document.getElementById('popupOverlay');
    const popupTitle = document.getElementById('popupTitle');
    const popupContent = document.getElementById('popupContent');
    const closeBtn = document.getElementById('closePopup');

    function showPopup(type) {
      overlay.classList.add('active');
      if (type === 'played') {
        popupTitle.textContent = '已玩游戏';
        renderPlayedList();
      } else if (type === 'fav') {
        popupTitle.textContent = '已收藏游戏';
        renderFavList();
      } else if (type === 'like') {
        popupTitle.textContent = '已点赞游戏';
        renderLikeList();
      }
    }

    function renderPlayedList() {
      const list = getPlayedList();
      if (list.length === 0) {
        popupContent.innerHTML = '<div class="empty">还没有玩过任何游戏</div>';
        return;
      }
      let html = '';
      list.forEach(id => {
        const game = games.find(g => g.id === id);
        const name = game ? game.title : id;
        html += `<div class="game-entry">
          <span class="name">${name}</span>
          <div class="actions">
            <button class="del" onclick="removePlayed('${id}'); updateUI(); renderPlayedList();">删除记录</button>
          </div>
        </div>`;
      });
      popupContent.innerHTML = html;
    }

    function renderFavList() {
      const favs = getFavs();
      if (favs.length === 0) {
        popupContent.innerHTML = '<div class="empty">还没有收藏任何游戏</div>';
        return;
      }
      let html = '';
      favs.forEach(id => {
        const game = games.find(g => g.id === id);
        const name = game ? game.title : id;
        html += `<div class="game-entry">
          <span class="name">${name}</span>
          <div class="actions">
            <button class="del" onclick="toggleCollect('${id}'); updateUI(); renderFavList();">取消收藏</button>
          </div>
        </div>`;
      });
      popupContent.innerHTML = html;
    }

    function renderLikeList() {
      let hasLike = false;
      let html = '';
      games.forEach(g => {
        const count = getLikeCount(g.id);
        if (count > 0) {
          hasLike = true;
          html += `<div class="game-entry">
            <span class="name">${g.title} ❤️ ${count}</span>
            <div class="actions">
              <button class="add" onclick="addLike('${g.id}'); updateUI(); renderLikeList();">+1</button>
              <button class="del" onclick="removeOneLike('${g.id}'); updateUI(); renderLikeList();">-1</button>
              <button class="del" onclick="clearLikes('${g.id}'); updateUI(); renderLikeList();">清空</button>
            </div>
          </div>`;
        }
      });
      if (!hasLike) html = '<div class="empty">还没有点赞任何游戏</div>';
      popupContent.innerHTML = html;
    }

    closeBtn.addEventListener('click', () => overlay.classList.remove('active'));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('active');
    });

    document.getElementById('statPlayed').addEventListener('click', () => showPopup('played'));
    document.getElementById('statFav').addEventListener('click', () => showPopup('fav'));
    document.getElementById('statLike').addEventListener('click', () => showPopup('like'));

    // 初始化
    updateUI();
  </script>
</body>
</html>
