<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>游戏流</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    .container {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .slide {
      scroll-snap-align: start;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    .slide iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 10;
    }
    .btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
      color: #fff;
      transition: 0.2s;
    }
    .btn.liked { color: #ff4d4f; }
    .btn.collected { color: #ffc107; }
  </style>
</head>
<body>
  <div class="container" id="container"></div>

  <script>
    // 游戏配置（全部本地文件）
    const games = [
      { id: 'snake',    title: '贪吃蛇',   src: 'game1.html' },
      { id: 'breakout', title: '打砖块',   src: 'game2.html' },
      { id: 'flappy',   title: 'Flappy Bird', src: 'game3.html' },
      { id: '2048',     title: '2048',     src: 'game4.html' },
      { id: 'memory',   title: '记忆翻牌', src: 'game5.html' },
      { id: 'tictactoe',title: '井字棋',   src: 'game6.html' },
      { id: 'guess',    title: '猜数字',   src: 'game7.html' }
    ];

    const container = document.getElementById('container');
    games.forEach(g => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.innerHTML = `
        <iframe src="${g.src}" scrolling="no"></iframe>
        <div class="actions">
          <div class="btn like-btn" data-game-id="${g.id}">❤️</div>
          <div class="btn collect-btn" data-game-id="${g.id}">⭐</div>
        </div>
      `;
      container.appendChild(slide);
    });

    // ---------- localStorage 操作 ----------
    const LIKE_PREFIX = 'like_';
    const FAV_KEY = 'favorites';

    function isLiked(id) { return localStorage.getItem(LIKE_PREFIX + id) === 'true'; }
    function toggleLike(id) { const v = !isLiked(id); localStorage.setItem(LIKE_PREFIX + id, v); return v; }
    function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) { return []; } }
    function saveFavs(arr) { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }
    function isCollected(id) { return getFavs().includes(id); }
    function toggleCollect(id) {
      const favs = getFavs();
      const idx = favs.indexOf(id);
      if (idx > -1) { favs.splice(idx, 1); saveFavs(favs); return false; }
      else { favs.push(id); saveFavs(favs); return true; }
    }

    function updateButtons(gameId) {
      const slide = document.querySelector(`.slide[data-game-id="${gameId}"]`);
      if (!slide) return;
      slide.querySelector('.like-btn').classList.toggle('liked', isLiked(gameId));
      slide.querySelector('.collect-btn').classList.toggle('collected', isCollected(gameId));
    }

    // 给每个 slide 加 data-game-id 以便按钮查找
    document.querySelectorAll('.slide').forEach((slide, i) => {
      slide.setAttribute('data-game-id', games[i].id);
    });

    document.addEventListener('click', e => {
      const btn = e.target.closest('.like-btn, .collect-btn');
      if (!btn) return;
      const gameId = btn.dataset.gameId;
      if (btn.classList.contains('like-btn')) toggleLike(gameId);
      else toggleCollect(gameId);
      updateButtons(gameId);
    });

    // 初始刷新当前可见按钮（有点复杂，用 IntersectionObserver 简化）
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const gameId = entry.target.dataset.gameId;
          updateButtons(gameId);
        }
      });
    }, { threshold: 0.6 });
    document.querySelectorAll('.slide').forEach(s => observer.observe(s));
  </script>
</body>
</html>
