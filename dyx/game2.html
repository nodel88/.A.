<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;}
canvas{background:#000;display:block;max-width:100%;max-height:100%;}
</style></head><body><canvas id="c" width="400" height="500"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let paddle={x:160,w:80},ball={x:200,y:400,r:5,dx:2,dy:-2};
let bricks=[],score=0;
for(let i=0;i<5;i++)for(let j=0;j<8;j++)bricks.push({x:j*50+2,y:i*20+2,w:46,h:16,alive:true});
function draw(){
  ctx.clearRect(0,0,400,500);
  ctx.fillStyle='#fff';ctx.fillRect(paddle.x,480,paddle.w,10);
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x-ball.r<0||ball.x+ball.r>400)ball.dx*=-1;
  if(ball.y-ball.r<0)ball.dy*=-1;
  if(ball.y+ball.r>500){ball.x=200;ball.y=400;ball.dx=2;ball.dy=-2;score=0;bricks.forEach(b=>b.alive=true);}
  if(ball.y+ball.r>480&&ball.y-ball.r<490&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w)ball.dy*=-1;
  bricks.forEach(b=>{
    if(b.alive&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      ball.dy*=-1;b.alive=false;score++;
    }
  });
  ctx.fillStyle='red';bricks.forEach(b=>{if(b.alive)ctx.fillRect(b.x,b.y,b.w,b.h);});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.fillText('得分:'+score,5,15);
  requestAnimationFrame(draw);
}
c.addEventListener('mousemove',e=>paddle.x=Math.min(320,Math.max(0,e.offsetX-paddle.w/2)));
c.addEventListener('touchmove',e=>{e.preventDefault();paddle.x=Math.min(320,Math.max(0,e.touches[0].clientX-c.getBoundingClientRect().left-paddle.w/2));});
draw();
</script></body></html>
