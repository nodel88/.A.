<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.info{position:fixed;top:16px;left:16px;z-index:2;pointer-events:none}
.title{color:#0ff;font-size:28px;font-weight:900;text-shadow:0 0 12px #0ff}
.desc{color:#aaa;font-size:13px;margin-top:4px}
.score{color:#0ff;font-size:24px;font-weight:700;text-shadow:0 0 12px #0ff;margin-top:8px}
.btns{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:2}
.btns button{background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:8px 16px;font-size:15px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<div class="info">
  <div class="title">🧱 打砖块</div>
  <div class="desc">移动鼠标/手指接住球打碎砖块</div>
  <div class="score" id="scoreDisplay">得分 0</div>
</div>
<div class="btns">
  <button id="pauseBtn">⏯️ 暂停</button>
  <button id="restartBtn">↺ 重新开始</button>
</div>
<script>
function notifyPlayed() { if (window.parent) window.parent.postMessage({type:'played',gameId:'breakout'},'*'); }
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='hit'){ osc.frequency.setValueAtTime(800,audioCtx.currentTime); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='die'){ osc.frequency.setValueAtTime(300,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80,audioCtx.currentTime+0.4); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); osc.start(); osc.stop(audioCtx.currentTime+0.4); }
  else if(type==='win'){ osc.type='square'; osc.frequency.setValueAtTime(523,audioCtx.currentTime); gain.gain.setValueAtTime(0.15,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5); osc.start(); osc.stop(audioCtx.currentTime+0.5); }
}
let musicInterval=null;
function startMusic(){
  if(musicInterval) return;
  const notes=[330,392,440,494,440,392,330,294];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.02,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.4);
    i++;
  },600);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function showVictory(){
  const div=document.createElement('div'); div.id='victoryOverlay';
  div.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;';
  document.body.appendChild(div);
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    div.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.textContent='🎉 恭喜通关！';
  txt.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff0;';
  div.appendChild(txt);
  setTimeout(()=>{ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); },3000);
}
function removeVictory(){ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); }

const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=400,H=600;
let paddle,ball,bricks,score,paused,running,winTriggered=false;
function createBricks(){ bricks=[]; for(let i=0;i<5;i++)for(let j=0;j<8;j++)bricks.push({x:j*50+2,y:i*20+40,w:46,h:16,alive:true}); }
function reset(){
  createBricks(); ball={x:200,y:500,r:6,dx:2.5,dy:-2.5}; paddle={x:160,w:80}; score=0; paused=false; running=true; winTriggered=false;
  document.getElementById('pauseBtn').textContent='⏯️ 暂停';
  stopMusic(); startMusic(); removeVictory(); notifyPlayed();
}
function togglePause(){ paused=!paused; document.getElementById('pauseBtn').textContent=paused?'▶️ 继续':'⏯️ 暂停'; }
function checkWin(){ if(bricks.every(b=>!b.alive) && !winTriggered){ winTriggered=true; running=false; stopMusic(); playSound('win'); showVictory(); setTimeout(reset,3000); } }
function draw(){
  if(!running) return;
  if(!paused){
    ball.x+=ball.dx; ball.y+=ball.dy;
    if(ball.x-ball.r<0||ball.x+ball.r>W) ball.dx*=-1;
    if(ball.y-ball.r<0) ball.dy*=-1;
    if(ball.y+ball.r>H){ running=false; playSound('die'); alert('游戏结束！得分:'+score); reset(); return; }
    if(ball.y+ball.r>580 && ball.y-ball.r<595 && ball.x>paddle.x && ball.x<paddle.x+paddle.w) ball.dy*=-1;
    bricks.forEach(b=>{
      if(b.alive && ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
        ball.dy*=-1; b.alive=false; score++; playSound('hit'); checkWin();
      }
    });
  }
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  bricks.forEach(b=>{ if(b.alive){ const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h); grad.addColorStop(0,'#ff007f'); grad.addColorStop(1,'#7f00ff'); ctx.fillStyle=grad; ctx.shadowColor='#ff00ff'; ctx.shadowBlur=6; ctx.fillRect(b.x,b.y,b.w,b.h); } });
  ctx.shadowBlur=0;
  ctx.fillStyle='#0ff'; ctx.shadowColor='#0ff'; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=10; ctx.fillRect(paddle.x,585,paddle.w,10); ctx.shadowBlur=0;
  document.getElementById('scoreDisplay').textContent='得分 '+score;
  requestAnimationFrame(draw);
}
c.addEventListener('mousemove',e=>{ initAudio(); const rect=c.getBoundingClientRect(); paddle.x=Math.min(W-paddle.w,Math.max(0,(e.clientX-rect.left)*(W/rect.width)-paddle.w/2)); });
c.addEventListener('touchmove',e=>{ e.preventDefault(); initAudio(); const rect=c.getBoundingClientRect(); paddle.x=Math.min(W-paddle.w,Math.max(0,(e.touches[0].clientX-rect.left)*(W/rect.width)-paddle.w/2)); });
document.getElementById('restartBtn').onclick=reset;
document.getElementById('pauseBtn').onclick=togglePause;
reset(); draw();
</script>
</body>
</html>
