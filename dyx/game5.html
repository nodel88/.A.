<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1025;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui}
.info{text-align:center;margin-bottom:8px}
.title{font-size:32px;font-weight:900;color:#c084fc}
.desc{font-size:14px;color:#a78bfa}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:90vmin;height:90vmin;max-width:500px;max-height:500px}
.card{aspect-ratio:1;background:#3a2a4a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:5vmin;cursor:pointer;transition:0.15s;color:#fff}
.card.flipped{background:#c084fc;color:#1a1025}
.controls{margin-top:12px}
.controls button{background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:12px 24px;font-size:18px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="info">
  <div class="title">🧠 记忆翻牌</div>
  <div class="desc">点击翻开卡片，找出相同的配对</div>
</div>
<div class="grid" id="grid"></div>
<div class="controls">
  <button id="restartBtn">↺ 重新开始</button>
</div>
<script>
function notifyPlayed() { if (window.parent) window.parent.postMessage({type:'played',gameId:'memory'},'*'); }
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='flip'){ osc.frequency.setValueAtTime(600,audioCtx.currentTime); gain.gain.setValueAtTime(0.08,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='match'){ osc.frequency.setValueAtTime(800,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200,audioCtx.currentTime+0.2); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.2); osc.start(); osc.stop(audioCtx.currentTime+0.2); }
  else if(type==='wrong'){ osc.frequency.setValueAtTime(200,audioCtx.currentTime); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3); osc.start(); osc.stop(audioCtx.currentTime+0.3); }
  else if(type==='win'){ osc.type='triangle'; osc.frequency.setValueAtTime(660,audioCtx.currentTime); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.8); osc.start(); osc.stop(audioCtx.currentTime+0.8); }
}
let musicInterval=null;
function startMusic(){
  if(musicInterval) return;
  const notes=[494,440,392,349,330,294,262,294];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.02,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.6);
    i++;
  },900);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function showVictory(){
  const div=document.createElement('div'); div.id='victoryOverlay';
  div.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;';
  document.body.appendChild(div);
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    div.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.textContent='🎉 恭喜通关！';
  txt.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff0;';
  div.appendChild(txt);
  setTimeout(()=>{ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); },3000);
}
function removeVictory(){ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); }

const emojis=['🍎','🍊','🍋','🍇','🍓','🍒','🥝','🍑'];
let cards, flipped=[], matched=[], lock=false;
function init(){
  cards=[...emojis,...emojis].sort(()=>Math.random()-0.5);
  flipped=[]; matched=[]; lock=false;
  stopMusic(); startMusic(); removeVictory(); notifyPlayed();
  draw();
}
function draw(){
  const g=document.getElementById('grid'); g.innerHTML='';
  cards.forEach((v,i)=>{
    const d=document.createElement('div'); d.className='card'+(flipped.includes(i)||matched.includes(i)?' flipped':'');
    d.textContent=(flipped.includes(i)||matched.includes(i))?v:'?';
    d.onclick=()=>flip(i); g.appendChild(d);
  });
}
function flip(i){
  initAudio();
  if(lock||flipped.includes(i)||matched.includes(i)||flipped.length===2) return;
  playSound('flip'); flipped.push(i); draw();
  if(flipped.length===2){
    lock=true;
    const [a,b]=flipped;
    if(cards[a]===cards[b]){
      matched.push(a,b); flipped=[]; lock=false; draw(); playSound('match');
      if(matched.length===cards.length){ stopMusic(); playSound('win'); showVictory(); setTimeout(init,3000); }
    }else{ setTimeout(()=>{ flipped=[]; lock=false; draw(); playSound('wrong'); },800); }
  }
}
document.getElementById('restartBtn').onclick=init;
init();
</script>
</body>
</html>
