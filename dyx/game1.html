<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.info{position:fixed;top:16px;left:16px;z-index:2;pointer-events:none}
.title{color:#ffd700;font-size:28px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,0.6)}
.desc{color:#aaa;font-size:13px;margin-top:4px}
.score{color:#ffd700;font-size:24px;font-weight:700;margin-top:8px;text-shadow:0 2px 8px rgba(0,0,0,0.6)}
.btns{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:2}
.btns button{background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:8px 16px;font-size:15px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<canvas id="c" width="300" height="300"></canvas>
<div class="info">
  <div class="title">🐍 贪吃蛇</div>
  <div class="desc">方向键/滑动控制蛇吃食物</div>
  <div class="score" id="scoreDisplay">得分 0</div>
</div>
<div class="btns">
  <button id="pauseBtn">⏯️ 暂停</button>
  <button id="restartBtn">↺ 重新开始</button>
</div>
<script>
// 发送已玩消息给父页面
function notifyPlayed() {
  if (window.parent && window.parent.postMessage) {
    window.parent.postMessage({ type: 'played', gameId: 'snake' }, '*');
  }
}
// 音频引擎等（同之前，略）
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='eat'){ osc.frequency.setValueAtTime(600,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(900,audioCtx.currentTime+0.1); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='die'){ osc.frequency.setValueAtTime(400,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+0.4); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); osc.start(); osc.stop(audioCtx.currentTime+0.4); }
}
let musicInterval=null;
function startMusic(){
  if(musicInterval) return;
  const notes=[262,294,330,349,392,349,330,294];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.03,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
    i++;
  },500);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function showVictory(){
  const div=document.createElement('div'); div.id='victoryOverlay';
  div.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;';
  document.body.appendChild(div);
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    div.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800+Math.random()*600,delay:Math.random()*300,easing:'ease-out',fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.textContent='🎉 恭喜通关！';
  txt.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff0;';
  div.appendChild(txt);
  setTimeout(()=>{ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); },3000);
}
function removeVictory(){ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); }

const c=document.getElementById('c'),ctx=c.getContext('2d');
const GRID=20,W=300,H=300;
let snake,dx,dy,food,score,running,paused,winTriggered=false;
function randFood(){
  let ok=false;
  while(!ok){
    let x=Math.floor(Math.random()*GRID),y=Math.floor(Math.random()*GRID);
    if(!snake.some(s=>s.x===x&&s.y===y)){ food={x,y}; ok=true; }
  }
}
function reset(){
  snake=[{x:10,y:10}]; dx=1;dy=0;score=0;randFood();paused=false;running=true;winTriggered=false;
  document.getElementById('pauseBtn').textContent='⏯️ 暂停';
  stopMusic();startMusic();
  removeVictory();
  notifyPlayed(); // 记录已玩
}
function togglePause(){ paused=!paused; document.getElementById('pauseBtn').textContent=paused?'▶️ 继续':'⏯️ 暂停'; }
function gameOver(){ running=false; playSound('die'); stopMusic(); alert('游戏结束！得分:'+score); reset(); }
function checkWin(){ if(score>=10 && !winTriggered){ winTriggered=true; running=false; stopMusic(); showVictory(); setTimeout(reset,3000); } }
function loop(){
  if(!running||paused){ requestAnimationFrame(loop); return; }
  const head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){ gameOver(); return; }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){ score++;randFood();playSound('eat');checkWin(); } else{ snake.pop(); }
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=0.5;
  for(let i=0;i<=GRID;i++){ ctx.beginPath(); ctx.moveTo(i*W/GRID,0); ctx.lineTo(i*W/GRID,H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*H/GRID); ctx.lineTo(W,i*H/GRID); ctx.stroke(); }
  ctx.fillStyle='#ff4d4f'; ctx.shadowColor='#ff4d4f'; ctx.shadowBlur=10;
  ctx.fillRect(food.x*W/GRID+2,food.y*H/GRID+2,W/GRID-4,H/GRID-4); ctx.shadowBlur=0;
  snake.forEach((s,i)=>{ ctx.fillStyle=`rgba(0,255,180,${1-i*0.02})`; ctx.fillRect(s.x*W/GRID+2,s.y*H/GRID+2,W/GRID-4,H/GRID-4); });
  document.getElementById('scoreDisplay').textContent='得分 '+score;
  requestAnimationFrame(loop);
}
reset();
document.getElementById('restartBtn').onclick=reset;
document.getElementById('pauseBtn').onclick=togglePause;
document.addEventListener('keydown',e=>{
  initAudio();
  if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1;}else if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1;}
  else if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0;}else if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0;}
});
let tx=0,ty=0;
c.addEventListener('touchstart',e=>{ initAudio(); tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
c.addEventListener('touchend',e=>{
  const dx2=e.changedTouches[0].clientX-tx,dy2=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx2)>Math.abs(dy2)){ if(dx2>0&&dx===0){dx=1;dy=0;}else if(dx2<0&&dx===0){dx=-1;dy=0;} }
  else{ if(dy2>0&&dy===0){dx=0;dy=1;}else if(dy2<0&&dy===0){dx=0;dy=-1;} }
});
loop();
</script>
</body>
</html>
