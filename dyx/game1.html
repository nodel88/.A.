<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;}
canvas{background:#222;display:block;max-width:100%;max-height:100%;}
</style></head><body><canvas id="c" width="300" height="300"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let snake=[{x:10,y:10}],dx=1,dy=0,food={},score=0;
function randFood(){food={x:Math.floor(Math.random()*30),y:Math.floor(Math.random()*30)};}
randFood();
function loop(){
  const head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<0||head.x>=30||head.y<0||head.y>=30||snake.some(s=>s.x===head.x&&s.y===head.y)){
    snake=[{x:10,y:10}];dx=1;dy=0;score=0;randFood();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score++;randFood();}else{snake.pop();}
  ctx.fillStyle='#222';ctx.fillRect(0,0,300,300);
  ctx.fillStyle='red';ctx.fillRect(food.x*10,food.y*10,10,10);
  ctx.fillStyle='lime';snake.forEach(s=>ctx.fillRect(s.x*10,s.y*10,10,10));
  ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText('得分:'+score,5,15);
}
setInterval(loop,120);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1;}else if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1;}
  else if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0;}else if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0;}
});
let tx=0,ty=0;
c.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
c.addEventListener('touchend',e=>{
  const dx2=e.changedTouches[0].clientX-tx,dy2=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx2)>Math.abs(dy2)){if(dx2>0&&dx===0){dx=1;dy=0;}else if(dx2<0&&dx===0){dx=-1;dy=0;}}
  else{if(dy2>0&&dy===0){dx=0;dy=1;}else if(dy2<0&&dy===0){dx=0;dy=-1;}}
});
</script></body></html>
