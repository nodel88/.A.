<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1120;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:system-ui;color:#e2e8f0}
.info{text-align:center;margin-bottom:8px}
.title{font-size:8vmin;font-weight:900;color:#38bdf8}
.desc{font-size:4vmin;color:#94a3b8}
input{padding:12px;font-size:5vmin;width:60%;max-width:300px;text-align:center;border-radius:12px;border:2px solid #334155;background:#1e293b;color:#fff;outline:none;margin:12px 0}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{padding:12px 24px;font-size:5vmin;border-radius:12px;border:none;font-weight:700;cursor:pointer;transition:0.1s}
#checkBtn{background:#3b82f6;color:#fff}
#restartBtn{background:#475569;color:#fff}
#hint{font-size:5vmin;margin-top:8px;color:#94a3b8}
#count{font-size:4vmin;color:#64748b}
</style>
</head>
<body>
<div class="info">
  <div class="title">🔢 猜数字</div>
  <div class="desc">输入1~100之间的数字，猜中即可</div>
</div>
<input type="number" id="guess" min="1" max="100" placeholder="输入数字">
<div class="btns">
  <button id="checkBtn">🎯 猜</button>
  <button id="restartBtn">↺ 重新开始</button>
</div>
<p id="hint"></p>
<p id="count"></p>
<script>
function notifyPlayed() { if (window.parent) window.parent.postMessage({type:'played',gameId:'guess'},'*'); }
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='guess'){ osc.frequency.setValueAtTime(500,audioCtx.currentTime); gain.gain.setValueAtTime(0.08,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  else if(type==='win'){ osc.type='triangle'; osc.frequency.setValueAtTime(523,audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1047,audioCtx.currentTime+0.8); gain.gain.setValueAtTime(0.2,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.8); osc.start(); osc.stop(audioCtx.currentTime+0.8); }
  else if(type==='wrong'){ osc.frequency.setValueAtTime(200,audioCtx.currentTime); gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3); osc.start(); osc.stop(audioCtx.currentTime+0.3); }
}
let musicInterval=null;
function startMusic(){
  if(musicInterval) return;
  const notes=[349,392,440,494,440,392,349,330];
  let i=0;
  musicInterval=setInterval(()=>{
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(notes[i%notes.length],audioCtx.currentTime);
    g.gain.setValueAtTime(0.02,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.6);
    i++;
  },800);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } }
function showVictory(){
  const div=document.createElement('div'); div.id='victoryOverlay';
  div.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;';
  document.body.appendChild(div);
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;width:6px;height:6px;background:hsl(${Math.random()*360},100%,60%);border-radius:50%;left:50%;top:50%;`;
    div.appendChild(p);
    const angle=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    p.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1)`,opacity:0}],{duration:800,delay:Math.random()*300,fill:'forwards'});
  }
  const txt=document.createElement('div'); txt.textContent='🎉 恭喜通关！';
  txt.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 20px #ff0;';
  div.appendChild(txt);
  setTimeout(()=>{ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); },3000);
}
function removeVictory(){ const ov=document.getElementById('victoryOverlay'); if(ov) ov.remove(); }

let target, count;
function init(){
  target=Math.floor(Math.random()*100)+1; count=0;
  document.getElementById('hint').textContent=''; document.getElementById('count').textContent='';
  document.getElementById('guess').value='';
  stopMusic(); startMusic(); removeVictory(); notifyPlayed();
}
function check(){
  initAudio();
  const g=parseInt(document.getElementById('guess').value);
  if(!g) return; count++;
  if(g===target){
    document.getElementById('hint').textContent='🎉 答对了！';
    document.getElementById('count').textContent='用了 '+count+' 次';
    stopMusic(); playSound('win'); showVictory(); setTimeout(init,3000);
  }else{
    if(g<target) document.getElementById('hint').textContent='📈 太小了';
    else document.getElementById('hint').textContent='📉 太大了';
    document.getElementById('count').textContent='已猜 '+count+' 次';
    playSound('wrong');
  }
}
document.getElementById('checkBtn').onclick=check;
document.getElementById('restartBtn').onclick=init;
init();
</script>
</body>
</html>
