<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#333;color:#fff;font-family:sans-serif;}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#fff;padding:4px;}
.cell{width:80px;height:80px;background:#333;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;}
</style></head><body>
<div><div class="board" id="board"></div><p id="msg" style="text-align:center;"></p></div>
<script>
let board=Array(9).fill(null),turn='X',gameover=false;
function draw(){
  const b=document.getElementById('board');
  b.innerHTML='';
  board.forEach((v,i)=>{
    const d=document.createElement('div');d.className='cell';d.textContent=v||'';
    d.onclick=()=>move(i);b.appendChild(d);
  });
}
function move(i){
  if(gameover||board[i])return;
  board[i]=turn;
  if(checkWin(turn)){document.getElementById('msg').textContent=turn+'赢了！';gameover=true;draw();return;}
  if(board.every(v=>v)){document.getElementById('msg').textContent='平局';gameover=true;draw();return;}
  turn=turn==='X'?'O':'X';draw();
}
function checkWin(p){
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return wins.some(w=>w.every(i=>board[i]===p));
}
draw();
</script></body></html>
